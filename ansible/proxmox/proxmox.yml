---
# Host-level state for proxmox-01 (192.168.1.3), the home hypervisor, plus the
# Debian 13 template and the k3s agent VMs on it.
#
# Applied by the `proxmox` job in .github/workflows/deploy-infra.yaml. Two access
# paths:
#   - apt repos + the template build run over SSH as root on the host
#     (the API cannot import a downloaded qcow2 as a VM disk).
#   - VM lifecycle runs from the control node against the Proxmox API
#     (community.proxmox), delegated to localhost.
#
# It also templates /etc/network/interfaces (previously hand-crafted) so the
# e1000e I219-V offload workaround is version-controlled, and installs two
# watchdogs -- see tasks/host-network.yml / nic-watchdog.yml / host-watchdog.yml.
# Networking changes need care: CI reaches this box through a pod on it, so a
# bad one is not remotely recoverable. The interfaces template only lands; a
# human applies it with `ifreload -a` from the LAN.
#
# Deliberately NOT managed:
#   - the subscription key / "no valid subscription" nag
#   - the Proxmox cluster config and /etc/pve
#   - /root/.ssh/authorized_keys (a symlink into the cluster-managed
#     /etc/pve/priv/; the CI key is already there)
#   - VM deletion -- never automated. k3s on the VMs is ansible/k3s/'s job.

- name: Manage the Proxmox host and its k3s VMs
  hosts: proxmox
  gather_facts: true
  # Must match every other gathering play -- see ansible.cfg. No task here
  # reads a host fact; min keeps a `package`-style implicit mini-gather from
  # firing, and the hardware scan stays skipped.
  gather_subset:
    - "!all"
    - min
    - network
  # We log in as root -- nothing to escalate.
  become: false

  vars_files:
    - vars/main.yml

  tasks:
    - name: APT repositories
      ansible.builtin.import_tasks: tasks/apt-repos.yml
      tags: [apt, repos]

    - name: Host networking
      ansible.builtin.import_tasks: tasks/host-network.yml
      tags: [host, network]

    - name: NIC watchdog
      ansible.builtin.import_tasks: tasks/nic-watchdog.yml
      tags: [host, nic]

    - name: Host watchdog
      ansible.builtin.import_tasks: tasks/host-watchdog.yml
      tags: [host, watchdog]

    - name: Glances web server
      ansible.builtin.import_role:
        name: glances
      tags: [host, glances]

    - name: Debian 13 cloud template
      ansible.builtin.import_tasks: tasks/vm-template.yml
      tags: [vm, template]

    - name: K3s agent VMs
      ansible.builtin.import_tasks: tasks/vm-provision.yml
      tags: [vm, provision]

  handlers:
    # Fires only when a repo definition changed. A misconfigured repo makes
    # this fail loudly, which is the signal we want.
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    # Unit-file changes only (nic-watchdog.service / .timer). Reload only --
    # the timer's enable/start is a separate task, and a running nic-watchdog
    # invocation is a no-op unless the NIC is actually down.
    - name: Reload the systemd manager configuration
      listen: reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    # Swap the live watchdog module. Only closes/reopens /dev/watchdog -- no
    # network impact, VM/HA state untouched. A no-op restart if iTCO_wdt is
    # already the active module. Skipped under --check on a first run: the
    # config files were only simulated.
    - name: Switch the active watchdog module
      listen: switch watchdog module
      when: not ansible_check_mode
      ansible.builtin.shell: |
        systemctl stop watchdog-mux
        modprobe -r softdog || true
        modprobe iTCO_wdt
        systemctl start watchdog-mux
      changed_when: true
