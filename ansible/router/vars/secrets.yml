---
# Pulled from the environment. CI sets these from the `prod` GitHub
# Environment secrets. For a local run, put them in the gitignored
# ansible/router/secrets.env (same names) and:
#   set -a; . router/secrets.env; set +a
#
# Only the masked diff from templates/apply.sh.j2 is printed; the apply task
# itself is no_log.

router_pppoe_username: "{{ lookup('ansible.builtin.env', 'ROUTER_PPPOE_USERNAME') }}"
router_pppoe_password: "{{ lookup('ansible.builtin.env', 'ROUTER_PPPOE_PASSWORD') }}"
router_wifi_key: "{{ lookup('ansible.builtin.env', 'ROUTER_WIFI_KEY') }}"

# Per-profile PPSK for the IoT SSIDs. Keyed by router_iot_vlans[].name.
router_iot_keys:
  iot_inet: "{{ lookup('ansible.builtin.env', 'ROUTER_WIFI_IOT_KEY_INET') }}"
  iot_local: "{{ lookup('ansible.builtin.env', 'ROUTER_WIFI_IOT_KEY_LOCAL') }}"
  iot_echo: "{{ lookup('ansible.builtin.env', 'ROUTER_WIFI_IOT_KEY_ECHO') }}"

# Optional. The root password's crypt hash (the second field of its
# /etc/shadow line); unset leaves the password alone.
router_root_password_hash: "{{ lookup('ansible.builtin.env', 'ROUTER_ROOT_PASSWORD_HASH') }}"

# Optional. A reusable, non-ephemeral auth key tagged tag:home-router. Only
# used when the router is logged out of the tailnet, as after a wipe; the
# run fails then if it's unset.
router_tailscale_authkey: "{{ lookup('ansible.builtin.env', 'ROUTER_TS_AUTHKEY') }}"
