---
# Avahi as an mDNS reflector across br-lan (homelab), br-trusted and every IoT
# VLAN bridge (mdns_reflector_interfaces), so Home Assistant on homelab keeps
# discovering the ESPHome / IoT devices on the Wi-Fi VLANs. mDNS is link-local
# multicast and does not cross the router on its own; without this, a device's
# IP change is invisible to HA until the stale DNS record expires (Kea DDNS
# default TTL is lease-lifetime / 3 = 8h). It also publishes the router's own
# address as <hostname>.local on every listed bridge.
#
# The reflector is hub-and-all, not per-pair, so mDNS service discovery is also
# visible *between* IoT VLANs. That is accepted: the firewall still blocks all
# L3 traffic between them, only the advertised records leak.
#
# lan and trusted zones are input ACCEPT; the IoT zones are input REJECT with
# an explicit udp/5353 -> 224.0.0.251 accept (tasks/firewall.yml). When the
# lan/trusted zones are tightened, UDP 5353 to the router must stay open there
# too.
#
# avahi-nodbus-daemon (the D-Bus-free build) comes from the firmware
# (router/packages.txt; tasks/firmware.yml asserts it). Use that package, not
# `avahi-daemon`: on 24.10 that name is a transitional alias that pulls in the
# D-Bus build plus dbus/libdbus.

- name: Avahi config directory
  community.openwrt.file:
    path: /etc/avahi
    state: directory

- name: Avahi reflector config
  community.openwrt.template:
    src: avahi-daemon.conf.j2
    dest: /etc/avahi/avahi-daemon.conf
  notify: Restart avahi-daemon

- name: avahi-daemon enabled and running
  community.openwrt.service:
    name: avahi-daemon
    enabled: true
    state: started
