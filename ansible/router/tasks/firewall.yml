---
# Stock OpenWrt firewall with these changes: wan drops rather than rejects, a
# tailscale0 zone so forwarded tailnet traffic isn't dropped by fw4, and a
# trusted zone for the trusted VLAN. Traffic between lan and trusted is fully
# open for now; tighten later.
#
# IoT zones (iot_inet / iot_local / iot_echo) are the opposite -- default
# deny. lan, trusted and tailscale0 may initiate in; IoT may not initiate
# back and IoT VLANs cannot reach each other. Only iot_inet / iot_echo get a
# route to the wan. `input REJECT` on each, with narrow rules for the router
# services IoT clients need: DHCP relay, DNS to Pi-hole, NTP, mDNS. iot_park
# (the wifi-iface base network) drops everything.
#
# Everything except the stock `wan` zone is rendered by templates/firewall.uci.j2
# and applied in one `uci batch` -- far fewer SSH round trips than a task per
# section. The managed sections are named; templates/firewall-anon-cleanup.sh.j2
# first removes the anonymous copies an existing or freshly-bootstrapped router
# starts with.

- name: wan zone drops input
  community.openwrt.uci:
    command: section
    config: firewall
    type: zone
    find: { name: wan }
    value:
      input: DROP
    autocommit: true
  notify: Reload firewall

- name: Reconcile anonymous firewall sections into the named set
  ansible.builtin.raw: "{{ lookup('template', 'firewall-anon-cleanup.sh.j2') }}"
  register: router_fw_cleanup
  changed_when: "'MIGRATED' in router_fw_cleanup.stdout"
  notify: Reload firewall

- name: Managed firewall zones, forwardings and IoT punch-through rules
  community.openwrt.uci:
    command: batch
    config: firewall
    value: "{{ lookup('template', 'firewall.uci.j2').splitlines() | select | join('\n') }}"
    autocommit: true
  notify: Reload firewall
