---
# Collections every layer needs, beyond ansible-core (which is all CI installs;
# it is pinned in .github/actions/ansible-setup/requirements.txt).
#
#   community.general   lvol, filesystem -- the LVM layer on the Pi's SSD; also
#                       used by the k3s.orchestration roles
#   ansible.posix       mount (fstab entries), sysctl (k3s prereq role)
#   community.proxmox   proxmox_kvm / proxmox_disk -- VM lifecycle via the
#                       Proxmox API. Needs `proxmoxer>=2.3.0` and `requests`
#                       on the control node
#   community.openwrt   the router's uci / service / nohup modules. Run in ash,
#                       so nothing needs Python on that target
#   ansible.utils       ipwrap, in the k3s server/agent roles -- also needs the
#                       `netaddr` python library on the control node
#   k3s.orchestration   the k3s-io/k3s-ansible roles (prereq, k3s_server,
#                       k3s_agent). NOT on Galaxy -- installed from the git tag
#
# All pinned: an unpinned release could change what a deploy does to live
# infrastructure without a commit.
#
# Install with:  ansible-galaxy collection install -r requirements.yml
#            and: pip install 'proxmoxer>=2.3.0' requests netaddr

collections:
  - name: community.general
    version: "13.3.0"
  - name: ansible.posix
    version: "2.2.2"
  - name: community.proxmox
    version: "2.0.0"
  - name: community.openwrt
    version: "1.6.0"
  - name: ansible.utils
    version: "5.1.2"
  - name: https://github.com/k3s-io/k3s-ansible.git
    type: git
    version: "1.2.2"
