---
# Host metrics for Prometheus (deploy/internal/monitoring/): CPU, memory,
# load, filesystem, disk I/O, network, temperature -- every default
# collector, with real device/mountpoint/interface labels instead of
# Glances' name-encodes-identity scheme. Replaces the glances role.
#
# On the Pi only (node_exporter_lvm_collector), also feeds the textfile
# collector from the community lvm-prom-collector script (vendored in
# files/, not fetched at apply time) on a systemd timer -- the `data` VG's
# free space (ansible/node/vars/storage.yml), which no default node_exporter
# collector covers.

- name: Install node_exporter
  ansible.builtin.package:
    name: prometheus-node-exporter
    state: present

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: node_exporter_lvm_collector

- name: Configure node_exporter
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the node_exporter role. Do not edit on the host.
      ARGS="--web.listen-address={{ node_exporter_bind_address }}:{{ node_exporter_port }}{% if node_exporter_lvm_collector %} --collector.textfile --collector.textfile.directory={{ node_exporter_textfile_dir }}{% endif %}"
  notify: restart prometheus-node-exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Install the lvm-prom-collector script
  ansible.builtin.copy:
    src: lvm-prom-collector
    dest: /usr/local/bin/lvm-prom-collector
    owner: root
    group: root
    mode: "0755"
  when: node_exporter_lvm_collector

- name: Install the lvm-prom-collector systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/lvm-prom-collector.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the node_exporter role. Do not edit on the host.
      [Unit]
      Description=Write LVM metrics for node_exporter's textfile collector

      [Service]
      Type=oneshot
      User=root
      # Atomic write -- node_exporter must never read a half-written file.
      # vgs/lvs need root to read LVM metadata.
      ExecStart=/bin/sh -c '/usr/local/bin/lvm-prom-collector -g -p > {{ node_exporter_textfile_dir }}/lvm.prom.tmp && mv {{ node_exporter_textfile_dir }}/lvm.prom.tmp {{ node_exporter_textfile_dir }}/lvm.prom'
  notify: reload systemd for lvm-prom-collector
  when: node_exporter_lvm_collector

- name: Install the lvm-prom-collector systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/lvm-prom-collector.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the node_exporter role. Do not edit on the host.
      [Unit]
      Description=Run lvm-prom-collector every minute

      [Timer]
      OnCalendar=*-*-* *:*:00
      AccuracySec=1s

      [Install]
      WantedBy=timers.target
  notify: reload systemd for lvm-prom-collector
  when: node_exporter_lvm_collector

- name: Enable and start the lvm-prom-collector timer
  ansible.builtin.systemd_service:
    name: lvm-prom-collector.timer
    enabled: true
    state: started
  when: node_exporter_lvm_collector and not ansible_check_mode
