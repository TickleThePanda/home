---
# Host metrics for Prometheus (k8s/apps/internal/monitoring/): CPU, memory,
# load, filesystem, disk I/O, network, temperature -- every default
# collector, with real device/mountpoint/interface labels instead of
# Glances' name-encodes-identity scheme. Replaces the glances role.
#
# prometheus-node-exporter-collectors adds the textfile collector scripts.
# Its apt timer (enabled by the package) writes pending upgrades and
# node_reboot_required on every host. On the Pi only
# (node_exporter_lvm_collector), its lvm-prom-collector also runs on a timer
# for the `data` VG's free space (ansible/node/vars/storage.yml), which no
# default node_exporter collector covers. Both come from the distro, so they
# update with the OS.

- name: Install node_exporter and the textfile collector scripts
  ansible.builtin.package:
    name:
      - prometheus-node-exporter
      - prometheus-node-exporter-collectors
    state: present

- name: Configure node_exporter
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the node_exporter role. Do not edit on the host.
      ARGS="--web.listen-address={{ node_exporter_bind_address }}:{{ node_exporter_port }} --collector.textfile.directory={{ node_exporter_textfile_dir }}"
  notify: restart prometheus-node-exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Remove the old vendored lvm-prom-collector
  ansible.builtin.file:
    path: /usr/local/bin/lvm-prom-collector
    state: absent

- name: Install the lvm-prom-collector systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/lvm-prom-collector.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the node_exporter role. Do not edit on the host.
      [Unit]
      Description=Write LVM metrics for node_exporter's textfile collector

      [Service]
      Type=oneshot
      User=root
      # Atomic write -- node_exporter must never read a half-written file.
      # vgs/lvs need root to read LVM metadata.
      ExecStart=/bin/sh -c '/usr/share/prometheus-node-exporter-collectors/lvm-prom-collector -g -p > {{ node_exporter_textfile_dir }}/lvm.prom.tmp && mv {{ node_exporter_textfile_dir }}/lvm.prom.tmp {{ node_exporter_textfile_dir }}/lvm.prom'
  notify: reload systemd for lvm-prom-collector
  when: node_exporter_lvm_collector

- name: Install the lvm-prom-collector systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/lvm-prom-collector.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the node_exporter role. Do not edit on the host.
      [Unit]
      Description=Run lvm-prom-collector every minute

      [Timer]
      OnCalendar=*-*-* *:*:00
      AccuracySec=1s

      [Install]
      WantedBy=timers.target
  notify: reload systemd for lvm-prom-collector
  when: node_exporter_lvm_collector

- name: Enable and start the lvm-prom-collector timer
  ansible.builtin.systemd_service:
    name: lvm-prom-collector.timer
    enabled: true
    state: started
  when: node_exporter_lvm_collector and not ansible_check_mode
