---
# Self-contained: daemon_reload here rather than notifying a play-level
# handler, matching the rest of this repo's exporter roles.
- name: restart prometheus-node-exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: reload systemd for lvm-prom-collector
  ansible.builtin.systemd_service:
    name: lvm-prom-collector.timer
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode
