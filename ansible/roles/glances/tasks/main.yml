---
# Two independent glances processes on every host this role targets:
#
# 1. Web-server mode (-w), polled by gethomepage's `glances` widget
#    (deploy/internal/homepage/services.yaml) for this host's CPU temperature.
#    The packaged unit runs `-s` (Glances' own binary server protocol,
#    loopback-only) -- this replaces it with `-w` (the REST API gethomepage
#    speaks), bound to the LAN so the cluster can reach it.
#
#    The web dependency is only a package Recommends, not a hard Depends, but
#    `-w` fails at runtime without it. Which package it is depends on the
#    Glances major version the host ships -- see glances_web_package in
#    group_vars.
#
# 2. Prometheus exporter mode (--export prometheus), scraped by Prometheus
#    (deploy/internal/monitoring/) for this host's CPU/RAM/swap/load/disk/
#    network/diskio/uptime, and (Pi + proxmox-01 only) temperature. Needs
#    python3-prometheus-client -- also only a package Recommends, not a
#    hard Depends, so --export prometheus fails at runtime without it, same
#    story as the web dependency above.

- name: Install glances and its web-server and Prometheus-exporter dependencies
  ansible.builtin.package:
    name:
      - glances
      - "{{ glances_web_package }}"
      - python3-prometheus-client
    state: present

- name: Install the glances web-server systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/glances.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the glances role. Do not edit on the host.
      [Unit]
      Description=Glances web server
      After=network.target

      [Service]
      User=glances
      Group=glances
      ExecStart=/usr/bin/glances -w -B {{ glances_bind_address }} -p {{ glances_port }} --disable-webui
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: restart glances

# On a first-ever --check run the unit above was only simulated, so systemctl
# has nothing real to enable. Every run after is unaffected.
- name: Enable and start glances
  ansible.builtin.systemd_service:
    name: glances
    enabled: true
    state: started
  when: not ansible_check_mode

# A second, independent process from the -w REST API above -- Glances' own
# docs treat --export prometheus and -w as separate invocations, each with
# its own config source (the exporter reads host/port from a config file,
# not CLI flags). Bound to the same per-host LAN address as the REST API, on
# its own port, so this doesn't disturb what gethomepage already consumes.
- name: Ensure /etc/glances exists
  ansible.builtin.file:
    path: /etc/glances
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the glances Prometheus exporter config
  ansible.builtin.copy:
    dest: /etc/glances/glances.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the glances role. Do not edit on the host.
      [prometheus]
      host={{ glances_bind_address }}
      port={{ glances_prometheus_port }}
      prefix=glances
  notify: restart glances-prometheus

- name: Install the glances Prometheus exporter systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/glances-prometheus.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the glances role. Do not edit on the host.
      [Unit]
      Description=Glances Prometheus exporter
      After=network.target

      [Service]
      User=glances
      Group=glances
      # --quiet suppresses Glances' curses UI, which otherwise fails to
      # initialise with no TTY attached under systemd.
      ExecStart=/usr/bin/glances --export prometheus --quiet -C /etc/glances/glances.conf
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: restart glances-prometheus

- name: Enable and start the glances Prometheus exporter
  ansible.builtin.systemd_service:
    name: glances-prometheus
    enabled: true
    state: started
  when: not ansible_check_mode
