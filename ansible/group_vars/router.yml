---
# The OpenWrt gateway. Nothing here is a Debian host, so the defaults in
# group_vars/all.yml and ansible.cfg both need overriding.

# Dropbear only offers a root login. The CI key (deploy_key, the same private
# half as the NODE_SSH_KEY secret) is in /etc/dropbear/authorized_keys, baked
# in by router/bootstrap/.
ansible_user: root

# OpenWrt ships no Python. Every task uses community.openwrt modules, which run
# in ash; this stops Ansible probing for an interpreter and overrides
# ansible.cfg's interpreter_python.
ansible_python_interpreter: /dev/null

# A longer master than the 60s in ansible.cfg, so it outlives the Apply run and
# the idempotence --check pass reuses it instead of re-dialling through the
# tunnel. Safe here and not elsewhere: the router's disruptive handlers detach
# and then wait_for_connection, so a dead socket is never left behind the way a
# k3s restart can leave one.
ansible_ssh_extra_args: -o ControlPersist=180s
