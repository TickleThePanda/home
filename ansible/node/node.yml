---
# Node-level state for k8s-storage-anchor-01 -- the layer *below* k3s.
#
# k3s itself (version, /etc/rancher/k3s/config.yaml, install) is owned by
# ansible/k3s/, which manages the Pi and the Proxmox VM agents as one cluster
# via the k3s.orchestration collection. Everything inside the cluster is owned
# by kustomize (deploy/). This playbook owns what is left: the LVM volumes and
# mounts behind the PVs, the deploy user's trusted SSH keys, the sudoers
# entries, the node's DNS resolver, swap, the Argon ONE fan, and node_exporter
# (host metrics, plus -- Pi only -- the lvm-prom-collector pair that makes
# the `data` VG's free space visible to Prometheus, deploy/internal/monitoring/).
#
# Deliberately NOT managed:
#   /etc/rancher/k3s/config.yaml            -- owned by ansible/k3s/ (agent config)
#
# Networking changes need more care than most: a bad one strands SSH/the API
# on a headless box. See tasks/network.yml's header for the guardrails that
# keep its DNS-only scope safe, and apply the same scrutiny before widening
# it to anything else.

- name: Manage k8s-storage-anchor-01 node state
  hosts: pi
  gather_facts: true
  # Must match every other gathering play -- see ansible.cfg. Nothing here
  # needs more than pkg_mgr (min); `network` is carried for the k3s layer,
  # which shares this host and this cache.
  gather_subset:
    - "!all"
    - min
    - network
  become: true

  vars_files:
    - vars/storage.yml
    - vars/argon-fan.yml

  tasks:
    - name: Trusted SSH keys
      ansible.builtin.import_role:
        name: ssh_keys
      vars:
        ssh_keys_user: deploy
      tags: [ssh-keys]

    - name: Sudoers
      ansible.builtin.import_tasks: tasks/access.yml
      tags: [access]

    - name: PV-backing directories
      ansible.builtin.import_tasks: tasks/storage.yml
      tags: [storage]

    - name: Argon ONE fan controller
      ansible.builtin.import_tasks: tasks/argon-fan.yml
      tags: [argon-fan]

    - name: node_exporter (host metrics + the `data` VG's free space)
      ansible.builtin.import_role:
        name: node_exporter
      vars:
        node_exporter_lvm_collector: true
      tags: [node-exporter]

    - name: Network
      ansible.builtin.import_tasks: tasks/network.yml
      tags: [network]

    - name: Swap
      ansible.builtin.import_tasks: tasks/swap.yml
      tags: [swap]

  handlers:
    # device reapply, not connection up -- see tasks/network.yml's header.
    # Applies to the live device in place, no interface bounce.
    - name: Reapply the wired connection's network config
      listen: Reapply the wired connection's network config
      ansible.builtin.command:
        cmd: nmcli device reapply eth0
      changed_when: true

    # Unit-file changes only (tasks/storage.yml's k3s-agent.service.d drop-in).
    # RequiresMountsFor takes effect on the next start, so this only
    # daemon-reloads -- it does not bounce k3s-agent. k3s restarts are the k3s
    # layer's concern.
    - name: Reload the systemd manager configuration
      listen: reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    # Never touches SSH or the cloudflared tunnel, so a plain restart is fine.
    # Skipped under --check on a first-ever run, same reasoning as
    # tasks/argon-fan.yml's enable task: the unit file was only simulated, so
    # there's nothing real yet for systemctl to restart.
    - name: Restart argon-fan
      listen: restart argon-fan
      ansible.builtin.systemd_service:
        name: argon-fan
        state: restarted
      when: not ansible_check_mode
