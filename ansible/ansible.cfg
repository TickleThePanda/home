[defaults]
inventory = inventory.yml
roles_path = roles
# No stdout_callback override: the `yaml` callback was removed from
# ansible-core, and setting it is a hard startup error, not a fallback.
nocows = 1
retry_files_enabled = False
host_key_checking = True
interpreter_python = /usr/bin/python3

# Run the k3s agent play against the three agents at once. Serialising only
# matters with more than one server -- the k3s.orchestration roles restart each
# server as they reach it, and rolling that past a single etcd member would
# lose quorum. There is one server; drop back to forks = 1 if a second is added.
# Every other play is single-host, so this changes nothing for them.
forks = 4

# One cache, shared by every layer, so gather once and reuse for the rest of
# the run -- including the idempotence --check re-run, which then skips the SSH
# round-trip to re-run setup.
#
# Every play that gathers MUST use the same gather_subset (!all, min, network).
# There is no ansible.cfg key for it -- it has to be repeated per play. Under
# `smart` a cached entry wins and the play's own subset is ignored, so a layer
# that gathered less would starve one that needs more: k3s.orchestration's
# prereq role reads all_ipv6_addresses and (in k3s.nft.j2) default_ipv4, both
# of which live in `network`. Everything else needs only `min`, but they share
# one cache, so they share one subset. The router never gathers at all
# (gather_facts: false).
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_fact_cache
fact_caching_timeout = 7200

[inventory]
unparsed_is_failed = True

[ssh_connection]
# Several layers disturb the transport they are reached over: a k3s restart
# blips the in-cluster cloudflared tunnel, and the router's own handlers drop
# the connection deliberately. Keepalives stop a brief blip from failing an
# otherwise-fine run; the disruptive handlers detach and reconnect with
# wait_for_connection.
#
# ControlPersist is 60s here and raised to 180s for the gateway only
# (group_vars/router.yml) -- long enough there to outlive the Apply run so the
# idempotence pass reuses the master, but not so long elsewhere that a socket
# dead from a k3s restart keeps being multiplexed onto.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes
control_path_dir = ~/.ansible/cp
pipelining = True
