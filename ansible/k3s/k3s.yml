---
# k3s across every node: k3s-vm-control-01 (server) and the Pi plus the two
# worker VMs (agents), one cluster. Owns the k3s version,
# /etc/rancher/k3s/config.yaml, the VM node resolver, and the install/join.
# The layer below k3s on the Pi -- storage, its DNS resolver, swap, sudoers,
# the fan -- stays in ansible/node/.
#
# This composes the k3s.orchestration roles rather than importing that
# collection's playbooks/site.yml, which hardcodes the `raspberrypi` role.
# That role edits the Pi's /boot cmdline and notifies a full reboot -- a
# reboot kills the in-cluster cloudflared pod that is CI's own transport
# (see ansible/node/RECOVERY.md). Its only real effects (cgroup cmdline args,
# iptables-legacy for pre-1.6.2) are already satisfied on a running cluster.
#
# The k3s_server / k3s_agent roles restart k3s with a plain synchronous
# `service: state=restarted`, unlike the node layer's detached restart. A k3s restart
# keeps pods (cloudflared included) up, so the tunnel only blips;
# ansible.cfg's keepalives cover it. Do the first run by hand from the LAN.

- name: Cluster prerequisites
  hosts: k3s_cluster
  gather_facts: true
  # Must match every other gathering play -- see ansible.cfg. The prereq /
  # k3s_server / k3s_agent roles read distribution, kernel, hostname,
  # service_mgr (min) and default_ipv4 / all_ipv6_addresses (network);
  # ansible_facts.packages / .services come from their own *_facts tasks.
  gather_subset:
    - "!all"
    - min
    - network
  become: true
  pre_tasks:
    # Fix node DNS before anything that needs to resolve a name. The VMs ship
    # from cloud-init pointing at the in-cluster Pi-hole; that cannot be a
    # dependency of starting the cluster.
    - name: Pin the VM node resolvers to Quad9
      ansible.builtin.import_tasks: tasks/node-dns.yml
      when: inventory_hostname != 'k8s-storage-anchor-01'

    # The k3s_server / k3s_agent roles run /usr/local/bin/k3s-install.sh
    # unconditionally, and fetch get.k3s.io (upstream's latest) only when the
    # file is absent. Fetching the script from the k3s_version tag here keeps
    # every node's installer at the release it installs. force: true replaces
    # it when k3s_version changes; get_url reports a change only then.
    - name: Install the k3s install script for k3s_version
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh"
        dest: /usr/local/bin/k3s-install.sh
        mode: "0755"
        force: true

    # The kubelet's image GC defaults (start at 85% disk, free down to 80%)
    # sit above HostDiskSpaceLow's 80% alert, so stale images left by
    # Renovate bumps fire the alert before GC ever runs on the 24G VM disks.
    # A drop-in rather than server_config_yaml / agent_config_yaml so one
    # setting covers every node; `kubelet-arg+` appends to, not replaces, any
    # kubelet-arg set in config.yaml. Applied by the restart the roles below
    # do every run.
    - name: Start kubelet image GC below the disk alert
      block:
        - name: Ensure the k3s config drop-in directory exists
          ansible.builtin.file:
            path: /etc/rancher/k3s/config.yaml.d
            state: directory
            mode: "0755"
        - name: Write the image GC thresholds
          ansible.builtin.copy:
            dest: /etc/rancher/k3s/config.yaml.d/image-gc.yaml
            mode: "0644"
            content: |
              kubelet-arg+:
                - image-gc-high-threshold=70
                - image-gc-low-threshold=60

    # Graceful node shutdown: on a host shutdown (proxmox-01 stopping its VMs,
    # or any reboot kured didn't drain first) the kubelet holds a systemd
    # inhibitor lock and terminates pods before the node goes down, critical
    # pods last.
    - name: Terminate pods gracefully on node shutdown
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml.d/graceful-shutdown.yaml
        mode: "0644"
        content: |
          kubelet-arg+:
            - shutdown-grace-period=90s
            - shutdown-grace-period-critical-pods=30s

    # Authenticate docker.io pulls so the cluster draws on an account's
    # Docker Hub rate limit instead of the shared anonymous per-IP one.
    # Skipped when the credentials are absent (a hand run without them
    # exported), which leaves any existing registries.yaml in place. k3s
    # re-reads this file only on restart -- the k3s_server / k3s_agent roles
    # below restart every run, so a change here lands in the same run.
    - name: Authenticate docker.io pulls (raises the Docker Hub rate limit)
      when: docker_pull_token | length > 0
      block:
        - name: Ensure the k3s config directory exists
          ansible.builtin.file:
            path: /etc/rancher/k3s
            state: directory
            mode: "0755"
        - name: Write the registry credentials
          ansible.builtin.copy:
            dest: /etc/rancher/k3s/registries.yaml
            mode: "0600"
            content: |
              mirrors:
                docker.io:
                  endpoint:
                    - "https://index.docker.io/v2"
              configs:
                "https://index.docker.io/v2":
                  auth:
                    username: "{{ docker_pull_username }}"
                    password: "{{ docker_pull_token }}"
  roles:
    - role: k3s.orchestration.prereq

- name: K3s server (k3s-vm-control-01)
  hosts: server
  gather_facts: false
  become: true
  vars_files:
    - vars/versions.yml
  roles:
    - role: k3s.orchestration.k3s_server

- name: K3s agents (the Pi and the two worker VMs)
  hosts: agent
  gather_facts: false
  become: true
  vars_files:
    - vars/versions.yml
  roles:
    - role: k3s.orchestration.k3s_agent

- name: Cluster-visible node state
  hosts: server
  gather_facts: false
  become: true
  tasks:
    - name: Node labels and the control-VM cordon
      ansible.builtin.import_tasks: tasks/node-labels.yml

# The Pi's own node_exporter and unattended-upgrades are node.yml's job; this
# covers the three VMs, which have no other layer of their own. Unrelated to
# k3s itself, so it runs last -- nothing here should compete for attention
# with the plays above if something in them needs fixing.
- name: node_exporter and unattended-upgrades on the k3s VMs
  hosts: k3s_cluster:!pi
  gather_facts: false
  become: true
  vars:
    # Each VM's own address -- unlike group_vars/pi.yml or
    # group_vars/proxmox.yml there are three of these, so compute it from the
    # `network` facts the first play in this file already gathered.
    node_exporter_bind_address: "{{ ansible_default_ipv4.address }}"
  roles:
    - role: node_exporter
      tags: [node-exporter]
    - role: unattended_upgrades
      tags: [unattended-upgrades]

# Same reasoning as the node_exporter play above: the Pi's own deploy user is
# node.yml's job, so it's excluded here. cloud-init only ever sets a VM's
# trusted keys once, at clone time (ansible/proxmox/tasks/vm-provision.yml)
# -- this is what keeps them current afterwards.
- name: Deploy user's trusted SSH keys on the k3s VMs
  hosts: k3s_cluster:!pi
  gather_facts: false
  become: true
  roles:
    - role: ssh_keys
      vars:
        ssh_keys_user: deploy
  tags: [ssh-keys]
