---
# Cluster-visible state that k3s only reads at first node registration, so it
# has to go through the API for an already-registered node. Runs on the sole
# server (k3s-vm-control-01) via its local `k3s kubectl`; labelling and
# tainting another node by name is a plain API call, so targeting the Pi from
# here works fine.

- name: Wait for the k3s API to be ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw /readyz
  register: k3s_readyz
  until: k3s_readyz.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  check_mode: false

# The `data` volume group only exists on the Pi. This label is its
# cluster-visible projection: the lvm-data StorageClass allowedTopologies and
# the LVM CSI node plugin key off it, so a node-name change never touches the
# StorageClass. Value mirrors node_vg in ansible/node/vars/storage.yml.
- name: Label the Pi as the host of the lvm-data volume group
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - label
      - node
      - k8s-manager-1
      - ticklethepanda.dev/lvm-vg=data
      - --overwrite
  register: lvm_vg_label
  changed_when: >-
    'labeled' in lvm_vg_label.stdout
    and 'not labeled' not in lvm_vg_label.stdout

# k3s-vm-control-01 is the sole control-plane node. It must run no portable
# workloads -- the two worker VMs and the Pi carry everything. A NoSchedule
# taint with a custom key (nothing tolerates it by accident) does that
# durably; clear the operational cordon left from when it joined as a second
# server. k3s core DaemonSets (flannel, kube-proxy) and multus tolerate all
# NoSchedule taints and still run.
- name: Uncordon k3s-vm-control-01
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - uncordon
      - k3s-vm-control-01
  register: control_uncordon
  changed_when: "'already uncordoned' not in control_uncordon.stdout"

- name: Read k3s-vm-control-01's current taints
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - k3s-vm-control-01
      - -o
      - jsonpath={.spec.taints[?(@.key=="ticklethepanda.dev/control-plane")]}
  register: control_taint
  changed_when: false

- name: Taint k3s-vm-control-01 control-plane-only
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - taint
      - node
      - k3s-vm-control-01
      - ticklethepanda.dev/control-plane=:NoSchedule
      - --overwrite
  when: '"NoSchedule" not in control_taint.stdout'

# The Pi is the sole control-plane and also anchors every lvm-data volume.
# PreferNoSchedule keeps the scheduler from stacking portable pods on top of
# that load without hard-blocking them if the worker VMs are full. Storage-
# pinned pods have a node-affinity to the Pi that outweighs the penalty.
# `kubectl taint --overwrite` always prints "modified", so gate on a
# pre-read instead of parsing its output.
- name: Read the Pi's current taints
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - node
      - k8s-manager-1
      - -o
      - jsonpath={.spec.taints[?(@.key=="ticklethepanda.dev/prefer-no-schedule")]}
  register: pi_taint
  changed_when: false

- name: Prefer no scheduling onto the Pi
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - taint
      - node
      - k8s-manager-1
      - ticklethepanda.dev/prefer-no-schedule=storage-anchor:PreferNoSchedule
      - --overwrite
  when: >-
    '"value":"storage-anchor"' not in pi_taint.stdout
    or '"effect":"PreferNoSchedule"' not in pi_taint.stdout
