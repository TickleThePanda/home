---
# Single source of truth for the cluster's k3s version.
#
# `k3s.orchestration` reads `k3s_version` to install/upgrade every node.
# `traefik_chart_version` is NOT rendered anywhere -- kustomize stays the sole
# owner of everything under deploy/. It exists so
# scripts/check-traefik-pin.sh can assert it matches
# deploy/setup/traefik/traefik-helm-chart.yaml, because k3s only ever serves
# the chart tarball bundled with the *installed* k3s version.
#
# To find the right chart version for a k3s release (note the %2B):
#   curl -s "https://api.github.com/repos/k3s-io/k3s/contents/manifests/traefik.yaml?ref=v1.33.13%2Bk3s2" \
#     -H 'Accept: application/vnd.github.raw' | grep chart:
#
# Upgrades go one minor at a time -- Kubernetes does not support skipping.
# Current target chain: 1.33 -> 1.34 -> 1.35 -> 1.36

k3s_version: "v1.33.13+k3s2"
traefik_chart_version: "40.1.4+up40.1.0"

# The disabled k3s addons live in server_config_yaml
# (group_vars/k3s_cluster.yml), not here -- they are k3s config, not a version.
