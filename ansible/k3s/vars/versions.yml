---
# Single source of truth for the cluster's k3s version.
#
# `k3s.orchestration` reads `k3s_version` to install/upgrade every node.
#
# Upgrades go one minor at a time -- Kubernetes does not support skipping.
# Renovate automerges patches and minors, one minor per branch:
# - scripts/check-versions.sh fails any branch that moves more than one minor
#   past main, so only the next minor merges.
# - k3s.yml's first play refuses to deploy a minor that any node would skip,
#   so a failed upgrade halts the chain until a human fixes it.

k3s_version: "v1.34.12+k3s1"

# The disabled k3s addons live in server_config_yaml
# (group_vars/k3s_cluster.yml), not here -- they are k3s config, not a version.
