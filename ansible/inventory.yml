# Every Ansible-managed host, in one inventory.
#
# Groups are layers, except `k3s_cluster > server / agent`, whose names are
# mandatory -- the k3s.orchestration roles key off them.
#
# k8s-manager-1 is deliberately in TWO layers: `pi` owns what sits below k3s
# on it (LVM, sudoers, resolver, swap, fan), `agent` owns k3s itself. Because
# the host sets intersect, never scope a run with --limit alone -- limiting to
# `pi` still matches the k3s agent play and would drag the Pi through a k3s
# reinstall. Select whole layer playbooks instead (see site.yml).
#
# Connection settings live in group_vars/, not here.

all:
  children:
    router:
      hosts:
        gateway:
          ansible_host: 192.168.1.1

    proxmox:
      hosts:
        proxmox-01:
          ansible_host: 192.168.1.3

    pi:
      hosts:
        k8s-manager-1:
          ansible_host: 192.168.1.2

    k3s_cluster:
      children:
        server:
          hosts:
            k3s-vm-control-01:
              ansible_host: 192.168.1.32
        agent:
          hosts:
            # The storage anchor: every lvm-data volume lives on its SSD, and
            # the OpenEBS PVs' nodeAffinity keys off this node name. Listed
            # first for readability only.
            k8s-manager-1:
              ansible_host: 192.168.1.2
            k3s-vm-worker-01:
              ansible_host: 192.168.1.33
            k3s-vm-worker-02:
              ansible_host: 192.168.1.34

    # The control node itself. community.proxmox's VM tasks run
    # `delegate_to: localhost` and import proxmoxer, which lives in the same
    # venv as ansible -- not the host's /usr/bin/python3 that ansible.cfg pins.
    # Its own group so no play can sweep it up; delegation works regardless of
    # group membership or --limit.
    control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
