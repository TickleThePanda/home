apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: geopulse-ticklethepanda-co-uk
spec:
  dnsNames:
    - geopulse.ticklethepanda.co.uk
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  secretName: geopulse-ticklethepanda-co-uk
