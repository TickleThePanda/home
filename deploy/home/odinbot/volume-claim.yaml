---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvm-data
  resources:
    requests:
      # 2Gi, not the 128Mi this claim asked for under local-storage. The
      # volume had already grown to 228M against that unenforced number.
      storage: 2Gi
