# One real logical volume per PVC, carved out of the `data` volume group.
#
# The difference from `local-path` is enforcement. local-path runs a bare
# `mkdir` and bind-mounts the result, so a PVC's `storage:` request is a
# comment -- one app can fill the filesystem every other app's data is on. Here
# the request is the size of a block device, and the app hits ENOSPC inside its
# own volume without anything else on the node noticing.
#
# These are ordinary LVs with ordinary ext4 on them. If this driver is ever
# broken or removed, `mount /dev/data/<lv> /mnt/somewhere` still gets the data
# back -- which is what makes a CSI driver defensible on a single-node cluster
# where nobody is on call.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lvm-data
  annotations:
    # The default since every volume moved off local-path and `local-storage`
    # joined k3s_disable in node/vars/versions.yml. A PVC that names no class
    # gets a real block device rather than a directory on the root filesystem.
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: local.csi.openebs.io
parameters:
  storage: lvm
  # Must match `node_vg` in node/vars/storage.yml, and the `allowedTopologies`
  # value below. Three mirrors of one name across the Ansible/kustomize boundary;
  # keep them in step.
  volgroup: data
  fsType: ext4
# The driver carves the LV on the node the pod lands on, so binding has to wait
# for a scheduling decision. Single node here, but it is a hard requirement of
# the driver rather than a tuning choice.
volumeBindingMode: WaitForFirstConsumer
# Pin provisioning to the node whose LVM volume group backs this class, so a
# second node added later cannot get a pod scheduled onto it with no backing VG
# and leave the PVC unbindable. The gate is a capability label, not node
# identity: `ticklethepanda.dev/lvm-vg` is set from `node_vg` by
# node/tasks/k3s-node-labels.yml, so renaming the OS hostname or the k3s node
# name never touches this class or the label wiring. The value mirrors
# `parameters.volgroup` above.
#
# The driver still stamps every PV it creates with an `openebs.io/nodename`
# nodeAffinity keyed to the k3s node name, regardless of this block. On a node
# rename that is the one thing that breaks, and the one accepted manual fix:
# re-point existing PVs' nodeAffinity by hand.
#
# The node plugin only publishes this key as a CSI topology segment when it is
# listed in `ALLOWED_TOPOLOGIES` -- see the patch in kustomization.yaml.
allowedTopologies:
  - matchLabelExpressions:
      - key: ticklethepanda.dev/lvm-vg
        values:
          - data
# The reason this class exists at all: `local-path` is allowVolumeExpansion
# false, so growing any volume today means recreate-and-copy. Here it is
# `kubectl patch pvc` with the pod still running.
allowVolumeExpansion: true
reclaimPolicy: Delete
