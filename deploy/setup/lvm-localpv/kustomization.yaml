apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/openebs/lvm-localpv/v1.9.1/deploy/lvm-operator.yaml
  - ./storage-class.yaml

# Upstream's deploy manifest is the in-tree development one: it ships
# `image: openebs/lvm-driver:ci` in both the controller Deployment and the node
# DaemonSet. A floating tag on the component that owns every volume on the node
# is not acceptable, so pin it to the release matching the manifest above.
images:
  - name: openebs/lvm-driver
    newTag: "1.9.1"
