apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/openebs/lvm-localpv/v1.9.1/deploy/lvm-operator.yaml
  - ./storage-class.yaml

# Upstream's deploy manifest is the in-tree development one: it ships
# `image: openebs/lvm-driver:ci` in both the controller Deployment and the node
# DaemonSet. A floating tag on the component that owns every volume on the node
# is not acceptable, so pin it to the release matching the manifest above.
images:
  - name: openebs/lvm-driver
    newTag: "1.9.1"

# The node plugin only advertises a CSI topology segment for a label key that is
# both listed here and present on the Node. Add this repo's volume-group
# capability key so the lvm-data StorageClass can pin provisioning to it without
# referencing node identity. `kubernetes.io/hostname` stays for parity with
# upstream and is inert -- nothing references it.
patches:
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: openebs-lvm-node
      namespace: kube-system
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: openebs-lvm-node
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: openebs-lvm-plugin
                env:
                  - name: ALLOWED_TOPOLOGIES
                    value: kubernetes.io/hostname,ticklethepanda.dev/lvm-vg
