apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-deployment
  # TEMPORARY, one-off: forces Flux to recreate this Deployment instead of
  # failing dry-run on its immutable spec.selector, which already carries
  # ticklethepanda.dev/managed-by from the old kubectl --prune pipeline.
  # Deliberately handled last and alone (see the "Legacy label cleanup"
  # commit) since this is CI's own transport into the cluster -- both
  # replicas go down together briefly during the recreate. The actual
  # recreation happens via Flux's in-cluster kustomize-controller, not any
  # single CI job's own connection, and the wait step's polling already
  # tolerates transient kubectl failures. Remove once confirmed Ready.
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  replicas: 2
  selector:
    matchLabels:
      pod: cloudflared
  template:
    metadata:
      labels:
        pod: cloudflared
    spec:
      # CI's own access to the cluster runs through this pod (see
      # CLAUDE.md's Node pattern notes) -- give it the same scheduling/
      # eviction priority as Traefik so it isn't first to be squeezed
      # under node resource pressure.
      priorityClassName: system-cluster-critical
      securityContext:
        sysctls:
        # Allows ICMP traffic (ping, traceroute) to resources behind cloudflared.
          - name: net.ipv4.ping_group_range
            value: "65532 65532"
      containers:
        - image: cloudflare/cloudflared:latest
          name: cloudflared
          env:
            # Defines an environment variable for the tunnel token.
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-token
                  key: token
          command:
            # Configures tunnel run parameters
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --loglevel
            - debug
            - --metrics
            - 0.0.0.0:2000
            - run
          livenessProbe:
            httpGet:
              # Cloudflared has a /ready endpoint which returns 200 if and only if
              # it has an active connection to Cloudflare's network.
              path: /ready
              port: 2000
            # Previously failureThreshold: 1 with the default 1s timeout --
            # a single slow response from any transient CPU blip killed and
            # restarted the whole pod (51-53 restarts over 411 days,
            # confirmed via `kubectl describe`: Last State Terminated,
            # Reason: Completed -- the probe, not a crash). More headroom
            # to start and to absorb a slow response before restarting.
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
