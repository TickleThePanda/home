apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./lvm-localpv
  - ./cert-manager
  - ./cloudnative-pg
  - ./coredns
  - ./metallb
  - ./traefik
  - ./api-proxy
  - ./multus
  - ./incident-heartbeat # TEMPORARY, remove with the rest of the incident tooling
  # cloudflared is deliberately NOT listed here -- it has its own
  # dedicated Flux Kustomization (flux-system/sync/kustomization-cloudflared.yaml)
  # for an isolated status signal during the 2026-08-23 tunnel incident,
  # separate from this Kustomization's other 8 resources' combined
  # history. Applying it from both places would also mean two
  # Kustomizations claiming the same object. Revert once the incident is
  # resolved, if the isolation isn't otherwise worth keeping.
