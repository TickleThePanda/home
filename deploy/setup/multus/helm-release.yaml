# Multus publishes no chart of its own; RKE2's packaging is the maintained
# one. Upgrade by changing `version`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
  namespace: kube-system
spec:
  interval: 10m
  releaseName: multus
  chart:
    spec:
      chart: rke2-multus
      version: "v4.3.118"
      sourceRef:
        kind: HelmRepository
        name: rke2-charts
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  driftDetection:
    mode: enabled
  values:
    config:
      fullnameOverride: multus
      cni_conf:
        confDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
        binDir: /var/lib/rancher/k3s/data/cni/
        kubeconfig: /var/lib/rancher/k3s/agent/etc/cni/net.d/multus.d/multus.kubeconfig
        multusAutoconfigDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
    # k3s's own CNI bin dir (above) is pre-populated with symlinks to its
    # bundled standard plugins (bridge, host-local, portmap, ...) pointing
    # outside this directory. The chart's cni-plugins init container only
    # bind-mounts this one directory, so those symlinks resolve as dangling
    # from its point of view and it refuses to copy over them. Skip
    # installing the ones k3s already provides -- multus itself still gets
    # copied in.
    cniplugins:
      skipcnis: "bandwidth,bridge,cni,firewall,flannel,host-local,loopback,portmap"
