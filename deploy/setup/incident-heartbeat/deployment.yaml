# TEMPORARY, for the 2026-08-23 tunnel incident.
#
# Posts to a cloudflared quick tunnel (*.trycloudflare.com) fronting a
# listener on the operator's laptop. Chosen over webhook.site (which is
# blackholed from this cluster -- every channel timed out, including a
# DNS-bypassed one) because trycloudflare.com lives on Cloudflare's edge,
# the same edge this cluster's own tunnel connects to. So reachability
# here is itself diagnostic:
#   - payloads arrive  -> edge egress works; tunnel-down is a pod problem
#   - nothing arrives  -> the node may have lost egress to Cloudflare's
#                         edge specifically (docker.io still working
#                         doesn't rule this out), which would explain the
#                         tunnel being down with no pod fault at all
#
# The payload carries cloudflared's actual pod state, read from the
# Kubernetes API with this pod's own ServiceAccount token -- the exact
# thing that otherwise needs kubectl on the LAN.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-diag
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-diag
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-diag
  namespace: default
subjects:
  - kind: ServiceAccount
    name: incident-diag
    namespace: default
roleRef:
  kind: Role
  name: incident-diag
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-heartbeat
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-heartbeat
  template:
    metadata:
      labels:
        app: incident-heartbeat
    spec:
      serviceAccountName: incident-diag
      containers:
        - name: heartbeat
          image: curlimages/curl:latest
          env:
            - name: HOOK
              value: https://phenomenon-coordinates-remained-retired.trycloudflare.com
          command:
            - sh
            - -c
            - |
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              API=https://kubernetes.default.svc
              while true; do
                NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                PODS=$(curl -s -m 15 --cacert "$SA/ca.crt" \
                  -H "Authorization: Bearer $(cat $SA/token)" \
                  "$API/api/v1/namespaces/default/pods?labelSelector=pod%3Dcloudflared" \
                  | tr -d '\n' | tr '{}' '()' | cut -c1-1800)
                curl -s -m 15 -X POST "$HOOK" \
                  -H "Content-Type: application/json" \
                  -d "{\"time\":\"$NOW\",\"from\":\"$(hostname)\",\"cloudflared_pods\":\"$PODS\"}" \
                  >/dev/null 2>&1 || true
                sleep 30
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
