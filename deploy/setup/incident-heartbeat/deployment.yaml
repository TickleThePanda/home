# TEMPORARY, for the 2026-08-23 tunnel incident.
#
# Multi-channel by design, to distinguish three cases that all look
# identical from outside (total silence):
#
#   1. webhook.site reachable        -> requests arrive at the webhook
#   2. webhook.site DNS-blocked      -> only the --resolve variant arrives
#                                       (this cluster's DNS goes through
#                                       Pi-hole's blocklists, and
#                                       webhook.site is exactly the kind of
#                                       domain those lists carry; docker.io
#                                       demonstrably resolves fine, so a
#                                       per-domain block fits the evidence)
#   3. webhook.site blocked entirely -> neither arrives, but the docker.io
#      or the pod isn't running         fallback below still fires
#
# The docker.io fallback is the key: source-controller's rising pull count
# proves registry-1.docker.io is reachable from this node. Pulling a
# manifest bumps home-deploy's pull_count, which is externally observable.
# At 20s intervals that's ~180/hour, unmistakable against source-controller's
# own much slower polling -- so a sharp rate change means "this pod is
# alive and has egress" even if every webhook channel is blocked.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-heartbeat
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-heartbeat
  template:
    metadata:
      labels:
        app: incident-heartbeat
    spec:
      containers:
        - name: heartbeat
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              HOOK=https://webhook.site/9b7f8710-5772-4cda-97ac-1aa68b9bd411
              while true; do
                NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                # Channel 1: normal DNS
                curl -s -m 10 -X POST "$HOOK" \
                  -H "Content-Type: application/json" \
                  -d "{\"ch\":\"dns\",\"pod\":\"$(hostname)\",\"time\":\"$NOW\"}" >/dev/null 2>&1
                # Channel 2: DNS bypassed via --resolve
                for ip in 178.63.67.106 178.63.67.153; do
                  curl -s -m 10 -X POST "$HOOK" \
                    --resolve "webhook.site:443:$ip" \
                    -H "Content-Type: application/json" \
                    -d "{\"ch\":\"resolve-$ip\",\"pod\":\"$(hostname)\",\"time\":\"$NOW\"}" >/dev/null 2>&1
                done
                # Channel 3: docker.io fallback -- bumps home-deploy's
                # externally-visible pull_count. Proven-reachable path.
                TOK=$(curl -s -m 10 "https://auth.docker.io/token?service=registry.docker.io&scope=repository:ticklethepanda/home-deploy:pull" \
                  | sed 's/.*"token":"\([^"]*\)".*/\1/')
                if [ -n "$TOK" ]; then
                  curl -s -m 10 -o /dev/null \
                    -H "Authorization: Bearer $TOK" \
                    -H "Accept: application/vnd.oci.image.manifest.v1+json" \
                    "https://registry-1.docker.io/v2/ticklethepanda/home-deploy/manifests/deploy"
                fi
                sleep 20
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
