# TEMPORARY, for the 2026-08-23 tunnel incident. Deliberately as simple as
# possible: just prove a pod can run in this cluster and reach the
# internet at all, before layering anything else back on. The previous
# version (k8s API query + string encoding, in curlimages/curl's minimal
# busybox sh) had enough moving parts that a silent script failure and a
# genuine cluster/network problem would look identical from outside.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-heartbeat
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-heartbeat
  template:
    metadata:
      labels:
        app: incident-heartbeat
    spec:
      # Bypasses cluster DNS (CoreDNS -> pihole/quad9) entirely for this
      # pod, going straight to quad9. Isolates whether resolution via the
      # cluster's own DNS chain is what's failing, independent of whether
      # the coredns-custom fallback (separate commit) has even propagated
      # yet. dnsPolicy: None requires dnsConfig to be set explicitly.
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 9.9.9.9
      # Tolerate node pressure taints -- see the matching block in
      # cloudflared/tunnel.yaml. If the node is tainted NoSchedule under
      # DiskPressure/MemoryPressure, that alone would explain why even a
      # minimal single-Deployment Kustomization produced no running pod.
      # With these tolerations, this pod schedules anyway: if it now
      # reports in, node pressure was the blocker all along.
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/pid-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
      containers:
        - name: heartbeat
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - "while true; do curl -v -m 15 -X POST https://phenomenon-coordinates-remained-retired.trycloudflare.com -d hello; sleep 15; done"
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
