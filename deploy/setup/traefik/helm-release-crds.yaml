# Traefik's CRDs, as their own release so the traefik release can skip them.
# The release name `traefik-crd` is the one k3s's bundled chart used; keeping
# it lets Flux adopt that release instead of reinstalling.
#
# Keep every group enabled: Helm deletes the CRDs of a group turned off, and
# with them every custom resource of those kinds. The chart marks its CRDs
# `helm.sh/resource-policy: keep`, so uninstalling the release leaves them.
#
# traefik-crds releases less often than the traefik chart. On a traefik
# bump, compare its crds/ directory with this chart's: the traefik.io and
# Gateway API CRDs must match. Only the unused Hub CRDs may lag.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-crds
  namespace: kube-system
spec:
  interval: 10m
  releaseName: traefik-crd
  chart:
    spec:
      chart: traefik-crds
      version: "1.18.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  driftDetection:
    mode: enabled
  values:
    traefik: true
    hub: true
    gatewayAPI: true
