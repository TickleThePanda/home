apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      enabled: false
      # Chart 40 renders only `.spec` into the Service spec, so a top-level
      # `type` here is silently dropped -- these would come back as ClusterIP
      # and MetalLB would never assign .20/.19.
      additionalServices:
        external:
          enabled: true
          spec:
            type: LoadBalancer
          annotations:
            metallb.io/address-pool: external

        internal:
          enabled: true
          spec:
            type: LoadBalancer
          annotations:
            metallb.io/address-pool: internal

    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.internal.ticklethepanda.co.uk`)
        entryPoints:
          - "int-web-secure"
        middlewares:
          - name: tinyauth
            namespace: tinyauth

    logs:
      access:
        enabled: true

    providers:
      kubernetesCRD:
        allowCrossNamespace: true

    ports:
      # Chart 40 moved per-entrypoint HTTP settings under `http`:
      # `redirections`, `tls` and `middlewares` all live there now.
      int-web:
        exposedPort: 80
        port: 7080
        expose:
          default: false
          internal: true
        protocol: TCP
        http:
          redirections:
            entryPoint:
              to: int-web-secure
              scheme: https
      int-web-secure:
        exposedPort: 443
        port: 7443
        expose:
          default: false
          internal: true
        protocol: TCP
        http:
          tls:
            enabled: true

      ext-web:
        exposedPort: 80
        port: 8080
        expose:
          default: false
          external: true
        protocol: TCP

      int-mqtt:
        exposedPort: 1883
        port: 1883
        expose:
          default: false
          internal: true
        protocol: TCP

      traefik:
        port: 9000
        exposedPort: 9000
        expose:
          default: false
