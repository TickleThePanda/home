apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # From vendor.txt; downloaded by scripts/vendor.sh.
  - ./cert-manager.vendored.yaml

# internal.ticklethepanda.co.uk is stub-zoned to CoreDNS inside the cluster, so
# the in-cluster resolver can never see the Cloudflare DNS-01 TXT record.
patches:
  - target:
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns01-recursive-nameservers-only
