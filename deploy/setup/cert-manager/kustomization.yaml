apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.20.2/cert-manager.yaml
  - ./cluster-issuer.yaml
  - ./internal--cert.yaml

# TEMPORARY, one-off: forces Flux to recreate these three Deployments
# instead of failing dry-run on their immutable spec.selector, which
# already carries ticklethepanda.dev/managed-by from the old kubectl
# --prune pipeline (see CLAUDE.md's Deploy pattern history / the Flux
# migration plan's "Legacy label cleanup" step). Remove this patch once
# all three are confirmed Ready.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cert-manager
        namespace: cert-manager
        annotations:
          kustomize.toolkit.fluxcd.io/force: Enabled
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cert-manager-cainjector
        namespace: cert-manager
        annotations:
          kustomize.toolkit.fluxcd.io/force: Enabled
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cert-manager-webhook
        namespace: cert-manager
        annotations:
          kustomize.toolkit.fluxcd.io/force: Enabled
