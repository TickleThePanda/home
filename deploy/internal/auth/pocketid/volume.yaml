---
# The live claim, adopted by statefulset.yaml's matching volumeClaimTemplate
# (`<template>-<sts>-<n>`). Keep the two in step. Flux owns this object, so
# removing this file would make Flux prune the claim and its data.
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: data-pocket-id-0
  namespace: pocket-id
  labels:
    app: pocket-id
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvm-data
  resources:
    requests:
      storage: 128Mi
