apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homepage

resources:
  - ./namespace.yaml
  - ./rbac.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./ingress.yaml

configMapGenerator:
  - name: homepage-config
    files:
      - settings.yaml
      - services.yaml
      - widgets.yaml
      - bookmarks.yaml
      - kubernetes.yaml
      - docker.yaml
