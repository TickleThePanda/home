# Group order and shape. Names must match the gethomepage.dev/group
# annotations on the discovered IngressRoutes and the group keys in
# services.yaml, or a stray group appears. Applications comes first and
# renders large/spacious via custom.css; Administration comes second and
# renders compact -- see CLAUDE.md's Homepage section.
layout:
  Applications:
    style: row
    columns: 4
  Administration:
    style: row
    columns: 6
