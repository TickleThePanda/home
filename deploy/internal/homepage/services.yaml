# Only services that are not discovered from the cluster. Everything with an
# in-cluster Traefik IngressRoute is added via gethomepage.dev/* annotations
# on that route instead.
#
# Group is either "Applications" (user-facing, primary) or "Administration"
# (infrastructure/admin, secondary) -- see CLAUDE.md's Homepage section.

- Applications:
    - Home Assistant:
        href: https://ha.internal.ticklethepanda.co.uk
        description: Home automation
        icon: home-assistant

- Administration:
    - Proxmox:
        href: https://proxmox.internal.ticklethepanda.co.uk:8006/
        description: proxmox-01 hypervisor
        icon: proxmox
    - Router:
        href: http://192.168.1.1/
        description: OpenWrt gateway
        icon: openwrt
    - Traefik:
        href: https://traefik.internal.ticklethepanda.co.uk/dashboard/
        description: Ingress dashboard
        icon: traefik
