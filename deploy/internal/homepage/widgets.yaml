- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: cluster
    nodes:
      show: true
      cpu: true
      memory: true
      showLabel: true

- glances:
    label: Proxmox
    url: http://192.168.1.3:61208
    version: 4
    cpu: true
    mem: true
    cputemp: true
    # Glances' built-in prefix matching (cpu_thermal, Core, Tctl,
    # Temperature) doesn't cover coretemp's package sensor.
    cpuSensorLabel: "Package id"

- glances:
    label: k8s-manager-1
    url: http://192.168.1.2:61208
    version: 3
    # Unlike Proxmox, this host IS a k3s node -- its cpu/mem already show in
    # the kubernetes widget's node list above. Only cputemp is unique here.
    cpu: false
    mem: false
    cputemp: true
    # The Pi's thermal zone is "cpu-thermal" (hyphen), not the built-in
    # "cpu_thermal" (underscore) prefix match.
    cpuSensorLabel: cpu-thermal

- search:
    provider: duckduckgo
    target: _blank
