apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations:
    # Hibernated (pods scaled to 0, PVC kept) until a consumer needs it.
    # The node has no spare RAM to run an idle Postgres.
    cnpg.io/hibernation: "on"
spec:
  instances: 1
  # A single low-traffic consumer (traccar) once un-hibernated -- sized for
  # that, not a general-purpose Postgres.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  storage:
    storageClass: lvm-data
    size: 20Gi
  postgresql:
    pg_hba:
      - hostssl all all all cert
