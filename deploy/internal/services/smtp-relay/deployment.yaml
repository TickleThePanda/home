---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay
  namespace: smtp-relay
  labels:
    app: smtp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtp-relay
  template:
    metadata:
      labels:
        app: smtp-relay
    spec:
      containers:
        - name: smtp-relay
          image: boky/postfix:v5.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RELAYHOST
              value: "smtp.protonmail.ch:587"
            - name: RELAYHOST_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smtp-relay-credentials
                  key: RELAYHOST_USERNAME
            - name: RELAYHOST_PASSWORD_FILE
              value: /run/secrets/RELAYHOST_PASSWORD
            - name: POSTFIX_smtp_tls_security_level
              value: "encrypt"
            - name: ALLOWED_SENDER_DOMAINS
              value: "ticklethepanda.co.uk"
          ports:
            - name: smtp
              containerPort: 587
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: relay-password
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: relay-password
          secret:
            secretName: smtp-relay-credentials
            items:
              - key: RELAYHOST_PASSWORD
                path: RELAYHOST_PASSWORD
