---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
        name: pihole
    spec:
      containers:
        - name: pihole
          image: pihole/pihole:2026.07.2
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "Europe/London"
            - name: FTLCONF_webserver_api_password
              value: ""
            - name: SERVER_ADDR
              value: "pihole.internal.ticklethepanda.co.uk"
            - name: FTLCONF_LOCAL_IPV4
              value: "192.168.1.10"
            - name: VIRTUAL_HOST
              value: "pi.hole"
          envFrom:
            - configMapRef:
                name: pihole-config
          volumeMounts:
            - name: pihole-etc-pv
              mountPath: "/etc/pihole"
            - name: pihole-dns-pv
              mountPath: "/etc/dnsmasq.d"
      volumes:
        - name: pihole-etc-pv
          persistentVolumeClaim:
            claimName: pihole-etc
        - name: pihole-dns-pv
          persistentVolumeClaim:
            claimName: pihole-dns
