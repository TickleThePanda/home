// Authoritative for the dynamic subdomain lan.internal.ticklethepanda.co.uk
// and the LAN reverse zone. Populated by dynamic update from Kea DHCP-DDNS
// and ExternalDNS; only the gateway is hand-seeded. No recursion.

include "/etc/bind/keys/keys.conf";

// No rndc command channel (would otherwise auto-configure from a key file
// that isn't provisioned).
controls { };

options {
	directory "/var/lib/bind";
	pid-file none;

	listen-on { any; };
	listen-on-v6 { any; };

	recursion no;
	allow-transfer { key externaldns; };
	allow-query { any; };
	dnssec-validation no;
	version none;
};

logging {
	channel stderr {
		stderr;
		severity info;
		print-category yes;
		print-severity yes;
	};
	category default { stderr; };
	category update { stderr; };
	category update-security { stderr; };
	category security { stderr; };
};

zone "lan.internal.ticklethepanda.co.uk" {
	type master;
	file "lan.internal.ticklethepanda.co.uk.zone";
	update-policy {
		grant kea         zonesub A AAAA TXT;
		grant externaldns zonesub A AAAA TXT;
	};
};

zone "1.168.192.in-addr.arpa" {
	type master;
	file "1.168.192.in-addr.arpa.zone";
	update-policy {
		grant kea         zonesub PTR;
		grant externaldns zonesub PTR TXT;
	};
};
