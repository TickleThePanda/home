// Authoritative-only. Populated by dynamic update from Kea DHCP-DDNS and
// ExternalDNS; the only hand-written record is the gateway, in the seed
// zone files. No recursion -- Unbound stub-zones the local zones here.

include "/etc/bind/keys/keys.conf";

options {
	directory "/var/lib/bind";
	pid-file none;

	listen-on { any; };
	listen-on-v6 { any; };

	recursion no;
	allow-transfer { none; };
	allow-query { any; };
	dnssec-validation no;
	version none;
};

logging {
	channel stderr {
		stderr;
		severity info;
		print-category yes;
		print-severity yes;
	};
	category default { stderr; };
	category update { stderr; };
	category update-security { stderr; };
	category security { stderr; };
};

zone "home.arpa" {
	type master;
	file "home.arpa.zone";
	update-policy {
		grant kea         zonesub A AAAA TXT;
		grant externaldns zonesub A AAAA TXT;
	};
};

zone "1.168.192.in-addr.arpa" {
	type master;
	file "1.168.192.in-addr.arpa.zone";
	update-policy {
		grant kea         zonesub PTR;
		grant externaldns zonesub PTR TXT;
	};
};
