// Authoritative for home.arpa (RFC 8375) and the LAN reverse zone.
// Populated by dynamic update from Kea DHCP-DDNS and ExternalDNS; only the
// gateway is hand-seeded. No recursion.

include "/etc/bind/keys/keys.conf";

// No rndc command channel (would otherwise auto-configure from a key file
// that isn't provisioned).
controls { };

options {
	directory "/var/lib/bind";
	pid-file none;

	listen-on { any; };
	listen-on-v6 { any; };

	recursion no;
	allow-transfer { key externaldns; };
	allow-query { any; };
	dnssec-validation no;
	version none;
};

logging {
	channel stderr {
		stderr;
		severity info;
		print-category yes;
		print-severity yes;
	};
	category default { stderr; };
	category update { stderr; };
	category update-security { stderr; };
	category security { stderr; };
};

// Kea writes a DHCID record alongside each A/PTR for conflict resolution;
// omitting DHCID from the grant makes named REFUSE the whole update.
zone "home.arpa" {
	type master;
	file "home.arpa.zone";
	update-policy {
		grant kea         zonesub A AAAA DHCID;
		grant externaldns zonesub A AAAA TXT;
	};
};

zone "1.168.192.in-addr.arpa" {
	type master;
	file "1.168.192.in-addr.arpa.zone";
	update-policy {
		grant kea         zonesub PTR DHCID;
		grant externaldns zonesub PTR TXT;
	};
};
