apiVersion: apps/v1
kind: Deployment
metadata:
  name: bind
  namespace: bind
  labels:
    app: bind
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bind
  template:
    metadata:
      labels:
        app: bind
    spec:
      containers:
        - name: bind
          image: ticklethepanda/bind:latest
          imagePullPolicy: Always
          ports:
            - { containerPort: 53, name: dns-udp, protocol: UDP }
            - { containerPort: 53, name: dns-tcp, protocol: TCP }
          volumeMounts:
            - name: config
              mountPath: /etc/bind/named.conf
              subPath: named.conf
              readOnly: true
            - name: config
              mountPath: /seed
              readOnly: true
            - name: keys
              mountPath: /etc/bind/keys
              readOnly: true
            - name: data
              mountPath: /var/lib/bind
          livenessProbe:
            tcpSocket: { port: 53 }
            initialDelaySeconds: 10
          readinessProbe:
            tcpSocket: { port: 53 }
      volumes:
        - name: config
          configMap:
            name: bind-config
        - name: keys
          secret:
            secretName: bind-tsig
        - name: data
          persistentVolumeClaim:
            claimName: bind-data
