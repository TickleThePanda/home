apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-static
  namespace: external-dns
  labels:
    app: external-dns-static
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns-static
  template:
    metadata:
      labels:
        app: external-dns-static
    spec:
      serviceAccountName: external-dns-static
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.22.0
          args:
            - --provider=rfc2136
            - --rfc2136-host=10.43.53.55
            - --rfc2136-port=53
            - --rfc2136-zone=home.arpa
            - --rfc2136-zone=1.168.192.in-addr.arpa
            - --rfc2136-axfr
            # Only DNSEndpoint resources -- this instance never looks at
            # Services or Ingresses (that is the other external-dns).
            - --source=crd
            - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
            - --crd-source-kind=DNSEndpoint
            - --policy=sync
            - --registry=txt
            - --txt-owner-id=dns-static
            - --txt-prefix=_sdns.
            - --domain-filter=home.arpa
            - --domain-filter=1.168.192.in-addr.arpa
            - --managed-record-types=A
            - --managed-record-types=AAAA
            - --managed-record-types=PTR
            - --interval=1m
          env:
            # Same TSIG key as the discovery external-dns -- named.conf already
            # grants `externaldns` A/AAAA/TXT on home.arpa and PTR/TXT on the
            # reverse zone. Ownership stays separate via the txt-prefix above.
            - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET_ALG
              value: hmac-sha256
            - name: EXTERNAL_DNS_RFC2136_TSIG_KEYNAME
              valueFrom:
                secretKeyRef:
                  name: externaldns-tsig
                  key: key-name
            - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
              valueFrom:
                secretKeyRef:
                  name: externaldns-tsig
                  key: key-secret
