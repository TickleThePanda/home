server:
  verbosity: 0
  interface: 0.0.0.0
  port: 5335
  do-ip4: yes
  do-udp: yes
  do-tcp: yes
  do-ip6: yes
  prefer-ip6: no
  harden-glue: yes
  harden-dnssec-stripped: yes
  use-caps-for-id: no
  edns-buffer-size: 1232
  prefetch: yes
  num-threads: 1
  so-rcvbuf: 1m
  private-address: 192.168.0.0/16
  private-address: 172.16.0.0/12
  private-address: 10.0.0.0/8
  private-domain: "internal.ticklethepanda.co.uk"
  # BIND (10.43.53.55) is authoritative for the dynamic subdomain
  # lan.internal.ticklethepanda.co.uk and the LAN reverse zone. Let its
  # RFC1918 answers through rebind protection, treat both as insecure, and
  # carve the reverse out of Unbound's built-in AS112 local zone.
  domain-insecure: "lan.internal.ticklethepanda.co.uk"
  domain-insecure: "168.192.in-addr.arpa"
  local-zone: "1.168.192.in-addr.arpa." transparent
  access-control: 0.0.0.0/0 allow

# internal.ticklethepanda.co.uk -> CoreDNS; the more-specific
# lan.internal... subdomain -> BIND (longest match wins).
stub-zone:
  name: "internal.ticklethepanda.co.uk."
  stub-addr: 10.43.53.53

stub-zone:
  name: "lan.internal.ticklethepanda.co.uk."
  stub-addr: 10.43.53.55

stub-zone:
  name: "1.168.192.in-addr.arpa."
  stub-addr: 10.43.53.55
