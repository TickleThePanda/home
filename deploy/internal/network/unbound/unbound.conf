server:
  verbosity: 0
  interface: 0.0.0.0
  port: 5335
  do-ip4: yes
  do-udp: yes
  do-tcp: yes
  do-ip6: yes
  prefer-ip6: no
  harden-glue: yes
  harden-dnssec-stripped: yes
  use-caps-for-id: no
  edns-buffer-size: 1232
  prefetch: yes
  num-threads: 1
  so-rcvbuf: 1m
  private-address: 192.168.0.0/16
  private-address: 172.16.0.0/12
  private-address: 10.0.0.0/8
  private-domain: "internal.ticklethepanda.co.uk"
  # The router answers home.arpa with LAN addresses; allow them through
  # rebind protection and treat the zone as insecure (RFC 8375).
  private-domain: "home.arpa"
  domain-insecure: "home.arpa"
  # Unbound serves home.arpa as an empty local zone by default (RFC 8375);
  # drop that so the forward-zone below is actually consulted.
  local-zone: "home.arpa." nodefault
  access-control: 0.0.0.0/0 allow

stub-zone:
  name: "internal.ticklethepanda.co.uk."
  stub-addr: 10.43.53.53

# home.arpa (RFC 8375) is the router's local domain -- forward straight to it.
forward-zone:
  name: "home.arpa."
  forward-addr: 192.168.1.1
