server:
  verbosity: 0
  interface: 0.0.0.0
  port: 5335
  do-ip4: yes
  do-udp: yes
  do-tcp: yes
  do-ip6: yes
  prefer-ip6: no
  harden-glue: yes
  harden-dnssec-stripped: yes
  use-caps-for-id: no
  edns-buffer-size: 1232
  prefetch: yes
  num-threads: 1
  so-rcvbuf: 1m
  private-address: 192.168.0.0/16
  private-address: 172.16.0.0/12
  private-address: 10.0.0.0/8
  private-domain: "internal.ticklethepanda.co.uk"
  # BIND (10.43.53.55) is authoritative for home.arpa and the LAN reverse
  # zone. Let its RFC1918 answers through rebind protection, treat both as
  # insecure, and carve them out of Unbound's built-in RFC 8375 / AS112
  # local zones so the stubs below are consulted.
  private-domain: "home.arpa"
  domain-insecure: "home.arpa"
  domain-insecure: "168.192.in-addr.arpa"
  local-zone: "home.arpa." nodefault
  local-zone: "1.168.192.in-addr.arpa." transparent
  local-zone: "10.168.192.in-addr.arpa." transparent
  access-control: 0.0.0.0/0 allow

stub-zone:
  name: "internal.ticklethepanda.co.uk."
  stub-addr: 10.43.53.53

stub-zone:
  name: "home.arpa."
  stub-addr: 10.43.53.55

stub-zone:
  name: "1.168.192.in-addr.arpa."
  stub-addr: 10.43.53.55

stub-zone:
  name: "10.168.192.in-addr.arpa."
  stub-addr: 10.43.53.55
