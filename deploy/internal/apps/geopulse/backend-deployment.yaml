apiVersion: apps/v1
kind: Deployment
metadata:
  name: geopulse-backend
  labels:
    app: geopulse-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geopulse-backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: geopulse-backend
    spec:
      # Generates the JWT keypair and AI-encryption key on first start, mirroring
      # upstream's geopulse-keygen compose service. Idempotent (checks before
      # writing), and the keys land on the persistent volume so they survive
      # restarts — regenerating them would invalidate existing JWTs and any
      # AI-encrypted fields already stored.
      initContainers:
        - name: keygen
          image: alpine:latest
          command:
            - sh
            - -ec
            - |
              apk add --no-cache openssl >/dev/null
              if [ ! -f /keys/jwt-private-key.pem ] || [ ! -f /keys/jwt-public-key.pem ]; then
                openssl genpkey -algorithm RSA -out /keys/jwt-private-key.pem
                openssl rsa -pubout -in /keys/jwt-private-key.pem -out /keys/jwt-public-key.pem
                chmod 644 /keys/jwt-private-key.pem /keys/jwt-public-key.pem
              fi
              if [ ! -f /keys/ai-encryption-key.txt ]; then
                openssl rand -base64 32 > /keys/ai-encryption-key.txt
                chmod 644 /keys/ai-encryption-key.txt
              fi
          volumeMounts:
            - name: data
              mountPath: /keys
              subPath: keys
      containers:
        - name: geopulse-backend
          image: tess1o/geopulse-backend:1.39.0-native-compat
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: geopulse-config
          env:
            # The mirrored secret's own `host` key is the CNPG service's short name,
            # which only resolves inside the `postgres` namespace it was minted in —
            # cross-namespace, it needs the namespace-qualified form.
            - name: GEOPULSE_POSTGRES_HOST
              value: postgres-rw.postgres.svc.cluster.local
            - name: GEOPULSE_POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: port
            - name: GEOPULSE_POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: dbname
            - name: GEOPULSE_POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: username
            - name: GEOPULSE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: password
            - name: GEOPULSE_POSTGRES_URL
              value: jdbc:postgresql://$(GEOPULSE_POSTGRES_HOST):$(GEOPULSE_POSTGRES_PORT)/$(GEOPULSE_POSTGRES_DB)
            - name: GEOPULSE_OIDC_PROVIDER_GENERIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: geopulse-oidc
                  key: client-secret
          # timeoutSeconds/failureThreshold widened past the 1s/3-strikes default —
          # a heavy import (e.g. reverse-geocoding a large historical GPS history)
          # can make /api/health slow to answer on this hardware without the
          # backend actually being down; too strict a probe flips it NotReady and
          # Traefik/nginx 502 requests, including unrelated new ones.
          #
          # /api/health also runs `SELECT 1` against postgres, so liveness failure
          # here doesn't mean this process is stuck — it means postgres is
          # unreachable, which a restart can't fix. A tight liveness threshold just
          # turns a several-minute postgres restart (CNPG's smart shutdown alone
          # can take ~3-5 minutes) into a crash loop: kubelet kills the container,
          # it comes back up, Flyway's migrate-at-start has no connect-retry
          # configured so it fails hard against the still-down database, exits 1,
          # and repeats. failureThreshold is widened to ~10 minutes so liveness
          # only fires for an actually-stuck process; readiness stays tight so
          # Traefik still stops routing to the pod during a real outage.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /app/keys
              subPath: keys
            - name: data
              mountPath: /data/geopulse-import
              subPath: geopulse-import
            - name: data
              mountPath: /data/geopulse-backups
              subPath: geopulse-backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: geopulse-backend
