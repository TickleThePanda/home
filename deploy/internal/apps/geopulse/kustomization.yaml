apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: geopulse

resources:
  - ./namespace.yaml
  - ./volume.yaml
  - ./backend-deployment.yaml
  - ./backend-service.yaml
  - ./ui-deployment.yaml
  - ./ui-service.yaml
  - ./ingress.yaml

configMapGenerator:
  - name: geopulse-config
    literals:
      - GEOPULSE_VERSION=1.39.0
      - GEOPULSE_PUBLIC_BASE_URL=https://geopulse.internal.ticklethepanda.co.uk
      - GEOPULSE_BACKEND_URL=http://geopulse-backend:8080
      - GEOPULSE_AUTH_SECURE_COOKIES=true
      - GEOPULSE_CORS_ENABLED=false
      - GEOPULSE_ADMIN_EMAIL=panda@ticklethepanda.dev
      # OIDC (Pocket ID) login is set up in a follow-up once the client exists
      # in Pocket ID — see the note left for the operator. Password login stays
      # on in the meantime so the app isn't locked out.
      - GEOPULSE_OIDC_ENABLED=false
      - GEOPULSE_AUTH_OIDC_LOGIN_ENABLED=false
