apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: geopulse

resources:
  - ./namespace.yaml
  - ./volume.yaml
  - ./backend-deployment.yaml
  - ./backend-service.yaml
  - ./ui-deployment.yaml
  - ./ui-service.yaml
  - ./ingress.yaml

configMapGenerator:
  - name: geopulse-config
    literals:
      - GEOPULSE_VERSION=1.39.0
      - GEOPULSE_PUBLIC_BASE_URL=https://geopulse.internal.ticklethepanda.co.uk
      - GEOPULSE_BACKEND_URL=http://geopulse-backend:8080
      - GEOPULSE_AUTH_SECURE_COOKIES=true
      - GEOPULSE_CORS_ENABLED=false
      - GEOPULSE_ADMIN_EMAIL=panda@ticklethepanda.dev
      - GEOPULSE_AUTH_PASSWORD_LOGIN_ENABLED=false
      - GEOPULSE_AUTH_PASSWORD_REGISTRATION_ENABLED=false
      # Admins can still bypass this with a password if OIDC ever breaks — this
      # is the default, set explicitly so it doesn't get lost as a lockout escape
      # hatch.
      - GEOPULSE_AUTH_ADMIN_LOGIN_BYPASS_ENABLED=true
      - GEOPULSE_OIDC_ENABLED=true
      - GEOPULSE_AUTH_OIDC_LOGIN_ENABLED=true
      - GEOPULSE_OIDC_CALLBACK_BASE_URL=https://geopulse.internal.ticklethepanda.co.uk
      - GEOPULSE_OIDC_PROVIDER_GENERIC_ENABLED=true
      - GEOPULSE_OIDC_PROVIDER_GENERIC_NAME=Pocket ID
      - GEOPULSE_OIDC_PROVIDER_GENERIC_DISCOVERY_URL=https://auth.internal.ticklethepanda.co.uk/.well-known/openid-configuration
      - GEOPULSE_OIDC_PROVIDER_GENERIC_CLIENT_ID=afe758b7-62e2-478e-8de8-073e2c4bcb73
