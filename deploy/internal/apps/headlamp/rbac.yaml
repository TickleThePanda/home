apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: headlamp
---
# Headlamp runs with -unsafe-use-service-account-token: every request it
# makes to the API server uses this ServiceAccount, so its ClusterRole is
# the effective access level for anyone tinyauth lets through. This is a
# read-everything role: get/list/watch on every resource (Secrets and pod
# logs included, unlike the built-in `view`) and no write verbs, so no
# mutations and no exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-viewer
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-viewer
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
