apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: https://alertmanager.internal.ticklethepanda.co.uk
    gethomepage.dev/name: Alertmanager
    gethomepage.dev/group: Administration
    gethomepage.dev/icon: alertmanager
    gethomepage.dev/description: Alerts and silences
    gethomepage.dev/pod-selector: app=alertmanager
spec:
  entryPoints:
    - int-web-secure
  tls: {}
  routes:
    - kind: Rule
      match: Host(`alertmanager.internal.ticklethepanda.co.uk`)
      middlewares:
        - name: tinyauth
          namespace: tinyauth
      services:
        - name: alertmanager
          port: 9093
