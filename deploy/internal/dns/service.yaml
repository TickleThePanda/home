apiVersion: v1
kind: Service
metadata:
  name: coredns
  namespace: dns
spec:
  type: ClusterIP
  clusterIP: 10.43.53.53
  selector:
    app: coredns
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
