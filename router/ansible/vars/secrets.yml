---
# Pulled from the environment. CI sets these from the `prod` GitHub
# Environment secrets; for a local run:
#   set -a; . ../bootstrap/secrets.env; set +a
# (router/bootstrap/secrets.env already uses these exact names).
#
# Tasks that consume them set no_log: true.

router_pppoe_username: "{{ lookup('ansible.builtin.env', 'ROUTER_PPPOE_USERNAME') }}"
router_pppoe_password: "{{ lookup('ansible.builtin.env', 'ROUTER_PPPOE_PASSWORD') }}"
router_wifi_key: "{{ lookup('ansible.builtin.env', 'ROUTER_WIFI_KEY') }}"

# Per-profile PPSK for the IoT SSIDs. Keyed by router_iot_vlans[].name.
router_iot_keys:
  iot_inet: "{{ lookup('ansible.builtin.env', 'ROUTER_WIFI_IOT_KEY_INET') }}"
  iot_local: "{{ lookup('ansible.builtin.env', 'ROUTER_WIFI_IOT_KEY_LOCAL') }}"
  iot_echo: "{{ lookup('ansible.builtin.env', 'ROUTER_WIFI_IOT_KEY_ECHO') }}"
