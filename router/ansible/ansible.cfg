[defaults]
inventory = inventory.yml
nocows = 1
retry_files_enabled = False
host_key_checking = True

# CI reaches the router through the same Cloudflare tunnel as the node, so
# trust-on-first-use would mean trusting whatever answers on the far side.
# The key is pinned in-repo.
[inventory]
unparsed_is_failed = True

[ssh_connection]
# A network reload can blip the tunnel this connection rides on. Keepalives
# stop a brief drop from failing an otherwise-fine run; the disruptive
# handlers detach (nohup) and reconnect with wait_for_connection.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes
pipelining = True
