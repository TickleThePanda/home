---
- name: LAN address
  community.openwrt.uci:
    key: "network.lan.{{ item.key }}"
    value: "{{ item.value }}"
    autocommit: true
  loop:
    - { key: ipaddr, value: "{{ router_lan_ipaddr }}" }
    - { key: netmask, value: "{{ router_lan_netmask }}" }
    - { key: ip6assign, value: "{{ router_lan_ip6assign }}" }
  loop_control:
    label: "{{ item.key }}"
  notify: Reload network

- name: WAN is PPPoE, IPv4 only, ignoring ISP DNS
  community.openwrt.uci:
    key: "network.wan.{{ item.key }}"
    value: "{{ item.value }}"
    autocommit: true
  loop:
    - { key: proto, value: pppoe }
    - { key: device, value: "{{ router_wan_device }}" }
    - { key: ipv6, value: "0" }
    - { key: metric, value: "{{ router_wan_metric }}" }
    # The router resolves via Quad9 (tasks/dhcp-dns.yml), never the ISP.
    - { key: peerdns, value: "0" }
  loop_control:
    label: "{{ item.key }}"
  notify: Reload network

- name: PPPoE credentials
  community.openwrt.uci:
    key: "network.wan.{{ item.key }}"
    value: "{{ item.value }}"
    autocommit: true
  loop:
    - { key: username, value: "{{ router_pppoe_username }}" }
    - { key: password, value: "{{ router_pppoe_password }}" }
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  notify: Reload network

- name: Check whether a wan6 interface exists
  community.openwrt.uci:
    command: get
    key: network.wan6
  register: router_wan6
  changed_when: false
  failed_when: false

- name: Disable the wan6 interface
  community.openwrt.uci:
    key: network.wan6.disabled
    value: "1"
    autocommit: true
  when: router_wan6.result | default('') | length > 0
  notify: Reload network

- name: IPv6 ULA prefix
  community.openwrt.uci:
    key: network.globals.ula_prefix
    value: "{{ router_ula_prefix }}"
    autocommit: true
  notify: Reload network

- name: Pin the LAN bridge and WAN port MAC addresses
  community.openwrt.uci:
    command: section
    config: network
    type: device
    find: { name: "{{ item.name }}" }
    set_find: true
    value:
      macaddr: "{{ item.macaddr }}"
    autocommit: true
  loop:
    - { name: br-lan, macaddr: "{{ router_lan_macaddr }}" }
    - { name: "{{ router_wan_device }}", macaddr: "{{ router_wan_macaddr }}" }
  loop_control:
    label: "{{ item.name }}"
  notify: Reload network

# Trusted VLAN: a second bridge on its own DSA port, no 802.1q tagging.
# `br-lan` keeps vlan_filtering off -- toggling it recreates the whole bridge
# and would blip the node's port (and the CI tunnel). One reload at the end
# converges to the target: the trusted port lives only in br-trusted.

- name: Locate the LAN bridge device section
  community.openwrt.uci:
    command: find
    config: network
    type: device
    find: { name: br-lan }
  register: router_br_lan_device
  changed_when: false

- name: Read the LAN bridge port list
  community.openwrt.uci:
    command: get
    key: "network.{{ router_br_lan_device.result }}.ports"
  register: router_br_lan_ports
  changed_when: false

# `uci del_list` of an absent value still stages a change on this OpenWrt, so
# guard it -- otherwise the CI idempotence recheck never settles.
- name: Trusted port leaves the LAN bridge
  community.openwrt.uci:
    command: del_list
    key: "network.{{ router_br_lan_device.result }}.ports"
    value: "{{ router_trusted_port }}"
    autocommit: true
  when: router_trusted_port in (router_br_lan_ports.result_list | default([]))
  notify: Reload network

- name: Trusted VLAN bridge device
  community.openwrt.uci:
    command: section
    config: network
    type: device
    find: { name: br-trusted }
    set_find: true
    value:
      type: bridge
      macaddr: "{{ router_trusted_macaddr }}"
      ports: ["{{ router_trusted_port }}"]
    autocommit: true
  notify: Reload network

- name: Trusted VLAN interface
  community.openwrt.uci:
    command: section
    config: network
    type: interface
    name: trusted
    find: { device: br-trusted }
    set_find: true
    value:
      proto: static
      ipaddr: "{{ router_trusted_ipaddr }}"
      netmask: "{{ router_trusted_netmask }}"
    autocommit: true
  notify: Reload network
