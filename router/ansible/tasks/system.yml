---
- name: Hostname, timezone and zone name
  community.openwrt.uci:
    key: "system.@system[0].{{ item.key }}"
    value: "{{ item.value }}"
    autocommit: true
  loop:
    - { key: hostname, value: "{{ router_hostname }}" }
    - { key: timezone, value: "{{ router_timezone }}" }
    - { key: zonename, value: "{{ router_zonename }}" }
  loop_control:
    label: "{{ item.key }}"
  notify: Reload system config

# NTP server for the IoT VLANs -- Kea hands each IoT subnet the router as its
# time source (deploy/internal/network/dhcp-kea/), and tasks/firewall.yml
# opens udp/123 from those zones. The upstream `server` pool list is left as
# the image default.
- name: NTP server enabled
  community.openwrt.uci:
    key: system.ntp.enable_server
    value: "1"
    autocommit: true
  notify: Restart sysntpd
