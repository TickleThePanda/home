---
# Stock OpenWrt firewall with these changes: wan drops rather than rejects, a
# tailscale0 zone so forwarded tailnet traffic isn't dropped by fw4, and a
# trusted zone for the trusted VLAN. Traffic between lan and trusted is fully
# open for now; tighten later.

- name: wan zone drops input
  community.openwrt.uci:
    command: section
    config: firewall
    type: zone
    find: { name: wan }
    value:
      input: DROP
    autocommit: true
  notify: Reload firewall

- name: trusted zone
  community.openwrt.uci:
    command: section
    config: firewall
    type: zone
    find: { name: trusted }
    set_find: true
    value:
      input: ACCEPT
      output: ACCEPT
      forward: REJECT
      network: [trusted]
    autocommit: true
  notify: Reload firewall

- name: tailscale0 zone
  community.openwrt.uci:
    command: section
    config: firewall
    type: zone
    find: { name: tailscale0 }
    set_find: true
    value:
      input: ACCEPT
      output: ACCEPT
      forward: REJECT
      mtu_fix: "1"
      device: [tailscale0]
    autocommit: true
  notify: Reload firewall

- name: zone forwardings
  community.openwrt.uci:
    command: section
    config: firewall
    type: forwarding
    find: { src: "{{ item.src }}", dest: "{{ item.dest }}" }
    set_find: true
    autocommit: true
  loop:
    - { src: tailscale0, dest: lan }
    - { src: tailscale0, dest: wan }
    - { src: lan, dest: tailscale0 }
    - { src: tailscale0, dest: trusted }
    - { src: trusted, dest: tailscale0 }
    - { src: trusted, dest: wan }
    - { src: trusted, dest: lan }
    - { src: lan, dest: trusted }
  loop_control:
    label: "{{ item.src }} -> {{ item.dest }}"
  notify: Reload firewall
