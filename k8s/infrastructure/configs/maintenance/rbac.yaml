apiVersion: v1
kind: ServiceAccount
metadata:
  name: router-firmware
  namespace: maintenance
---
# kured's lock is an annotation on its DaemonSet.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-firmware
  namespace: kube-system
rules:
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [kured]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-firmware
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-firmware
subjects:
  - kind: ServiceAccount
    name: router-firmware
    namespace: maintenance
---
# Reads node readiness.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: router-firmware
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: router-firmware
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: router-firmware
subjects:
  - kind: ServiceAccount
    name: router-firmware
    namespace: maintenance
