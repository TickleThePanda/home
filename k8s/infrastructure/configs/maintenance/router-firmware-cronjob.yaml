# Flashes the router's firmware early on Saturday, under kured's lock, by
# dispatching a firmware-only Deploy run. See README.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: router-firmware
  namespace: maintenance
spec:
  schedule: "0 1 * * 6"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      # An hour waiting for the lock, 90 minutes for the run to start, then
      # the run itself. The lock's TTL (router-firmware.sh) outlasts this.
      activeDeadlineSeconds: 14400
      # A failed Job (and its RouterFirmwareFailed alert) clears after a week.
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          # Lets monitoring's NetworkPolicy admit this pod to Prometheus.
          labels:
            app.kubernetes.io/name: router-firmware
        spec:
          serviceAccountName: router-firmware
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: router-firmware
              image: alpine/k8s:1.37.2
              command: [bash, /config/router-firmware.sh]
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: router-firmware-github
                      key: token
                # Must match kured's alertFilterRegexp
                # (k8s/infrastructure/controllers/kured/helm-release.yaml).
                - name: ALERT_FILTER
                  value: ^(HostRebootRequired|HostUpgradesPending)$
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: router-firmware
            - name: tmp
              emptyDir: {}
