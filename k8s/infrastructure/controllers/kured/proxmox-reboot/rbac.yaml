apiVersion: v1
kind: ServiceAccount
metadata:
  name: proxmox-reboot
  namespace: kube-system
---
# kured's lock is an annotation on its DaemonSet.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: proxmox-reboot
  namespace: kube-system
rules:
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [kured]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: proxmox-reboot
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: proxmox-reboot
subjects:
  - kind: ServiceAccount
    name: proxmox-reboot
    namespace: kube-system
---
# Reads node readiness, and cordons the Pi during the reboot.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: proxmox-reboot
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: proxmox-reboot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: proxmox-reboot
subjects:
  - kind: ServiceAccount
    name: proxmox-reboot
    namespace: kube-system
