# The operator can reach only DNS, the API server and the Pocket ID pod, and
# nothing can reach it. It can read every Secret in the cluster, so this
# leaves it no direct path to send them anywhere else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: pocket-id-operator
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: pocket-id-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id-operator
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 192.168.1.32/32
      ports:
        - port: 6443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pocket-id
          podSelector:
            matchLabels:
              app: pocket-id
      ports:
        - port: 1411
          protocol: TCP
