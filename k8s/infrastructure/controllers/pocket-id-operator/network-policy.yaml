# The operator can reach only the API server and the Pocket ID pod, and
# nothing can reach it. It has no DNS: it calls the API server by the address
# Kubernetes injects, and Pocket ID by its pinned Service IP. So it has no
# path to send what it reads (every Secret in the cluster) anywhere else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: pocket-id-operator
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: pocket-id-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pocket-id-operator
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.1.32/32
      ports:
        - port: 6443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pocket-id
          podSelector:
            matchLabels:
              app: pocket-id
      ports:
        - port: 1411
          protocol: TCP
