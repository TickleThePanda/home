apiVersion: v1
kind: Namespace
metadata:
  name: pocket-id-operator
---
# Holds the operator's custom resources and the Secrets it writes, from
# k8s/apps/internal/auth/pocketid-clients/. Deleting the namespace would
# delete every PocketIDOIDCClient in it, and the operator would then delete
# the live clients from Pocket ID, so Flux never prunes it.
apiVersion: v1
kind: Namespace
metadata:
  name: pocket-id-clients
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
