apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: setup-config # home--cert.yaml needs the ClusterIssuer; root/ingress.yaml needs MetalLB's IPAddressPool
  sourceRef:
    kind: ExternalArtifact
    name: deploy-home
  # The ExternalArtifact keeps the repo-relative path (artifact-generator.yaml).
  path: ./k8s/apps/home
  prune: true
  wait: true
  timeout: 5m
  retryInterval: 2m
