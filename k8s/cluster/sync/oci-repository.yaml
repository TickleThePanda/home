# The whole repo is promoted through this one OCI artifact rather than
# tracked straight off `main`. k8s/cluster/ (self.yaml) reads it directly;
# the k8s/ layers read per-layer slices of it (artifact-generator.yaml).
# Flux never reconciles a revision before CI has proven the
# underlying infrastructure (the `node` job) is ready. See
# .github/workflows/deploy-cluster.yaml's `cluster` job, which pushes a sha-tagged
# artifact, signs it, and only then moves the `deploy` tag to point at it.
#
# Flux accepts an artifact only with a keyless Cosign signature from that job
# on main, so write access to Docker Hub alone can't deploy anything. A
# failed check leaves the last verified artifact in place: nothing downstream
# changes. Recovery: k8s/cluster/README.md#signed-artifacts.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: deploy
  namespace: flux-system
spec:
  interval: 10m
  url: oci://docker.io/ticklethepanda/home-deploy
  ref:
    tag: deploy
  secretRef:
    name: dockerhub-deploy-pull
  verify:
    provider: cosign
    # The signing certificate names the called workflow, deploy-cluster.yaml,
    # not deploy.yaml. The prod environment only runs on main, so a branch
    # can't get this identity.
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/TickleThePanda/home/\.github/workflows/deploy-cluster\.yaml@refs/heads/main$
