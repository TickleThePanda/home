apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: setup
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: ExternalArtifact
    name: deploy-setup
  # The ExternalArtifact keeps the repo-relative path (artifact-generator.yaml).
  path: ./k8s/infrastructure/controllers
  prune: true
  wait: true
  timeout: 5m
  retryInterval: 2m
  # Decrypts committed *.sops.yaml Secrets; the key is the out-of-band
  # `sops-age` Secret (.claude/rules/secrets.md).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
