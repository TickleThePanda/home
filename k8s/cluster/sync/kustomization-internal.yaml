apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: internal
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: setup-config # pihole-lb needs MetalLB's IPAddressPool (from setup-config)
  sourceRef:
    kind: ExternalArtifact
    name: deploy-internal
  # The ExternalArtifact keeps the repo-relative path (artifact-generator.yaml).
  path: ./k8s/apps/internal
  prune: true
  wait: true
  timeout: 5m
  retryInterval: 2m
  # Decrypts committed *.sops.yaml Secrets; the key is the out-of-band
  # `sops-age` Secret (.claude/rules/secrets.md).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
