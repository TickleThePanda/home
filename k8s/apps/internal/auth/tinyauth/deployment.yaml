apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyauth
  namespace: tinyauth
  labels:
    app: tinyauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinyauth
  template:
    metadata:
      labels:
        app: tinyauth
    spec:
      containers:
        - name: tinyauth
          image: ghcr.io/tinyauthapp/tinyauth:v5.2.0
          ports:
            - containerPort: 3000
          env:
            - name: TINYAUTH_APPURL
              value: "https://forward-auth.internal.ticklethepanda.co.uk"
            # Its Kubernetes ACL discovery reads only networking.k8s.io
            # Ingresses, and every app here uses Traefik IngressRoutes.
            - name: TINYAUTH_LABELPROVIDER
              value: none
            - name: TINYAUTH_OAUTH_AUTOREDIRECT
              value: pocketid
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME
              value: "Pocket ID"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL
              value: "https://auth.internal.ticklethepanda.co.uk/authorize"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL
              value: "http://pocket-id.pocket-id.svc.cluster.local/api/oidc/token"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL
              value: "http://pocket-id.pocket-id.svc.cluster.local/api/oidc/userinfo"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL
              value: "https://forward-auth.internal.ticklethepanda.co.uk/api/oauth/callback/pocketid"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES
              value: "openid email profile groups"
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID
              value: 47a54fd4-c771-4e4a-979f-23112cd995a3
            - name: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  # Issued by pocket-id-operator, mirrored by Reflector.
                  name: tinyauth-oidc-credentials
                  key: client_secret
