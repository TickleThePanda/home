apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tinyauth
spec:
  forwardAuth:
    address: http://tinyauth.tinyauth.svc.cluster.local:3000/api/auth/traefik
    trustForwardHeader: true
    # tinyauth's actual header names (https://tinyauth.app/docs/reference/headers/)
    # -- not X-User/X-Email, which it never sends.
    authResponseHeaders:
      - Remote-User
      - Remote-Email
