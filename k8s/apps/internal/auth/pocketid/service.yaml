apiVersion: v1
kind: Service
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  # Pinned so pocket-id-operator can reach Pocket ID without DNS
  # (auth/pocketid-clients/instance.yaml). The address is in k3s's default
  # service range, so a rebuilt cluster assigns it again.
  clusterIP: 10.43.217.64
  selector:
    app: pocket-id
  ports:
    - name: http
      port: 80
      targetPort: 1411
