# TinyAuth's forward-auth login for internal apps.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: tinyauth
spec:
  clientID: 47a54fd4-c771-4e4a-979f-23112cd995a3
  name: Internal Apps
  callbackUrls:
    - https://forward-auth.internal.ticklethepanda.co.uk/api/oauth/callback/pocketid
  allowedUserGroups:
    - groupName: internal_user
  logo:
    autoGenerate: false
  # The operator issues the secret and writes tinyauth-oidc-credentials.
  # Reflector mirrors it into tinyauth, where the app reads client_secret.
  secret:
    additionalAnnotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: tinyauth
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: tinyauth
  # A replaced secret stays valid this long, so the app can roll over.
  clientSecretOverlap: 24h
