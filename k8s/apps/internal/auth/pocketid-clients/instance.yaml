# The hand-written Pocket ID in k8s/apps/internal/auth/pocketid/, adopted as
# an external instance. The operator reaches it through Traefik, so the
# endpoints it writes into credentials Secrets are the public ones. The API
# key is Pocket ID's STATIC_API_KEY, mirrored here by Reflector.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  external:
    url: https://auth.internal.ticklethepanda.co.uk
    apiKeySecretRef:
      name: pocket-id-static-api-key
      key: token
