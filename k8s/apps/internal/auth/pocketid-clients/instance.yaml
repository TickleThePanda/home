# The hand-written Pocket ID in k8s/apps/internal/auth/pocketid/, adopted as
# an external instance. The operator calls its Service directly, not through
# Traefik (see its network-policy.yaml). The endpoint keys it writes into
# credentials Secrets (issuer_url, token_url, ...) therefore carry this
# in-cluster address; apps take their issuer from their own config and read
# only client_secret. The API key is Pocket ID's STATIC_API_KEY,
# mirrored here by Reflector.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  external:
    url: http://pocket-id.pocket-id.svc.cluster.local
    apiKeySecretRef:
      name: pocket-id-static-api-key
      key: token
