apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: geopulse
spec:
  clientID: afe758b7-62e2-478e-8de8-073e2c4bcb73
  name: GeoPulse
  callbackUrls:
    - https://geopulse.internal.ticklethepanda.co.uk/api/auth/oidc/callback
    - https://geopulse.internal.ticklethepanda.co.uk/oidc/callback
  skipConsent: true
  allowedUserGroups:
    - groupName: internal_user
  logo:
    autoGenerate: false
  # The operator issues the secret and writes geopulse-oidc-credentials.
  # Reflector mirrors it into geopulse, where the app reads client_secret.
  secret:
    additionalAnnotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: geopulse
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: geopulse
  # A replaced secret stays valid this long, so the app can roll over.
  clientSecretOverlap: 24h
