# Headlamp signs users in to the API server. The client ID must match
# k3s_oidc_client_id in ansible/group_vars/k3s_cluster.yml, which the API
# server accepts tokens for; scripts/check-oidc-client-ids.sh checks it.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: headlamp
spec:
  clientID: 9ee12a8f-0a16-4583-abdd-dbe7abf27e16
  name: Headlamp
  callbackUrls:
    - https://headlamp.internal.ticklethepanda.co.uk/oidc-callback
  skipConsent: true
  allowedUserGroups:
    - groupName: k8s_admins
  logo:
    autoGenerate: false
  # The operator issues the secret and writes headlamp-oidc-credentials.
  # Reflector mirrors it into headlamp, where the app reads client_secret.
  secret:
    additionalAnnotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: headlamp
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: headlamp
  # A replaced secret stays valid this long, so the app can roll over.
  clientSecretOverlap: 24h
