apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pocket-id-clients

# Deleting a PocketIDOIDCClient deletes its client from Pocket ID, so Flux
# never prunes one. Remove a client by deleting it by hand.
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled

resources:
  - ./instance.yaml
  - ./headlamp.yaml
  - ./tinyauth.yaml
  - ./geopulse.yaml
  - ./audiobookshelf.yaml
  - ./home-assistant.yaml
