groups:
  - name: disk-space
    rules:
      # node_exporter labels mountpoint/fstype/device properly (Glances baked
      # the mount point into the metric *name* instead), so this is a normal
      # label-filtered expression -- no __name__ regex needed. Scoped to real
      # read-write filesystems: excludes tmpfs/overlay/squashfs/ramfs/fuse
      # (squashfs in particular -- snap mounts are permanently 100% full by
      # design, they'd alert forever) and anything mounted read-only.
      - alert: HostDiskSpaceLow
        expr: >-
          100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"} * 100) > 80
          and node_filesystem_readonly == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.hostname }}: {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full"
          description: >-
            {{ $labels.mountpoint }} on {{ $labels.hostname }} has been over
            80% full for an hour.

      - alert: HostDiskSpaceCritical
        expr: >-
          100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|fuse.*"} * 100) > 90
          and node_filesystem_readonly == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.hostname }}: {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full"
          description: >-
            {{ $labels.mountpoint }} on {{ $labels.hostname }} has been over
            90% full for 5 minutes.

  - name: lvm
    rules:
      # The Pi's `data` VG -- the unallocated pool every PersistentVolume is
      # carved from (ansible/node/vars/storage.yml). Tighter thresholds than
      # the general disk-space rules above: exhausting this blocks every new
      # PV cluster-wide, not just one host's filesystem.
      #
      # Thresholds are absolute, not percentages. PVC requests are thick, so
      # the pool is mostly allocated by design (~15% free is normal) and a
      # percentage alert would fire permanently.
      - alert: LvmVolumeGroupSpaceLow
        expr: >-
          node_volume_group_free{name="data"} < 30 * 1024^3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "LVM volume group \"data\" has less than 30 GiB free"
          description: >-
            The Pi's `data` volume group has had under 30 GiB free for 15
            minutes. Every PersistentVolume is carved from this pool.

      - alert: LvmVolumeGroupSpaceCritical
        expr: >-
          node_volume_group_free{name="data"} < 10 * 1024^3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "LVM volume group \"data\" has less than 10 GiB free"
          description: >-
            The Pi's `data` volume group has had under 10 GiB free for 5
            minutes. New PersistentVolumeClaims will start failing soon.

  - name: os-updates
    rules:
      # From the apt textfile collector on every Debian host (the
      # node_exporter Ansible role). The k3s nodes upgrade daily and
      # proxmox-01 weekly (Sunday), so 8 days covers a package that lands just
      # after Sunday's run.
      - alert: HostUpgradesPending
        expr: sum by (hostname) (apt_upgrades_pending) > 0
        for: 8d
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.hostname }}: {{ $value }} apt upgrades pending for over a week"
          description: >-
            {{ $labels.hostname }} has had apt upgrades waiting for 8 days.

      - alert: HostRebootRequired
        expr: node_reboot_required > 0
        for: 7d
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.hostname }} has needed a reboot for a week"
          description: >-
            {{ $labels.hostname }} installed updates (usually a kernel) that
            only take effect after a reboot, 7 or more days ago.

  - name: kubernetes
    rules:
      # Not on any restart: node reboots, k3s upgrades and API server restarts
      # restart pods once (leader-elected controllers exit when they lose
      # their lease), and that needs nobody.
      - alert: KubePodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
          description: >-
            Container {{ $labels.container }} in pod
            {{ $labels.namespace }}/{{ $labels.pod }} has been in
            CrashLoopBackOff for 15 minutes.

      # An OOM kill restarts the container, which then runs fine until the
      # next one, so it never shows as CrashLoopBackOff. The limit needs
      # raising.
      - alert: KubeContainerOOMKilled
        expr: >-
          increase(kube_pod_container_status_restarts_total[30m]) > 0
          and on (namespace, pod, container)
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} was OOM-killed"
          description: >-
            Container {{ $labels.container }} in pod
            {{ $labels.namespace }}/{{ $labels.pod }} ran out of memory and
            was killed. Raise its memory limit.

      # The proxmox-reboot CronJob (k8s/infrastructure/controllers/kured/). A failure after
      # the reboot keeps kured's lock, so kured stays paused until someone
      # releases it. Failed Jobs are deleted after a week, which clears this.
      - alert: ProxmoxRebootFailed
        expr: kube_job_status_failed{namespace="kube-system", job_name=~"proxmox-reboot-.*"} > 0
        labels:
          severity: critical
        annotations:
          summary: "proxmox-reboot Job {{ $labels.job_name }} failed"
          description: >-
            Read its log (kubectl -n kube-system logs job/{{ $labels.job_name }}).
            If it failed after the reboot, kured is paused until the lock is
            released: kubectl -n kube-system annotate ds kured
            weave.works/kured-node-lock- (k8s/infrastructure/controllers/kured/README.md).

      # 15m outlasts kured's reboots and the Sunday proxmox-01 reboot (5-10m).
      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready", status="true"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} is not Ready"
          description: "Node {{ $labels.node }} has been NotReady for 15 minutes."

  - name: flux
    rules:
      # From Flux Operator's metrics. A deploy can leave a resource briefly
      # not Ready while it reconciles; 30m means Flux won't recover by itself.
      - alert: FluxResourceNotReady
        expr: >-
          max by (kind, exported_namespace, name, reason) (
            flux_resource_info{ready="False", suspended="False"}
            or flux_instance_info{ready="False", suspended="False"}
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready ({{ $labels.reason }})"
          description: >-
            Check it with: flux get all -A --status-selector ready=false, or
            kubectl -n {{ $labels.exported_namespace }} describe
            {{ $labels.kind }} {{ $labels.name }}.

      - alert: FluxOperatorMetricsMissing
        expr: absent(flux_instance_info)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Flux Operator isn't reporting Flux's status"
          description: >-
            Prometheus has had no flux_instance_info for 30 minutes, so
            FluxResourceNotReady can't fire. Check the flux-operator pod in
            flux-system.

  - name: etcd
    rules:
      # k3s's embedded etcd is the cluster's entire datastore -- single
      # member, no HA (see ansible/k3s/k3s.yml). Standard kube-prometheus
      # shapes; thresholds are a starting point, tune once real numbers are
      # visible.
      - alert: EtcdDatabaseSizeHigh
        expr: >-
          (etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "etcd database size is over 80% of its quota"
          description: >-
            etcd's on-disk database has been over 80% of
            etcd_server_quota_backend_bytes for 10 minutes.

      - alert: EtcdHighCommitDuration
        expr: >-
          histogram_quantile(0.99, rate(etcd_disk_backend_commit_duration_seconds_bucket[5m])) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "etcd backend commit latency is elevated"
          description: >-
            etcd's p99 backend commit duration has been over 250ms for 10
            minutes (upstream's own SLO is 25ms on dedicated SSD-backed
            clusters; loosened here for a home VM -- tune after a baseline is
            visible).
