# The relay sends as hello@ticklethepanda.dev without authenticating its
# clients, so only listed senders may reach it. Add a new sender here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: smtp-relay
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-senders
  namespace: smtp-relay
spec:
  podSelector:
    matchLabels:
      app: smtp-relay
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pocket-id
          podSelector:
            matchLabels:
              app: pocket-id
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - port: 587
          protocol: TCP
