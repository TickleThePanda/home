---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay
  namespace: smtp-relay
  labels:
    app: smtp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtp-relay
  template:
    metadata:
      labels:
        app: smtp-relay
    spec:
      # This pod never talks to the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: smtp-relay
          image: boky/postfix:5.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RELAYHOST
              value: "smtp.protonmail.ch:587"
            - name: RELAYHOST_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smtp-relay-credentials
                  key: RELAYHOST_USERNAME
            - name: RELAYHOST_PASSWORD_FILE
              value: /etc/smtp-relay-secrets/RELAYHOST_PASSWORD
            - name: POSTFIX_smtp_tls_security_level
              value: "encrypt"
            - name: ALLOWED_SENDER_DOMAINS
              value: "ticklethepanda.dev"
          ports:
            - name: smtp
              containerPort: 587
          readinessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: relay-password
              # Not under /run: the image declares /var/run (a symlink to
              # /run) as a VOLUME, and that anonymous volume hides any
              # mount beneath it.
              mountPath: /etc/smtp-relay-secrets
              readOnly: true
      volumes:
        - name: relay-password
          secret:
            secretName: smtp-relay-credentials
            items:
              - key: RELAYHOST_PASSWORD
                path: RELAYHOST_PASSWORD
