apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pihole

resources:
  - ./namespace.yaml
  - ./network-policy.yaml
  - ./volume-conf.yaml
  - ./volume-dns.yaml
  - ./deployment.yaml
  - ./service-lb.yaml
  - ./service.yaml
  - ./ingress.yaml

# Pi-hole's settings live here only: pihole.env sets FTLCONF_misc_readOnly,
# which rejects every pihole.toml change from the UI, API or CLI. The UI greys
# out only fields forced below; others look editable but fail to save. A new
# scalar setting is a line in pihole.env, a new array its own .txt file in
# this list. dns-hosts.txt is for names outside internal.ticklethepanda.co.uk,
# which belong in the CoreDNS zone.
configMapGenerator:
  - name: pihole-config
    envs:
      - pihole.env
    files:
      - FTLCONF_dns_hosts=dns-hosts.txt
      - FTLCONF_dns_upstreams=dns-upstreams.txt
      - FTLCONF_dns_revServers=dns-revservers.txt
