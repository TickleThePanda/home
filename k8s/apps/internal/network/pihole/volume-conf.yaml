---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pihole-etc
  namespace: pihole
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lvm-data
  resources:
    requests:
      # 4Gi, not the 128Mi this claim asked for under local-storage. That
      # number was never enforced and the volume had already grown to 422M,
      # nearly all of it pihole-FTL.db, which keeps growing with query history.
      # Here the request is the size of a real block device.
      storage: 4Gi
