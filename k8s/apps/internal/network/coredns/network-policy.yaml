# Unbound stubs internal.ticklethepanda.co.uk here; nothing else asks it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: dns
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-unbound
  namespace: dns
spec:
  podSelector:
    matchLabels:
      app: coredns
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: unbound
          podSelector:
            matchLabels:
              app: unbound
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
