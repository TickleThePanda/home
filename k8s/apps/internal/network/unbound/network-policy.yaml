# Only Pi-hole may use Unbound, so nothing resolves around its blocklists.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: unbound
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pihole
  namespace: unbound
spec:
  podSelector:
    matchLabels:
      app: unbound
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pihole
          podSelector:
            matchLabels:
              app: pihole
      ports:
        - port: 5335
          protocol: UDP
        - port: 5335
          protocol: TCP
