apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: https://headlamp.internal.ticklethepanda.co.uk
    gethomepage.dev/name: Headlamp
    gethomepage.dev/group: Administration
    gethomepage.dev/icon: headlamp
    gethomepage.dev/description: Kubernetes dashboard
    gethomepage.dev/pod-selector: app=headlamp
spec:
  entryPoints:
    - int-web-secure
  tls: {}
  routes:
    - kind: Rule
      match: Host(`headlamp.internal.ticklethepanda.co.uk`)
      # No tinyauth middleware: Headlamp runs its own Pocket ID login, which
      # it needs for per-user API access (see rbac.yaml).
      services:
        - name: headlamp
          namespace: headlamp
          port: 80
