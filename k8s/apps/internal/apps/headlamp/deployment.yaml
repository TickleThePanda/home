apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app: headlamp
  annotations:
    # Restarts the pod when pocket-id-operator replaces its client secret
    # (k8s/infrastructure/controllers/reloader/).
    secret.reloader.stakater.com/reload: headlamp-oidc-credentials
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.46.0
          # Users sign in through Pocket ID; Headlamp forwards their ID token
          # to the API server, which checks it against the same client ID
          # (ansible/group_vars/k3s_cluster.yml). Access comes from rbac.yaml.
          args:
            - "-in-cluster"
            - "-oidc-idp-issuer-url=https://auth.internal.ticklethepanda.co.uk"
            - "-oidc-client-id=9ee12a8f-0a16-4583-abdd-dbe7abf27e16"
            - "-oidc-callback-url=https://headlamp.internal.ticklethepanda.co.uk/oidc-callback"
            - "-oidc-scopes=profile,email,groups,offline_access"
            - "-oidc-use-pkce"
            - "-oidc-auto-login"
          ports:
            - name: http
              containerPort: 4466
          env:
            - name: TZ
              value: "Europe/London"
            - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  # Issued by pocket-id-operator, mirrored by Reflector.
                  name: headlamp-oidc-credentials
                  key: client_secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 15m
              memory: 48Mi
            limits:
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
