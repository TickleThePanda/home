# The k3s cluster: the Pi and k3s-vm-control-01 are servers (embedded etcd),
# the other two Proxmox VMs are agents. Group names (k3s_cluster >
# server / agent) are mandatory -- the k3s.orchestration roles key off them,
# and the first host under `server` is the cluster-init node.
#
# This is the transitional two-server state: the control-plane is moving from
# the Pi to k3s-vm-control-01. The Pi stays listed first (cluster-init node)
# until it is demoted to `agent` and api_endpoint flips to 192.168.1.32.
k3s_cluster:
  children:
    server:
      hosts:
        k8s-manager-1:
          ansible_host: 192.168.1.2
        k3s-vm-control-01:
          ansible_host: 192.168.1.32
    agent:
      hosts:
        k3s-vm-worker-01:
          ansible_host: 192.168.1.33
        k3s-vm-worker-02:
          ansible_host: 192.168.1.34
  vars:
    # Every node authenticates the same CI key as user `deploy` (the Pi's
    # automation user; the VMs' cloud-init user). A hand-run needs that
    # private key locally -- there is no per-host override here because the
    # VMs have no other login. `node_user` is kept as an escape hatch for
    # running against the Pi alone (`--limit server -e node_user=panda`).
    ansible_user: "{{ node_user | default('deploy') }}"
    ansible_python_interpreter: /usr/bin/python3
