---
# Collections the k3s playbook needs beyond ansible-core.
#
#   k3s.orchestration  the k3s-io/k3s-ansible roles (prereq, k3s_server,
#                      k3s_agent). NOT on Galaxy -- installed straight from
#                      the git tag.
#   community.general  used by the collection's roles
#   ansible.posix      sysctl, in the prereq role
#   ansible.utils      ipwrap, in the server/agent roles -- also needs the
#                      `netaddr` python library on the control node
#
# Pinned like every other layer: an unpinned release could change what a
# deploy does to a running cluster without a commit.
#
# Install with:  ansible-galaxy collection install -r requirements.yml
#            and: pip install netaddr

collections:
  - name: https://github.com/k3s-io/k3s-ansible.git
    type: git
    version: "1.2.2"
  - name: community.general
    version: "13.3.0"
  - name: ansible.posix
    version: "2.2.2"
  - name: ansible.utils
    version: "5.1.2"
