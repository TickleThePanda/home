[defaults]
inventory = inventory.yml
nocows = 1
retry_files_enabled = False
host_key_checking = True
interpreter_python = /usr/bin/python3

# CI reaches every node through the in-cluster cloudflared tunnel, so
# trust-on-first-use would mean trusting whatever answers on the far side. The
# host keys are pinned in-repo.
[inventory]
unparsed_is_failed = True

[ssh_connection]
# The server play restarts k3s on the Pi, which blips the cloudflared tunnel
# this connection rides on (pods survive a server restart, so it is only a
# blip). Keepalives stop that from failing an otherwise-fine run.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes
pipelining = True
