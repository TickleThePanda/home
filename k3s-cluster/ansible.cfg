[defaults]
inventory = inventory.yml
nocows = 1
retry_files_enabled = False
host_key_checking = True
interpreter_python = /usr/bin/python3

# Gather host facts once and reuse them across the four plays (the server and
# agent role plays run gather_facts: false and read what play 1 cached).
# `smart` only re-gathers a host with no fresh entry.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_fact_cache
fact_caching_timeout = 7200

# Run the agent play against the three agents in parallel. Serialising only
# matters with more than one server -- the k3s.orchestration roles restart each
# server as they reach it and rolling that past a single etcd member would lose
# quorum. There is one server; drop back to forks = 1 if a second is ever added.
forks = 4

# CI reaches every node through the in-cluster cloudflared tunnel, so
# trust-on-first-use would mean trusting whatever answers on the far side. The
# host keys are pinned in-repo.
[inventory]
unparsed_is_failed = True

[ssh_connection]
# The server play restarts k3s on the Pi, which blips the cloudflared tunnel
# this connection rides on (pods survive a server restart, so it is only a
# blip). Keepalives stop that from failing an otherwise-fine run.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes
pipelining = True
