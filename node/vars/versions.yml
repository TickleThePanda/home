---
# Single source of truth for the node's k3s version.
#
# `traefik_chart_version` is NOT used to render anything -- kustomize remains
# the sole owner of everything under deploy/. It exists so that
# scripts/check-traefik-pin.sh can assert it matches
# deploy/setup/traefik/traefik-helm-chart.yaml, because k3s only ever serves
# the chart tarball bundled with the *installed* k3s version.
#
# To find the right chart version for a k3s release (note the %2B):
#   curl -s "https://api.github.com/repos/k3s-io/k3s/contents/manifests/traefik.yaml?ref=v1.32.6%2Bk3s1" \
#     -H 'Accept: application/vnd.github.raw' | grep chart:
#
# Upgrades go one minor at a time -- Kubernetes does not support skipping.
# Current target chain: 1.32 -> 1.33 -> 1.34 -> 1.35 -> 1.36

k3s_version: "v1.33.13+k3s2"
traefik_chart_version: "40.1.4+up40.1.0"

# k3s addons the repo owns instead, vendored under deploy/setup/.
# Removing an entry here also removes it from the node -- tasks/k3s-config.yml
# purges any config.yaml.d file it does not manage.
k3s_disable:
  - servicelb
  - traefik
