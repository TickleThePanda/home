---
# The SSD's LVM layout.
#
# Creating sda3, the physical volume and the volume group is done by hand from
# the LAN -- see node/STORAGE.md. This playbook owns only the
# steady state on top of them and deliberately never partitions the boot disk
# or creates the VG: CI reaches the node *through* the cluster, so the one
# operation it must never be able to get wrong is the one that makes the node
# unbootable.
#
# Sizes are a floor, not a budget. Growing a volume is an edit here --
# `lvol` runs with resizefs, so raising a number and letting CI apply it
# extends the filesystem online. Shrinking is not supported and will fail
# loudly rather than destroy data.
#
# Everything left unallocated in the VG is the PV pool: the OpenEBS LVM
# LocalPV driver (deploy/setup/lvm-localpv/) carves one real LV per PVC out
# of the same group. Roughly 327G of ~447G. Do not carve it up here.

node_vg: data

# All four are ext4 mounted noatime,nofail -- see tasks/storage.yml for why
# nofail is the right choice here, and what pairs with it.
node_lvs:
  - name: agent
    path: /var/lib/rancher/k3s/agent
    size: 64g # containerd image store + container writable layers (imagefs)

  - name: kubelet
    path: /var/lib/kubelet
    size: 16g # emptyDir, pod ephemeral storage, the PV bind-mount tree (nodefs)

  - name: server
    path: /var/lib/rancher/k3s/server
    size: 8g # the kine datastore and token -- the cluster's source of truth

  - name: backups
    path: /var/backups
    size: 32g # templates/k3s-managed-upgrade.sh.j2 writes here and never prunes

# Directories backing `kubernetes.io~local-volume` PVs declared in deploy/.
#
# The repo already declares the PV; nothing declared the directory it points
# at, so these modes and owners existed only on the SD card. Values below are
# the live ones, captured with `stat -c "%n %u:%g %a" /mnt/disk/*`.
#
# uid/gid 1000 does not correspond to a user on the node (panda is 1001) --
# these are container-side ids, so they are set numerically on purpose. Do
# not "fix" them into names.
#
# These stay on the root filesystem, and stay small (656M). They are on the
# way out: once the PVs above them move to the `lvm-data` StorageClass, this
# list, /mnt/disk and the local-storage class all go away together, and the
# node layer stops needing to know about individual apps at all.

mnt_disk_dirs:
  - path: /mnt/disk/lldap
    owner: 0
    group: 1000
    mode: "2770" # setgid: lldap writes as its own uid but the group must stick
    pv: deploy/internal/lldap/volume.yaml

  - path: /mnt/disk/pihole-dns
    owner: 0
    group: 0
    mode: "0777"
    pv: deploy/internal/pihole/volume-dns.yaml

  - path: /mnt/disk/pihole-etc
    owner: 1000
    group: 1000
    mode: "0775"
    pv: deploy/internal/pihole/volume-conf.yaml

  - path: /mnt/disk/odinbot
    owner: 0
    group: 0
    mode: "0777"
    pv: deploy/home/odinbot/volume.yaml

# Deliberately NOT managed, and deliberately not deleted -- both hold data
# that nothing in deploy/ references any more. Left for the owner to remove
# by hand after confirming they are not wanted:
#
#   /mnt/disk/label-studio  1000:1000 2775
#       Stale. deploy/internal/label-studio/volume.yaml uses
#       storageClassName: local-path, so the live data lives under
#       /var/lib/rancher/k3s/storage/, not here.
#   /mnt/disk/speed-test    0:0 777
#       Stale since the speed-tester project was removed from the repo.
