---
# Directories backing `kubernetes.io~local-volume` PVs declared in deploy/.
#
# The repo already declares the PV; nothing declared the directory it points
# at, so these modes and owners existed only on the SD card. Values below are
# the live ones, captured with `stat -c "%n %u:%g %a" /mnt/disk/*`.
#
# uid/gid 1000 does not correspond to a user on the node (panda is 1001) --
# these are container-side ids, so they are set numerically on purpose. Do
# not "fix" them into names.

mnt_disk_dirs:
  - path: /mnt/disk/lldap
    owner: 0
    group: 1000
    mode: "2770" # setgid: lldap writes as its own uid but the group must stick
    pv: deploy/internal/lldap/volume.yaml

  - path: /mnt/disk/pihole-dns
    owner: 0
    group: 0
    mode: "0777"
    pv: deploy/internal/pihole/volume-dns.yaml

  - path: /mnt/disk/pihole-etc
    owner: 1000
    group: 1000
    mode: "0775"
    pv: deploy/internal/pihole/volume-conf.yaml

  - path: /mnt/disk/odinbot
    owner: 0
    group: 0
    mode: "0777"
    pv: deploy/home/odinbot/volume.yaml

# Deliberately NOT managed, and deliberately not deleted -- both hold data
# that nothing in deploy/ references any more. Left for the owner to remove
# by hand after confirming they are not wanted:
#
#   /mnt/disk/label-studio  1000:1000 2775
#       Stale. deploy/internal/label-studio/volume.yaml uses
#       storageClassName: local-path, so the live data lives under
#       /var/lib/rancher/k3s/storage/, not here.
#   /mnt/disk/speed-test    0:0 777
#       Stale since the speed-tester project was removed from the repo.
