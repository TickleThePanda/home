---
# The SSD's LVM layout.
#
# Creating sda3, the physical volume and the volume group is done by hand from
# the LAN -- see node/STORAGE.md. This playbook owns only the
# steady state on top of them and deliberately never partitions the boot disk
# or creates the VG: CI reaches the node *through* the cluster, so the one
# operation it must never be able to get wrong is the one that makes the node
# unbootable.
#
# Sizes are a floor, not a budget. Growing a volume is an edit here --
# `lvol` runs with resizefs, so raising a number and letting CI apply it
# extends the filesystem online. Shrinking is not supported and will fail
# loudly rather than destroy data.
#
# Everything left unallocated in the VG is the PV pool: the OpenEBS LVM
# LocalPV driver (operators/lvm-localpv/) carves one real LV per PVC out
# of the same group. Roughly 327G of ~447G. Do not carve it up here.

node_vg: data

# All four are ext4 mounted noatime,nofail -- see tasks/storage.yml for why
# nofail is the right choice here, and what pairs with it.
node_lvs:
  - name: agent
    path: /var/lib/rancher/k3s/agent
    size: 64g # containerd image store + container writable layers (imagefs)

  - name: kubelet
    path: /var/lib/kubelet
    size: 16g # emptyDir, pod ephemeral storage, the PV bind-mount tree (nodefs)

  - name: server
    path: /var/lib/rancher/k3s/server
    size: 8g # the kine datastore and token -- the cluster's source of truth

  - name: backups
    path: /var/backups
    size: 32g # templates/k3s-managed-upgrade.sh.j2 writes here and never prunes

# /mnt/disk is gone from this file on purpose.
#
# It held the directories backing the static `local-storage` PVs. Every volume
# now comes from the `lvm-data` StorageClass (operators/lvm-localpv/), which
# carves an LV per PVC out of the free space in this same group, so nothing in
# the node layer has to know about individual apps any more.
#
# The old directories are deliberately NOT deleted -- /mnt/disk/{lldap,
# pihole-dns,pihole-etc,odinbot} still hold the pre-migration copies, plus the
# already-stale label-studio and speed-test. They are the rollback. Remove them
# by hand once the migrated volumes have proven themselves:
#
#   sudo rm -rf /mnt/disk /var/lib/rancher/k3s/storage
