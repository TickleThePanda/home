[defaults]
inventory = inventory.yml
roles_path = roles
# No stdout_callback override: the `yaml` callback was removed from
# ansible-core, and setting it is a hard startup error, not a fallback.
nocows = 1
retry_files_enabled = False
host_key_checking = True
interpreter_python = /usr/bin/python3

# CI reaches the node through a Cloudflare tunnel, so trust-on-first-use would
# mean trusting whatever answers on the far side. The key is pinned in-repo.
[inventory]
unparsed_is_failed = True

[ssh_connection]
# k3s restarts bounce cloudflared, which is this connection's own transport.
# Keepalives stop a brief blip from failing an otherwise-fine run; the
# restart task itself detaches and uses wait_for_connection to reconnect.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes
pipelining = True
