---
# Node-level state for k8s-manager-1 -- the layer *below* k3s.
#
# k3s itself (version, /etc/rancher/k3s/config.yaml, install) is owned by
# k3s-cluster/, which manages the Pi and the Proxmox VM agents as one cluster
# via the k3s.orchestration collection. Everything inside the cluster is owned
# by kustomize (deploy/). This playbook owns what is left: the LVM volumes and
# mounts behind the PVs, the sudoers entries, the node's DNS resolver, swap,
# and the Argon ONE fan.
#
# Deliberately NOT managed:
#   /etc/rancher/k3s/config.yaml            -- owned by k3s-cluster/ (agent config)
#
# Networking changes need more care than most: a bad one strands SSH/the API
# on a headless box. See tasks/network.yml's header for the guardrails that
# keep its DNS-only scope safe, and apply the same scrutiny before widening
# it to anything else.

- name: Manage k8s-manager-1 node state
  hosts: k8s-manager-1
  gather_facts: true
  # Nothing here reads a fact beyond pkg_mgr (for ansible.builtin.package), which
  # min carries. Skip the hardware / network / virtual scan.
  gather_subset:
    - "!all"
    - min
  become: true

  vars_files:
    - vars/storage.yml
    - vars/argon-fan.yml
    - vars/glances.yml

  tasks:
    - name: Sudoers
      ansible.builtin.import_tasks: tasks/access.yml
      tags: [access]

    - name: PV-backing directories
      ansible.builtin.import_tasks: tasks/storage.yml
      tags: [storage]

    - name: Argon ONE fan controller
      ansible.builtin.import_tasks: tasks/argon-fan.yml
      tags: [argon-fan]

    - name: Glances web server
      ansible.builtin.import_tasks: tasks/glances.yml
      tags: [glances]

    - name: Network
      ansible.builtin.import_tasks: tasks/network.yml
      tags: [network]

    - name: Swap
      ansible.builtin.import_tasks: tasks/swap.yml
      tags: [swap]

  handlers:
    # device reapply, not connection up -- see tasks/network.yml's header.
    # Applies to the live device in place, no interface bounce.
    - name: Reapply the wired connection's network config
      listen: Reapply the wired connection's network config
      ansible.builtin.command:
        cmd: nmcli device reapply eth0
      changed_when: true

    # Unit-file changes only (tasks/storage.yml's k3s-agent.service.d drop-in,
    # glances.service). RequiresMountsFor takes effect on the next start, so
    # this only daemon-reloads -- it does not bounce k3s-agent. k3s restarts
    # are k3s-cluster/'s concern now.
    - name: Reload the systemd manager configuration
      listen: reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    # Never touches SSH or the cloudflared tunnel, so a plain restart is fine.
    # Skipped under --check on a first-ever run, same reasoning as
    # tasks/argon-fan.yml's enable task: the unit file was only simulated, so
    # there's nothing real yet for systemctl to restart.
    - name: Restart argon-fan
      listen: restart argon-fan
      ansible.builtin.systemd_service:
        name: argon-fan
        state: restarted
      when: not ansible_check_mode

    # Read-only monitoring -- no storage/k3s impact either way.
    - name: Restart glances
      listen: restart glances
      ansible.builtin.systemd_service:
        name: glances
        state: restarted
      when: not ansible_check_mode
