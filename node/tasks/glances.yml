---
# Glances' web-server mode, polled by gethomepage's `glances` widget
# (deploy/internal/homepage/services.yaml) for this host's CPU temperature.
# The packaged unit runs `-s` (Glances' own binary server protocol,
# loopback-only) -- this replaces it with `-w` (the REST API gethomepage
# speaks), bound to the LAN so the cluster can reach it.
#
# python3-bottle is only a package Recommends, not a hard Depends, but `-w`
# fails at runtime without it (Glances 3's web server is Bottle-based).

- name: Install glances and its web-server dependency
  ansible.builtin.package:
    name:
      - glances
      - python3-bottle
    state: present

- name: Install the glances web-server systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/glances.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by node/tasks/glances.yml. Do not edit on the node.
      [Unit]
      Description=Glances web server
      After=network.target

      [Service]
      User=glances
      Group=glances
      ExecStart=/usr/bin/glances -w -B {{ node_glances_bind_address }} -p {{ node_glances_port }} --disable-webui
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify:
    - reload systemd
    - restart glances

# On a first-ever --check run the unit above was only simulated, so
# systemctl has nothing real to enable. Every run after is unaffected.
- name: Enable and start glances
  ansible.builtin.systemd_service:
    name: glances
    enabled: true
    state: started
  when: not ansible_check_mode
