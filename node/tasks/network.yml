---
# The node's DNS must never depend on anything running on the cluster it
# hosts (e.g. Pi-hole) -- pulled in here as the one exception to networking
# otherwise being unmanaged (see site.yml). Quad9's own anycast pair only,
# not Pi-hole-plus-fallback, so the dependency is actually removed rather
# than just made less likely. Pod DNS is unaffected -- kube-dns/CoreDNS
# still forwards to Pi-hole/Unbound as configured in deploy/.
#
# Editing this: touch ipv4.dns only, never ip4/gw4/method -- this connection
# is ipv4.method: manual, and those are what would strand SSH/the API if
# broken. Apply with `nmcli device reapply`, never `connection up`: reapply
# pushes config to the live device in place, connection up bounces the
# interface this session and the k3s API run over.

- name: Read the wired connection's current DNS servers
  ansible.builtin.command:
    cmd: nmcli -g ipv4.dns connection show "Wired connection 1"
  register: node_dns_current
  changed_when: false

- name: Point the node at Quad9 only, never a cluster-hosted resolver
  ansible.builtin.command:
    cmd: nmcli connection modify "Wired connection 1" ipv4.dns "9.9.9.9 149.112.112.112"
  when: node_dns_current.stdout != "9.9.9.9,149.112.112.112"
  notify: Reapply the wired connection's network config

- name: Read whether auto (DHCP-supplied) DNS is already ignored
  ansible.builtin.command:
    cmd: nmcli -g ipv4.ignore-auto-dns connection show "Wired connection 1"
  register: node_dns_ignore_auto_current
  changed_when: false

- name: Ensure auto (DHCP-supplied) DNS doesn't get mixed in
  ansible.builtin.command:
    cmd: nmcli connection modify "Wired connection 1" ipv4.ignore-auto-dns yes
  when: node_dns_ignore_auto_current.stdout != "yes"
  notify: Reapply the wired connection's network config
