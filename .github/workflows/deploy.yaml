name: Deploy

# Applied in order by sequential jobs:
#
#   preflight   the k3s/Traefik pin agrees, and the cluster is reachable
#   infra       deploy-infra.yaml -- ansible/, every layer: proxmox, node, k3s, router
#   cluster     deploy-cluster.yaml -- deploy/, applied with kustomize
#   terraform   deploy-terraform.yaml -- terraform/cloudflare-zero-trust/, applied last
#
# Each of infra/cluster/terraform is a separate file, called here via
# `workflow_call` rather than inlined. This file's own paths-filter works at
# file granularity -- with everything in one file, editing any one job's
# section matched every other job's filter entry for that file too, so an
# unrelated tweak (say, to the terraform job) reran proxmox/node/k3s/router
# as well. Splitting the job bodies out lets each layer's filter point at
# just its own file.
#
# `infra` stays ONE job for all four Ansible layers, in its own file. They
# used to be four separate jobs, which meant paying runner provisioning, a
# checkout, a Cloudflare WARP connect and an ansible-setup four times over
# before any work happened -- most of the cost of a no-op deploy. One job
# pays that once. See deploy-infra.yaml for layer ordering within it.
#
# Each layer is skipped when the push changed nothing under its own tree
# (including its own workflow file), and every layer runs when anything
# shared changes (see the `shared` filter) or on a manual workflow_dispatch.
#
# preflight exists because CI's only path to any of this is through the cluster
# itself (cloudflared runs in-cluster) -- checking reachability first gives a
# clear signal instead of a confusing failure deep inside Ansible or kubectl.
# It stays in this file, not its own, since it computes the outputs every
# other job's `if:` depends on -- a change to it should conservatively rerun
# everything, same as this file itself.
#
# terraform runs last, same reasoning as the router: it owns the "home" tunnel
# and the private-network routes CI's own WARP connection reaches the LAN
# through, so it is the one layer that can drop CI's own egress -- a blip
# there must not strand a layer that had yet to run. It doesn't need WARP
# itself (Cloudflare's and GCP's APIs are reached over the public internet,
# not through the tunnel), but it still waits on preflight/infra/cluster
# succeeding-or-skipping, same gate as cluster -- no reason to touch the
# tunnel's own config while something upstream is already broken.

on:
  push:
    branches: main
    paths:
      - deploy/**
      - flux-system/**
      - ansible/**
      - terraform/cloudflare-zero-trust/**
      - scripts/check-traefik-pin.sh
      - .github/workflows/deploy*.yaml
      - .github/actions/**
  workflow_dispatch: {}

# Never let two runs touch the cluster at once -- the infra job restarts k3s,
# which takes down the tunnel the cluster job reaches the API through.
concurrency:
  group: cluster
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      # Each layer runs on its own tree, on anything shared, or on a manual
      # dispatch. Folding the dispatch case in here keeps every downstream
      # `if:` to a single expression. paths-filter finds nothing on a
      # workflow_dispatch (it diffs HEAD against its own merge-base), which is
      # why that case has to be handled explicitly.
      proxmox: ${{ steps.changes.outputs.proxmox == 'true' || steps.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
      node: ${{ steps.changes.outputs.node == 'true' || steps.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
      k3s: ${{ steps.changes.outputs.k3s == 'true' || steps.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
      router: ${{ steps.changes.outputs.router == 'true' || steps.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
      infra: ${{ steps.changes.outputs.infra == 'true' || steps.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
      cluster: ${{ steps.changes.outputs.cluster == 'true' || github.event_name == 'workflow_dispatch' }}
      terraform: ${{ steps.changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # `shared` is the catch-all: anything not owned by exactly one layer --
      # the merged inventory, group_vars, the shared roles/, this file itself
      # -- has to apply everywhere, or a change to it would silently apply
      # nowhere. Each other layer's own workflow file lives in that layer's
      # own filter instead, so it doesn't drag the rest along.
      - name: Detect which layers changed
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            shared:
              - 'ansible/ansible.cfg'
              - 'ansible/inventory.yml'
              - 'ansible/known_hosts'
              - 'ansible/requirements.yml'
              - 'ansible/site.yml'
              - 'ansible/group_vars/**'
              - 'ansible/host_vars/**'
              - 'ansible/roles/**'
              - '.github/workflows/deploy.yaml'
              - '.github/actions/**'
            proxmox:
              - 'ansible/proxmox/**'
            node:
              - 'ansible/node/**'
            k3s:
              - 'ansible/k3s/**'
            router:
              - 'ansible/router/**'
            infra:
              - 'ansible/**'
              - '.github/workflows/deploy-infra.yaml'
            cluster:
              - 'deploy/**'
              - 'flux-system/**'
              - '.github/workflows/deploy-cluster.yaml'
            terraform:
              - 'terraform/cloudflare-zero-trust/**'
              - '.github/workflows/deploy-terraform.yaml'

      - name: Check the Traefik chart pin
        run: ./scripts/check-traefik-pin.sh --online

      - name: Connect to Cloudflare Warp
        uses: Boostport/setup-cloudflare-warp@v1
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}

      - name: Setup k8s context
        uses: azure/k8s-set-context@v1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      # An open port isn't a ready API -- k3s binds 6443 well before it serves,
      # and kubectl fails immediately against an unavailable API rather than
      # respecting --timeout. Not ready within a minute means genuinely down,
      # not mid-restart.
      - name: Confirm the API server is ready
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if kubectl get --raw /readyz >/dev/null 2>&1; then
              echo "OK: API server is ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API server did not report ready after 60s -- the cluster may genuinely be down, not just slow. See ansible/node/RECOVERY.md."
          exit 1

      # cloudflared is itself a pod inside the cluster this pipeline manages --
      # confirm it's healthy, not just that the API responds.
      - name: Confirm cloudflared is Ready
        run: |
          kubectl wait --namespace default --for=condition=Ready pod \
            --selector pod=cloudflared --timeout=30s

  infra:
    needs: preflight
    if: needs.preflight.outputs.infra == 'true'
    uses: ./.github/workflows/deploy-infra.yaml
    with:
      run-proxmox: ${{ needs.preflight.outputs.proxmox }}
      run-node: ${{ needs.preflight.outputs.node }}
      run-k3s: ${{ needs.preflight.outputs.k3s }}
      run-router: ${{ needs.preflight.outputs.router }}
    secrets: inherit

  cluster:
    needs: [preflight, infra]
    # Runs when deploy/ or flux-system/ changed (or on a manual dispatch), and
    # only after infra either passed or was itself skipped -- every Ansible
    # layer lands before Flux reconciles through the same tunnel. always() plus
    # an explicit result check: a genuine infra failure blocks cluster, a skip
    # does not.
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped') &&
      needs.preflight.outputs.cluster == 'true'
    uses: ./.github/workflows/deploy-cluster.yaml
    secrets: inherit

  terraform:
    needs: [preflight, infra, cluster]
    # Same gate as cluster, plus cluster itself: see the header for why this
    # runs last.
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped') &&
      (needs.cluster.result == 'success' || needs.cluster.result == 'skipped') &&
      needs.preflight.outputs.terraform == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-terraform.yaml
    secrets: inherit
