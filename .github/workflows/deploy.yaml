name: Deploy

# Two layers, applied in order by three sequential jobs:
#
#   check    the k3s version and the Traefik chart pin agree (no secrets, no
#            network into the LAN -- fails fast and cheap)
#   node     node/, applied with Ansible over SSH as the `deploy` user
#   cluster  deploy/, applied with kustomize
#
# Order matters. A k3s upgrade changes which Traefik chart tarball the node
# serves, so the node must be upgraded before the manifests referencing that
# chart are applied. Sequential jobs make that explicit; they also mean the
# node step can restart k3s and let the cluster job reconnect afterwards on a
# fresh runner.

on:
  push:
    branches: main
    paths:
      - deploy/**
      - node/**
      - .github/workflows/deploy.yaml
  workflow_dispatch:
    inputs:
      check_only:
        type: boolean
        description: Dry run the node layer and skip the cluster apply
        default: false

# Never let two runs touch the cluster at once -- the node job can restart
# k3s, which takes down the tunnel the cluster job reaches the API through.
concurrency:
  group: cluster
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the Traefik chart pin
        run: ./node/scripts/check-traefik-pin.sh --online

  node:
    needs: check
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Cloudflare Warp
        uses: Boostport/setup-cloudflare-warp@v1
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}

      # The WARP route into the LAN demonstrably carries port 22, but those
      # flows come from a *user* identity; CI authenticates with a service
      # token, and a Zero Trust network policy could permit 6443 without
      # permitting 22. Checking both means a policy problem reports itself
      # plainly instead of surfacing as an Ansible "unreachable".
      - name: Check the node is reachable
        run: |
          set -euo pipefail
          if ! nc -zv -w 10 192.168.1.2 6443; then
            echo "::error::Cannot reach the kube API either -- the tunnel is down, not a port-22 policy. cloudflared runs inside the cluster; see node/RECOVERY.md."
            exit 1
          fi
          if ! nc -zv -w 10 192.168.1.2 22; then
            echo "::error::6443 is reachable but 22 is not -- the WARP route is fine and a Zero Trust network policy is gating SSH for the service-token identity."
            exit 1
          fi

      - name: Install ansible-core
        run: pipx install ansible-core

      # ansible-core ships no collections, and the storage tasks need lvol,
      # filesystem and mount. Pinned in node/requirements.yml.
      - name: Install Ansible collections
        working-directory: node
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install the SSH key
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/node_key
          printf '%s\n' "${{ secrets.NODE_SSH_KEY }}" > ~/.ssh/node_key

      - name: Dry run
        working-directory: node
        run: ansible-playbook site.yml --check --diff --private-key ~/.ssh/node_key

      - name: Apply
        if: github.event_name == 'push' || inputs.check_only != true
        working-directory: node
        run: ansible-playbook site.yml --diff --private-key ~/.ssh/node_key

      # Idempotence is the proof the automation is honest about what it owns.
      - name: Confirm no drift remains
        if: github.event_name == 'push' || inputs.check_only != true
        working-directory: node
        run: |
          set -euo pipefail
          ansible-playbook site.yml --check --diff --private-key ~/.ssh/node_key \
            | tee /tmp/recheck.log
          # Only the PLAY RECAP block carries the counts; anchoring to line
          # start never matches, since the host name precedes them.
          if sed -n '/PLAY RECAP/,$p' /tmp/recheck.log | grep -qE 'changed=[1-9]'; then
            echo "::error::Playbook is not idempotent -- a second --check run still reports changes."
            exit 1
          fi

  cluster:
    needs: node
    if: github.event_name == 'push' || inputs.check_only != true
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Connect to Cloudflare Warp
        uses: Boostport/setup-cloudflare-warp@v1
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k8s context
        uses: azure/k8s-set-context@v1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Install the flux CLI
        uses: fluxcd/flux2/action@main

      # Plain apply, no --prune -- flux-system/ is not part of the
      # ticklethepanda.dev/managed-by=kustomize tree below, deliberately,
      # so Flux's own objects never get the label/selector pruning
      # footgun this pipeline is migrating away from. Idempotent, so it's
      # safe to run on every invocation rather than as a one-off.
      - name: Apply flux-system
        run: kubectl apply -k flux-system

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Lets flux-system/sync/oci-repository.yaml's OCIRepository pull the
      # promoted deploy/ artifact from a private Docker Hub repo. Reuses
      # the credentials already in this job rather than a new secret.
      - name: Provision the OCIRepository pull secret
        run: |
          kubectl create secret docker-registry dockerhub-deploy-pull \
            --docker-username="${{ secrets.DOCKER_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_PASSWORD }}" \
            --namespace flux-system \
            --dry-run=client -o yaml | kubectl apply -f -

      # Legacy applier. Milestone 1 (dual-run): kept in place, running
      # first, alongside the new Flux-based steps below -- both write to
      # the same live objects for a short bake period so field-manager
      # conflicts show up before this step is retired at Milestone 2.
      - name: Deploy cluster (legacy)
        run: kubectl apply -k deploy --prune -l ticklethepanda.dev/managed-by=kustomize

      # Push deploy/ as an OCI artifact tagged with the git SHA, then move
      # the moving `deploy` tag to point at it -- the promotion boundary
      # flux-system/sync/oci-repository.yaml's OCIRepository follows. This
      # is what lets Flux reconcile only revisions this job has already
      # applied via the legacy step above (Milestone 1), and later --
      # once the legacy step is gone (Milestone 2) -- revisions CI has
      # otherwise vetted, without ever watching `main` directly.
      - name: Push and promote the deploy/ OCI artifact
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::12}"
          flux push artifact "oci://docker.io/ticklethepanda/home-deploy:sha-${sha}" \
            --path="./deploy" \
            --source="$(git config --get remote.origin.url)" \
            --revision="main@sha1:${GITHUB_SHA}"
          flux tag artifact "oci://docker.io/ticklethepanda/home-deploy:sha-${sha}" \
            --tag deploy

      # Trigger reconciliation immediately over the same WARP+KUBE_CONFIG
      # credential already in this job, rather than waiting for the
      # OCIRepository's own polling interval -- no new exposed surface.
      - name: Trigger Flux reconciliation
        run: |
          set -euo pipefail
          flux reconcile source oci deploy -n flux-system
          flux reconcile kustomization setup    -n flux-system --with-source
          flux reconcile kustomization home     -n flux-system
          flux reconcile kustomization internal -n flux-system

      # Confirms the *specific promoted SHA* reached Ready, not just a
      # stale Ready=True left over from a previous revision -- mirrors the
      # node job's own k3s kubectl get --raw /readyz retry idiom rather
      # than trusting a bare condition check.
      - name: Wait for the promoted revision to be Ready
        run: |
          set -euo pipefail
          expected="sha1:${GITHUB_SHA}"
          for ks in setup home internal; do
            echo "waiting for kustomization/$ks to reach $expected ..."
            for i in $(seq 1 60); do
              applied=$(kubectl -n flux-system get kustomization "$ks" -o jsonpath='{.status.lastAppliedRevision}' 2>/dev/null || true)
              ready=$(kubectl -n flux-system get kustomization "$ks" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
              if [[ "$applied" == *"$expected"* && "$ready" == "True" ]]; then
                echo "OK: $ks is Ready at $applied"
                break
              fi
              if [[ $i -eq 60 ]]; then
                echo "::error::Timed out waiting for kustomization/$ks at $expected (applied=$applied ready=$ready)"
                kubectl -n flux-system get kustomization "$ks" -o yaml
                exit 1
              fi
              sleep 10
            done
          done
