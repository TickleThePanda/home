name: Deploy

# Two layers, applied in order by four sequential jobs:
#
#   check      the k3s version and the Traefik chart pin agree (no secrets,
#              no network into the LAN -- fails fast and cheap)
#   preflight  the cluster is actually reachable and ready right now, before
#              anything else touches it
#   node       node/, applied with Ansible over SSH as the `deploy` user
#   cluster    deploy/, applied with kustomize
#
# Order matters. A k3s upgrade changes which Traefik chart tarball the node
# serves, so the node must be upgraded before the manifests referencing that
# chart are applied. Sequential jobs make that explicit; they also mean the
# node step can restart k3s and let the cluster job reconnect afterwards on a
# fresh runner.
#
# preflight exists because CI's only path to the node runs through the
# cluster itself (the in-cluster cloudflared Deployment is the WARP tunnel
# endpoint) -- if that tunnel or the API server is already unhealthy for
# unrelated reasons, node/cluster's own failures surface confusingly deep
# inside Ansible or kubectl output. Checking this up front, before either
# job starts doing real work, gives a fast, unambiguous signal instead.

on:
  push:
    branches: main
    paths:
      - deploy/**
      - flux-system/**
      - node/**
      - .github/workflows/deploy.yaml
  workflow_dispatch:
    inputs:
      check_only:
        type: boolean
        description: Dry run the node layer and skip the cluster apply
        default: false

# Never let two runs touch the cluster at once -- the node job can restart
# k3s, which takes down the tunnel the cluster job reaches the API through.
concurrency:
  group: cluster
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the Traefik chart pin
        run: ./node/scripts/check-traefik-pin.sh --online

  preflight:
    needs: check
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Connect to Cloudflare Warp
        uses: Boostport/setup-cloudflare-warp@v1
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}

      - name: Setup k8s context
        uses: azure/k8s-set-context@v1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      # An open port isn't a ready API -- see node/site.yml's own readyz
      # poll, added after the same lesson. A generous-but-bounded retry
      # window: if it's not ready within a minute, the cluster is
      # genuinely down rather than just mid-restart from a previous run.
      - name: Confirm the API server is ready
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if kubectl get --raw /readyz >/dev/null 2>&1; then
              echo "OK: API server is ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API server did not report ready after 60s -- the cluster may genuinely be down, not just slow. See node/RECOVERY.md."
          exit 1

      # The tunnel this whole pipeline runs over is a pod inside the
      # cluster it manages -- confirm it's actually healthy, not just
      # that the API happens to be responding right now.
      - name: Confirm cloudflared is Ready
        run: |
          kubectl wait --namespace default --for=condition=Ready pod \
            --selector pod=cloudflared --timeout=30s

      # TEMPORARY -- one-off diagnostics for the cloudflared replica that's
      # been intermittently failing this readiness check. Remove once the
      # cause is understood. Runs regardless of the step above's outcome.
      - name: Dump diagnostics
        if: always()
        run: |
          echo "### cloudflared pods ###"
          kubectl get pods -n default -l pod=cloudflared -o wide
          echo "### cloudflared pod descriptions ###"
          kubectl describe pods -n default -l pod=cloudflared
          echo "### cloudflared current logs ###"
          for p in $(kubectl get pods -n default -l pod=cloudflared -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- $p ---"
            kubectl logs -n default "$p" --tail=100 || true
            echo "--- $p (previous, if crashed) ---"
            kubectl logs -n default "$p" --previous --tail=100 || true
          done
          echo "### node resource usage ###"
          kubectl top nodes || true
          kubectl describe nodes
          echo "### flux-system pods ###"
          kubectl get pods -n flux-system -o wide
          echo "### recent warning events ###"
          kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp | tail -40

  node:
    needs: preflight
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Cloudflare Warp
        uses: Boostport/setup-cloudflare-warp@v1
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}

      # The WARP route into the LAN demonstrably carries port 22, but those
      # flows come from a *user* identity; CI authenticates with a service
      # token, and a Zero Trust network policy could permit 6443 without
      # permitting 22. Checking both means a policy problem reports itself
      # plainly instead of surfacing as an Ansible "unreachable".
      - name: Check the node is reachable
        run: |
          set -euo pipefail
          if ! nc -zv -w 10 192.168.1.2 6443; then
            echo "::error::Cannot reach the kube API either -- the tunnel is down, not a port-22 policy. cloudflared runs inside the cluster; see node/RECOVERY.md."
            exit 1
          fi
          if ! nc -zv -w 10 192.168.1.2 22; then
            echo "::error::6443 is reachable but 22 is not -- the WARP route is fine and a Zero Trust network policy is gating SSH for the service-token identity."
            exit 1
          fi

      - name: Install ansible-core
        run: pipx install ansible-core

      # ansible-core ships no collections, and the storage tasks need lvol,
      # filesystem and mount. Pinned in node/requirements.yml.
      - name: Install Ansible collections
        working-directory: node
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install the SSH key
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/node_key
          printf '%s\n' "${{ secrets.NODE_SSH_KEY }}" > ~/.ssh/node_key

      - name: Dry run
        working-directory: node
        run: ansible-playbook site.yml --check --diff --private-key ~/.ssh/node_key

      - name: Apply
        if: github.event_name == 'push' || inputs.check_only != true
        working-directory: node
        run: ansible-playbook site.yml --diff --private-key ~/.ssh/node_key

      # Idempotence is the proof the automation is honest about what it owns.
      - name: Confirm no drift remains
        if: github.event_name == 'push' || inputs.check_only != true
        working-directory: node
        run: |
          set -euo pipefail
          ansible-playbook site.yml --check --diff --private-key ~/.ssh/node_key \
            | tee /tmp/recheck.log
          # Only the PLAY RECAP block carries the counts; anchoring to line
          # start never matches, since the host name precedes them.
          if sed -n '/PLAY RECAP/,$p' /tmp/recheck.log | grep -qE 'changed=[1-9]'; then
            echo "::error::Playbook is not idempotent -- a second --check run still reports changes."
            exit 1
          fi

  cluster:
    needs: node
    if: github.event_name == 'push' || inputs.check_only != true
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Connect to Cloudflare Warp
        uses: Boostport/setup-cloudflare-warp@v1
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k8s context
        uses: azure/k8s-set-context@v1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Install the flux CLI
        uses: fluxcd/flux2/action@main

      # Plain apply, no --prune -- flux-system/ is not part of the
      # ticklethepanda.dev/managed-by=kustomize tree below, deliberately,
      # so Flux's own objects never get the label/selector pruning
      # footgun this pipeline is migrating away from. Idempotent, so it's
      # safe to run on every invocation rather than as a one-off.
      #
      # Split into two applies with an explicit CRD-Established wait in
      # between: a single `kubectl apply -k flux-system` hits the same
      # missing-kind race CLAUDE.md documents for other vendored operators
      # (kubectl's own implicit retry gives up before ~18 freshly-created
      # CRDs finish becoming Established) -- confirmed the hard way on the
      # first bootstrap attempt. This is the documented remedy: a two-pass
      # split for just the one directory observed to flake, not a blanket
      # change. Once Flux itself is running, its self-management
      # Kustomization (sync/self.yaml) reconciles the combined
      # ./flux-system tree just fine -- kustomize-controller handles this
      # ordering more gracefully than plain kubectl apply does.
      - name: Apply flux-system
        run: |
          kubectl apply -k flux-system/install
          kubectl wait --for=condition=Established --timeout=60s \
            crd/gitrepositories.source.toolkit.fluxcd.io \
            crd/ocirepositories.source.toolkit.fluxcd.io \
            crd/kustomizations.kustomize.toolkit.fluxcd.io
          kubectl apply -k flux-system/sync

      # TEMPORARY, one-off -- flux-system/install/kustomization.yaml now
      # deletes these from the applied set, but the earlier successful
      # bootstrap already created them live and plain `kubectl apply`
      # (deliberately unlabeled, no --prune) doesn't remove resources that
      # disappear from the manifest. Remove this step once run once.
      - name: Clean up the now-unused image-automation components
        run: |
          kubectl delete deployment image-reflector-controller image-automation-controller \
            -n flux-system --ignore-not-found=true
          kubectl delete serviceaccount image-reflector-controller image-automation-controller \
            -n flux-system --ignore-not-found=true
          kubectl delete crd imagepolicies.image.toolkit.fluxcd.io \
            imagerepositories.image.toolkit.fluxcd.io \
            imageupdateautomations.image.toolkit.fluxcd.io \
            --ignore-not-found=true

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Lets flux-system/sync/oci-repository.yaml's OCIRepository pull the
      # promoted deploy/ artifact from a private Docker Hub repo. Reuses
      # the credentials already in this job rather than a new secret.
      - name: Provision the OCIRepository pull secret
        run: |
          set -euo pipefail
          kubectl create secret docker-registry dockerhub-deploy-pull \
            --docker-username="${{ secrets.DOCKER_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_PASSWORD }}" \
            --namespace flux-system \
            --dry-run=client --validate=false -o yaml | kubectl apply -f -

      # Push the whole repo as one sha-tagged OCI artifact, then move the
      # moving `deploy` tag to point at it -- the promotion boundary both
      # flux-system/sync/oci-repository.yaml's OCIRepository (deploy/ *and*
      # flux-system/, at different paths within the same artifact) follow.
      # Neither tree is ever watched straight off `main`; this is what lets
      # Flux reconcile only revisions this job has already applied via the
      # legacy step above (Milestone 1), and later -- once the legacy step
      # is gone (Milestone 2) -- revisions CI has otherwise vetted.
      - name: Push and promote the OCI artifact
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::12}"
          flux push artifact "oci://docker.io/ticklethepanda/home-deploy:sha-${sha}" \
            --path="." \
            --source="$(git config --get remote.origin.url)" \
            --revision="main@sha1:${GITHUB_SHA}"
          flux tag artifact "oci://docker.io/ticklethepanda/home-deploy:sha-${sha}" \
            --tag deploy

      # Trigger reconciliation immediately over the same WARP+KUBE_CONFIG
      # credential already in this job, rather than waiting for the
      # OCIRepository's own polling interval -- no new exposed surface.
      # Only the source needs an explicit trigger: kustomize-controller
      # watches its sourceRef and auto-reconciles on every artifact
      # revision change, so setup/home/internal pick this up on their own.
      # `flux reconcile kustomization ...` also blocks waiting for each
      # Kustomization to finish, with its own default timeout -- which
      # exceeded here on the first-ever reconcile of the whole
      # resource-heavy setup tree. The dedicated wait step below does that
      # waiting instead, with its own patient, independent budget.
      - name: Trigger Flux reconciliation
        run: flux reconcile source oci deploy -n flux-system

      # Confirms the *specific promoted SHA* reached Ready, not just a
      # stale Ready=True left over from a previous revision -- mirrors the
      # node job's own k3s kubectl get --raw /readyz retry idiom rather
      # than trusting a bare condition check.
      - name: Wait for the promoted revision to be Ready
        run: |
          set -euo pipefail
          expected="sha1:${GITHUB_SHA}"
          for ks in flux-system setup home internal; do
            echo "waiting for kustomization/$ks to reach $expected ..."
            for i in $(seq 1 60); do
              applied=$(kubectl -n flux-system get kustomization "$ks" -o jsonpath='{.status.lastAppliedRevision}' 2>/dev/null || true)
              ready=$(kubectl -n flux-system get kustomization "$ks" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
              if [[ "$applied" == *"$expected"* && "$ready" == "True" ]]; then
                echo "OK: $ks is Ready at $applied"
                break
              fi
              if [[ $i -eq 60 ]]; then
                echo "::error::Timed out waiting for kustomization/$ks at $expected (applied=$applied ready=$ready)"
                kubectl -n flux-system get kustomization "$ks" -o yaml
                exit 1
              fi
              sleep 10
            done
          done
