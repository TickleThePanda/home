name: Deploy

# Two layers, applied in order by sequential jobs:
#
#   preflight  the k3s/Traefik pin agrees, and the cluster is reachable
#   node       node/, applied with Ansible over SSH as the `deploy` user
#   router     router/ansible/, applied with Ansible over SSH as root
#   cluster    deploy/, applied with kustomize
#
# Order matters: a k3s upgrade changes which Traefik chart tarball the node
# serves, so node must run before cluster. A coupled k3s/Traefik bump touches
# deploy/setup/traefik/, so cluster still runs for it.
#
# Each of node, router and cluster is skipped when the push changed nothing
# under its tree; a skipped job counts as a pass for the jobs after it. A
# manual workflow_dispatch runs all three.
#
# preflight exists because CI's only path to the node and the router is
# through the cluster itself (cloudflared runs in-cluster) -- checking
# reachability first gives a clear signal instead of a confusing failure
# deep inside Ansible or kubectl output.

on:
  push:
    branches: main
    paths:
      - deploy/**
      - flux-system/**
      - node/**
      - router/ansible/**
      - .github/workflows/deploy.yaml
  workflow_dispatch: {}

# Never let two runs touch the cluster at once -- the node job can restart
# k3s, which takes down the tunnel the cluster job reaches the API through.
concurrency:
  group: cluster
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      node-changed: ${{ steps.changes.outputs.node }}
      router-changed: ${{ steps.changes.outputs.router }}
      cluster-changed: ${{ steps.changes.outputs.cluster }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Each downstream job is skipped when nothing under its tree changed --
      # see the `if:` on each. On workflow_dispatch paths-filter diffs HEAD
      # against its own merge-base and finds nothing, so every filter reports
      # false; each downstream `if:` special-cases workflow_dispatch to run
      # anyway.
      - name: Detect which trees changed
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            node:
              - 'node/**'
              - '.github/workflows/deploy.yaml'
            router:
              - 'router/ansible/**'
              - '.github/workflows/deploy.yaml'
            cluster:
              - 'deploy/**'
              - 'flux-system/**'
              - '.github/workflows/deploy.yaml'

      - name: Check the Traefik chart pin
        run: ./node/scripts/check-traefik-pin.sh --online

      - name: Connect to Cloudflare Warp
        uses: Boostport/setup-cloudflare-warp@v1
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}

      - name: Setup k8s context
        uses: azure/k8s-set-context@v1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      # An open port isn't a ready API -- see node/site.yml's own readyz
      # poll. Not ready within a minute means genuinely down, not mid-restart.
      - name: Confirm the API server is ready
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if kubectl get --raw /readyz >/dev/null 2>&1; then
              echo "OK: API server is ready"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API server did not report ready after 60s -- the cluster may genuinely be down, not just slow. See node/RECOVERY.md."
          exit 1

      # cloudflared is itself a pod inside the cluster this pipeline
      # manages -- confirm it's healthy, not just that the API responds.
      - name: Confirm cloudflared is Ready
        run: |
          kubectl wait --namespace default --for=condition=Ready pod \
            --selector pod=cloudflared --timeout=30s


  node:
    needs: preflight
    if: >-
      needs.preflight.outputs.node-changed == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Cloudflare Warp
        uses: Boostport/setup-cloudflare-warp@v1
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}

      # CI authenticates with a service token, not a user identity, so a
      # Zero Trust policy could permit 6443 without permitting 22. Checking
      # both surfaces a policy problem plainly instead of as an Ansible
      # "unreachable".
      - name: Check the node is reachable
        run: |
          set -euo pipefail
          if ! nc -zv -w 10 192.168.1.2 6443; then
            echo "::error::Cannot reach the kube API either -- the tunnel is down, not a port-22 policy. cloudflared runs inside the cluster; see node/RECOVERY.md."
            exit 1
          fi
          if ! nc -zv -w 10 192.168.1.2 22; then
            echo "::error::6443 is reachable but 22 is not -- the WARP route is fine and a Zero Trust network policy is gating SSH for the service-token identity."
            exit 1
          fi

      - name: Install ansible-core
        run: pipx install ansible-core

      # ansible-core ships no collections, and the storage tasks need lvol,
      # filesystem and mount. Pinned in node/requirements.yml.
      - name: Install Ansible collections
        working-directory: node
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install the SSH key
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/node_key
          printf '%s\n' "${{ secrets.NODE_SSH_KEY }}" > ~/.ssh/node_key

      # Syntax only, not state -- Apply below is the first SSH-based run,
      # so a partial failure there can still leave real changes applied.
      # Acceptable for a single, idempotent host.
      - name: Syntax check
        working-directory: node
        run: ansible-playbook site.yml --syntax-check

      - name: Apply
        working-directory: node
        run: ansible-playbook site.yml --diff --private-key ~/.ssh/node_key

      # Idempotence is the proof the automation is honest about what it owns.
      - name: Confirm no drift remains
        working-directory: node
        run: |
          set -euo pipefail
          ansible-playbook site.yml --check --diff --private-key ~/.ssh/node_key \
            | tee /tmp/recheck.log
          # Only the PLAY RECAP block carries the counts; anchoring to line
          # start never matches, since the host name precedes them.
          if sed -n '/PLAY RECAP/,$p' /tmp/recheck.log | grep -qE 'changed=[1-9]'; then
            echo "::error::Playbook is not idempotent -- a second --check run still reports changes."
            exit 1
          fi

  router:
    needs: [preflight, node]
    # Depends on node purely for ordering: node and router both mutate infra
    # CI reaches through the same tunnel, so they must not run at once. node
    # is skipped when nothing under node/ changed -- treat that as a pass.
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.node.result == 'success' || needs.node.result == 'skipped') &&
      (needs.preflight.outputs.router-changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Cloudflare Warp
        uses: Boostport/setup-cloudflare-warp@v1
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}

      # The router rides the same cloudflared tunnel as the node (Zero Trust
      # routes 192.168.1.0/24 + 192.168.10.0/24). If 22 is unreachable the
      # tunnel is down, not a per-host policy -- there is no service-token
      # policy gating the router specifically.
      - name: Check the router is reachable
        run: |
          set -euo pipefail
          if ! nc -zv -w 10 192.168.1.1 22; then
            echo "::error::Cannot reach the router on 22 -- the cloudflared tunnel is down. It runs in-cluster; see node/RECOVERY.md."
            exit 1
          fi

      - name: Install ansible-core
        run: pipx install ansible-core

      # ansible-core ships no collections; the router tasks need
      # community.openwrt. Pinned in router/ansible/requirements.yml.
      - name: Install Ansible collections
        working-directory: router/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install the SSH key
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/router_key
          printf '%s\n' "${{ secrets.NODE_SSH_KEY }}" > ~/.ssh/router_key

      - name: Syntax check
        working-directory: router/ansible
        run: ansible-playbook site.yml --syntax-check

      - name: Apply
        working-directory: router/ansible
        env:
          ROUTER_PPPOE_USERNAME: ${{ secrets.ROUTER_PPPOE_USERNAME }}
          ROUTER_PPPOE_PASSWORD: ${{ secrets.ROUTER_PPPOE_PASSWORD }}
          ROUTER_WIFI_KEY: ${{ secrets.ROUTER_WIFI_KEY }}
          ROUTER_WIFI_IOT_KEY_INET: ${{ secrets.ROUTER_WIFI_IOT_KEY_INET }}
          ROUTER_WIFI_IOT_KEY_LOCAL: ${{ secrets.ROUTER_WIFI_IOT_KEY_LOCAL }}
          ROUTER_WIFI_IOT_KEY_ECHO: ${{ secrets.ROUTER_WIFI_IOT_KEY_ECHO }}
        run: ansible-playbook site.yml --diff --private-key ~/.ssh/router_key

      # Idempotence is the proof the automation is honest about what it owns.
      - name: Confirm no drift remains
        working-directory: router/ansible
        env:
          ROUTER_PPPOE_USERNAME: ${{ secrets.ROUTER_PPPOE_USERNAME }}
          ROUTER_PPPOE_PASSWORD: ${{ secrets.ROUTER_PPPOE_PASSWORD }}
          ROUTER_WIFI_KEY: ${{ secrets.ROUTER_WIFI_KEY }}
          ROUTER_WIFI_IOT_KEY_INET: ${{ secrets.ROUTER_WIFI_IOT_KEY_INET }}
          ROUTER_WIFI_IOT_KEY_LOCAL: ${{ secrets.ROUTER_WIFI_IOT_KEY_LOCAL }}
          ROUTER_WIFI_IOT_KEY_ECHO: ${{ secrets.ROUTER_WIFI_IOT_KEY_ECHO }}
        run: |
          set -euo pipefail
          ansible-playbook site.yml --check --diff --private-key ~/.ssh/router_key \
            | tee /tmp/router-recheck.log
          if sed -n '/PLAY RECAP/,$p' /tmp/router-recheck.log | grep -qE 'changed=[1-9]'; then
            echo "::error::Playbook is not idempotent -- a second --check run still reports changes."
            exit 1
          fi

  cluster:
    needs: [preflight, node, router]
    # Runs when deploy/ or flux-system/ changed (or on a manual dispatch),
    # and only after node/router either passed or were themselves skipped --
    # router lands before Flux reconciles through the same tunnel. always()
    # plus explicit result checks: a genuine node/router failure blocks
    # cluster, a skip does not.
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.node.result == 'success' || needs.node.result == 'skipped') &&
      (needs.router.result == 'success' || needs.router.result == 'skipped') &&
      (needs.preflight.outputs.cluster-changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Connect to Cloudflare Warp
        uses: Boostport/setup-cloudflare-warp@v1
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k8s context
        uses: azure/k8s-set-context@v1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Install the flux CLI
        uses: fluxcd/flux2/action@main

      # No --prune -- flux-system/ isn't part of the managed-by=kustomize
      # tree below, so Flux's own objects are never pruned by it.
      #
      # Two applies with a CRD-Established wait between them: a single
      # `kubectl apply -k flux-system` hits the same missing-kind race
      # CLAUDE.md documents for other vendored operators (kubectl's retry
      # gives up before ~18 new CRDs finish becoming Established). Once
      # Flux is running, its own reconciliation of ./flux-system handles
      # this ordering fine -- only the one-time bootstrap needs the split.
      - name: Apply flux-system
        run: |
          kubectl apply -k flux-system/install
          kubectl wait --for=condition=Established --timeout=60s \
            crd/gitrepositories.source.toolkit.fluxcd.io \
            crd/ocirepositories.source.toolkit.fluxcd.io \
            crd/kustomizations.kustomize.toolkit.fluxcd.io
          kubectl apply -k flux-system/sync

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Lets flux-system/sync/oci-repository.yaml's OCIRepository pull the
      # promoted deploy/ artifact from a private Docker Hub repo. Reuses
      # the credentials already in this job rather than a new secret.
      - name: Provision the OCIRepository pull secret
        run: |
          set -euo pipefail
          kubectl create secret docker-registry dockerhub-deploy-pull \
            --docker-username="${{ secrets.DOCKER_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_PASSWORD }}" \
            --namespace flux-system \
            --dry-run=client --validate=false -o yaml | kubectl apply -f -

      # Push as one sha-tagged OCI artifact, then move the moving `deploy`
      # tag to point at it -- the promotion boundary flux-system/sync/
      # oci-repository.yaml's OCIRepository follows for both deploy/ and
      # flux-system/. Neither tree is watched straight off `main`, so Flux
      # only ever reconciles revisions this job has vetted.
      - name: Push and promote the OCI artifact
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::12}"
          flux push artifact "oci://docker.io/ticklethepanda/home-deploy:sha-${sha}" \
            --path="." \
            --source="$(git config --get remote.origin.url)" \
            --revision="main@sha1:${GITHUB_SHA}"
          flux tag artifact "oci://docker.io/ticklethepanda/home-deploy:sha-${sha}" \
            --tag deploy

      # Trigger reconciliation immediately rather than waiting for the
      # OCIRepository's own polling interval. Only the source needs an
      # explicit trigger: kustomize-controller watches its sourceRef and
      # auto-reconciles on every artifact revision change, so
      # setup/home/internal pick this up on their own. The wait step below
      # does the actual waiting, with its own independent budget.
      - name: Trigger Flux reconciliation
        run: flux reconcile source oci deploy -n flux-system

      # lastAppliedRevision mirrors the OCIRepository's own
      # artifact.revision (deploy@sha256:<digest>) -- not the --revision
      # string passed to `flux push artifact` above, which is metadata
      # inside the artifact, not what source-controller reports. Read it
      # straight from the source rather than constructing a sha1-based
      # string that could never match.
      - name: Read the promoted revision
        run: |
          revision=$(kubectl -n flux-system get ocirepository deploy -o jsonpath='{.status.artifact.revision}')
          echo "PROMOTED_REVISION=${revision}" >> "$GITHUB_ENV"

      # Fast feedback on an obviously-broken revision (bad manifest, a
      # dangling reference) -- not an authoritative gate. The artifact is
      # already promoted and Flux keeps reconciling on its own 10m interval
      # regardless. A failure here, or one that only surfaces after this
      # step's short budget, lands as a red commit status via the Flux
      # GitHub Alert (flux-system/sync/notifications.yaml).
      #
      # continue-on-error plus the tight timeout-minutes keep a cancel or a
      # stuck run down to seconds -- the old poll loop could hold the
      # `cluster` concurrency lock for ~50 minutes and swallowed SIGTERM.
      # `flux reconcile` is a single interruptible process; the loop does
      # not abort on one bad Kustomization so every commit status still
      # gets posted.
      - name: Confirm the promoted revision reconciles
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -uo pipefail
          expected="${PROMOTED_REVISION}"
          rc=0
          flux reconcile source oci deploy -n flux-system --timeout=2m || rc=1
          for ks in flux-system setup setup-config home internal; do
            if ! flux reconcile kustomization "$ks" -n flux-system --timeout=3m; then
              echo "::warning::kustomization/$ks did not reconcile cleanly"
              rc=1
            fi
            applied=$(kubectl -n flux-system get kustomization "$ks" \
              -o jsonpath='{.status.lastAppliedRevision}' 2>/dev/null || true)
            [[ "$applied" == *"$expected"* ]] \
              || echo "::warning::kustomization/$ks applied ${applied:-<none>}, expected $expected"
          done
          exit $rc
