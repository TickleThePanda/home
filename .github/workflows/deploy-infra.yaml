name: Deploy - infra

# Called by deploy.yaml's `infra` job. Layer order matches ansible/site.yml:
# proxmox creates the VMs k3s joins; node lands the Pi's storage mounts that
# k3s-agent requires; k3s precedes the cluster manifests, which run on it.
# The router runs last --
# nothing depends on it (it serves no DNS and no DHCP), and it is the one
# layer that can drop CI's own egress, so a WAN blip there cannot strand a
# layer that had yet to run.
#
# The router firmware (router/) runs after the router playbook, which keeps
# the sysupgrade keep list current, and the playbook runs again after a flash.
# A flash cuts CI's own path for a few minutes; router/upgrade.sh only polls
# afterwards, and the job waits for the cluster API and cloudflared before
# the cluster and terraform jobs go on.
#
# Each layer runs when the push changed a file its playbook reads, or on a
# manual workflow_dispatch. The monthly schedule runs only the firmware. The filters below list every role, vars file and
# shared file per layer. A file a layer reads but doesn't list is a deploy that
# silently never happens, so keep them in step with the playbooks.

on:
  workflow_call:

# Rollout gate for unattended flashing. While "false", only a manual dispatch
# flashes the router; a push or the schedule reports the drift and stops.
env:
  ROUTER_AUTO_FLASH: "false"

jobs:
  infra:
    runs-on: ubuntu-24.04
    environment: prod
    # Secrets are set for the whole job rather than per layer. Every layer runs
    # in this one job against the `prod` environment, so each could reference
    # any of these secrets directly regardless of where they are exported --
    # per-step scoping would be the appearance of a boundary, not one.
    env:
      PROXMOX_API_TOKEN_ID: ${{ secrets.PROXMOX_API_TOKEN_ID }}
      PROXMOX_API_TOKEN_SECRET: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
      DOCKER_PULL_USERNAME: ${{ secrets.DOCKER_PULL_USERNAME }}
      DOCKER_PULL_TOKEN: ${{ secrets.DOCKER_PULL_TOKEN }}
      ROUTER_PPPOE_USERNAME: ${{ secrets.ROUTER_PPPOE_USERNAME }}
      ROUTER_PPPOE_PASSWORD: ${{ secrets.ROUTER_PPPOE_PASSWORD }}
      ROUTER_WIFI_KEY: ${{ secrets.ROUTER_WIFI_KEY }}
      ROUTER_WIFI_IOT_KEY_INET: ${{ secrets.ROUTER_WIFI_IOT_KEY_INET }}
      ROUTER_WIFI_IOT_KEY_LOCAL: ${{ secrets.ROUTER_WIFI_IOT_KEY_LOCAL }}
      ROUTER_WIFI_IOT_KEY_ECHO: ${{ secrets.ROUTER_WIFI_IOT_KEY_ECHO }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # `shared` is what every layer reads; a change to it runs them all. The
      # layer lists add what only some layers read:
      #
      #   roles/ssh_keys, roles/node_exporter, files/   proxmox, node, k3s
      #   group_vars/pi.yml, host_vars/                 node and k3s (the Pi
      #                                                 is in both layers)
      # Markdown never triggers a deploy: `some-with-excludes` drops any file a
      # `!` pattern matches.
      - name: Detect which layers changed
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            shared:
              - 'ansible/group_vars/all.yml'
              - 'ansible/inventory.yml'
              - 'ansible/known_hosts'
              - 'ansible/ansible.cfg'
              - 'ansible/requirements.yml'
              - '.github/actions/ansible-*/**'
              - '!**/*.md'
            proxmox:
              - 'ansible/proxmox/**'
              - 'ansible/roles/ssh_keys/**'
              - 'ansible/roles/node_exporter/**'
              - 'ansible/files/**'
              - 'ansible/group_vars/proxmox.yml'
              - '!**/*.md'
            node:
              - 'ansible/node/**'
              - 'ansible/roles/ssh_keys/**'
              - 'ansible/roles/node_exporter/**'
              - 'ansible/files/**'
              - 'ansible/group_vars/pi.yml'
              - 'ansible/host_vars/**'
              - '!**/*.md'
            k3s:
              - 'ansible/k3s/**'
              - 'ansible/roles/ssh_keys/**'
              - 'ansible/roles/node_exporter/**'
              - 'ansible/files/**'
              - 'ansible/group_vars/k3s_cluster.yml'
              - 'ansible/group_vars/pi.yml'
              - 'ansible/host_vars/**'
              - '!**/*.md'
            router:
              - 'ansible/router/**'
              - 'ansible/group_vars/router.yml'
              - '!**/*.md'
            firmware:
              - 'router/**'
              - '!**/*.md'

      # paths-filter finds nothing on a workflow_dispatch (it diffs HEAD
      # against its own merge-base), so a manual run selects every layer here. A
      # change to `shared` selects every Ansible layer too. The schedule
      # selects only the firmware.
      - name: Select the layers to run
        id: layers
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          SCHEDULE: ${{ github.event_name == 'schedule' }}
          SHARED: ${{ steps.changes.outputs.shared }}
          PROXMOX: ${{ steps.changes.outputs.proxmox }}
          NODE: ${{ steps.changes.outputs.node }}
          K3S: ${{ steps.changes.outputs.k3s }}
          ROUTER: ${{ steps.changes.outputs.router }}
          FIRMWARE: ${{ steps.changes.outputs.firmware }}
        run: |
          set -euo pipefail
          pick() {
            if [ "$DISPATCH" = "true" ] || [ "$SHARED" = "true" ] || [ "$2" = "true" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          pick proxmox "$PROXMOX"
          pick node "$NODE"
          pick k3s "$K3S"
          pick router "$ROUTER"
          if [ "$DISPATCH" = "true" ] || [ "$SCHEDULE" = "true" ] || [ "$FIRMWARE" = "true" ]; then
            echo "firmware=true" >> "$GITHUB_OUTPUT"
          else
            echo "firmware=false" >> "$GITHUB_OUTPUT"
          fi

      # Before WARP: with it connected, the Image Builder container can't reach
      # downloads.openwrt.org. No secrets go into this image; the router keeps
      # its own config.
      - name: Build the router firmware
        if: steps.layers.outputs.firmware == 'true'
        env:
          CONTAINER_RUNTIME: docker
        run: ./router/build.sh

      - name: Connect to Cloudflare Warp
        uses: ./.github/actions/cloudflare-warp
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}

      # The k3s layer's end-state assertion and the firmware flash (kured's
      # lock, the post-flash wait) need kubectl.
      - name: Setup k8s context
        if: steps.layers.outputs.k3s == 'true' || steps.layers.outputs.firmware == 'true'
        uses: azure/k8s-set-context@v5.0.1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      # community.proxmox drives the VM lifecycle through the Proxmox API and
      # needs proxmoxer on the control node; ansible.utils needs netaddr.
      - name: Set up Ansible
        uses: ./.github/actions/ansible-setup
        with:
          working-directory: ansible
          extra-pip: proxmoxer>=2.3.0 requests netaddr

      # The CI key. Its trusted public half is committed
      # (ansible/files/ssh-authorized-keys), so nothing here needs to derive
      # it -- this only installs the private key CI authenticates with.
      - name: Install the SSH key
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.NODE_SSH_KEY }}" > ~/.ssh/deploy_key

      # CI authenticates with a service token, not a user identity, so a Zero
      # Trust policy could permit 6443 without permitting a given host's 22.
      # Check the kube API first to tell "the tunnel is down" apart from "a
      # policy is gating this host", then probe only the hosts in scope.
      - name: Check the hosts in scope are reachable
        env:
          RUN_PROXMOX: ${{ steps.layers.outputs.proxmox }}
          RUN_NODE: ${{ steps.layers.outputs.node }}
          RUN_K3S: ${{ steps.layers.outputs.k3s }}
          RUN_ROUTER: ${{ steps.layers.outputs.router == 'true' || steps.layers.outputs.firmware == 'true' }}
        run: |
          set -euo pipefail
          if ! nc -zv -w 10 192.168.1.32 6443; then
            echo "::error::Cannot reach the kube API -- the tunnel is down, not a per-host policy. cloudflared runs in-cluster; see ansible/node/RECOVERY.md."
            exit 1
          fi
          targets=""
          # 8006 is the Proxmox API, used by the VM-lifecycle tasks.
          if [ "$RUN_PROXMOX" = "true" ]; then targets="$targets 192.168.1.3:22 192.168.1.3:8006"; fi
          if [ "$RUN_NODE" = "true" ]; then targets="$targets 192.168.1.2:22"; fi
          if [ "$RUN_K3S" = "true" ]; then targets="$targets 192.168.1.2:22 192.168.1.32:22 192.168.1.33:22 192.168.1.34:22"; fi
          if [ "$RUN_ROUTER" = "true" ]; then targets="$targets 192.168.1.1:22"; fi
          for t in $(echo "$targets" | tr ' ' '\n' | sort -u); do
            [ -n "$t" ] || continue
            if ! nc -zv -w 10 "${t%:*}" "${t##*:}"; then
              echo "::error::6443 is reachable but ${t} is not -- add it to the Zero Trust network policy for the CI service token (or, for a VM, it is not provisioned yet)."
              exit 1
            fi
          done

      - name: Check every gathering play uses the shared gather_subset
        run: ./scripts/check-gather-subset.py ansible

      # One parse covers all four layers. Syntax only, not state -- Apply below
      # is the first SSH-based run, so a partial failure there can still leave
      # real changes applied. Acceptable for idempotent hosts.
      - name: Syntax check
        working-directory: ansible
        run: ansible-playbook site.yml --syntax-check

      - name: Proxmox host and k3s VMs
        if: steps.layers.outputs.proxmox == 'true'
        uses: ./.github/actions/ansible-apply
        with:
          playbook: proxmox/proxmox.yml

      - name: Pi node state
        if: steps.layers.outputs.node == 'true'
        uses: ./.github/actions/ansible-apply
        with:
          playbook: node/node.yml

      # The k3s.orchestration roles skip their install/restart tasks under
      # --check, so a drift gate would be meaningless. Assert the real end
      # state below instead.
      - name: K3s on every node
        if: steps.layers.outputs.k3s == 'true'
        uses: ./.github/actions/ansible-apply
        with:
          playbook: k3s/k3s.yml
          check-idempotence: "false"

      - name: Confirm the cluster is whole
        if: steps.layers.outputs.k3s == 'true'
        run: |
          set -euo pipefail
          nodes=$(kubectl get nodes -o json)
          ready=$(echo "$nodes" | jq '[.items[] | select(
            any(.status.conditions[]; .type=="Ready" and .status=="True"))] | length')
          total=$(echo "$nodes" | jq '.items | length')
          echo "nodes ready: ${ready}/${total}"
          kubectl get nodes -o wide
          if [ "$ready" != "4" ] || [ "$total" != "4" ]; then
            echo "::error::expected 4 Ready nodes, got ${ready}/${total}"; exit 1
          fi
          if ! echo "$nodes" | jq -e '.items[] | select(.metadata.name=="k3s-vm-control-01")
            | .spec.taints // [] | any(.key=="ticklethepanda.dev/control-plane" and .effect=="NoSchedule")' >/dev/null; then
            echo "::error::k3s-vm-control-01 is missing the control-plane-only taint"; exit 1
          fi

      # Last: this is CI's own egress path. See the header.
      - name: Router
        if: steps.layers.outputs.router == 'true'
        uses: ./.github/actions/ansible-apply
        with:
          playbook: router/router.yml

      - name: Compare the router with the build
        id: firmware
        if: steps.layers.outputs.firmware == 'true'
        env:
          FLASH_ALLOWED: ${{ github.event_name == 'workflow_dispatch' || env.ROUTER_AUTO_FLASH == 'true' }}
        run: |
          set -euo pipefail
          # 0: already running this build; 3: differs; anything else: error.
          rc=0
          SSH_KEY=~/.ssh/deploy_key ./router/upgrade.sh check router/out || rc=$?
          case "$rc" in
            0) echo "flash=false" >> "$GITHUB_OUTPUT" ;;
            3)
              if [ "$FLASH_ALLOWED" = "true" ]; then
                echo "flash=true" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::The router does not run the firmware in router/ (diff above). ROUTER_AUTO_FLASH is off; dispatch this workflow to flash it."
                echo "flash=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *) exit "$rc" ;;
          esac

      # kured's lock, so no node or proxmox-01 reboot overlaps the flash. Same
      # format and resourceVersion guard as
      # deploy/setup/kured/proxmox-reboot/proxmox-reboot.sh.
      - name: Take kured's reboot lock
        id: lock
        if: steps.firmware.outputs.flash == 'true'
        run: |
          set -euo pipefail
          lock=weave.works/kured-node-lock
          ds=$(kubectl -n kube-system get ds kured -o json)
          holder=$(jq -r --arg a "$lock" '.metadata.annotations[$a] // empty' <<<"$ds")
          if [ -n "$holder" ]; then
            echo "::error::kured's lock is held ($holder): a reboot is in progress. Re-run once it is released."
            exit 1
          fi
          value=$(jq -cn --arg now "$(date -u +%FT%TZ)" \
            '{nodeID: "router-firmware", metadata: {unschedulable: false}, created: $now, TTL: 0}')
          kubectl -n kube-system annotate ds kured "$lock=$value" \
            --resource-version="$(jq -r .metadata.resourceVersion <<<"$ds")"

      - name: Flash the router
        id: flash
        if: steps.firmware.outputs.flash == 'true'
        env:
          BACKUP: ${{ runner.temp }}/router-backup.tar.gz.age
        run: |
          set -euo pipefail
          SSH_KEY=~/.ssh/deploy_key ./router/upgrade.sh flash router/out 2>&1 \
            | tee "$RUNNER_TEMP/router-upgrade.log"

      # The flash dropped cloudflared's upstream; the cluster and terraform
      # jobs reach the LAN through it.
      - name: Wait for the cluster API and cloudflared
        if: steps.flash.outcome == 'success'
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            kubectl get --raw /readyz >/dev/null 2>&1 && break
            [ "$i" -lt 30 ] || { echo "::error::API server not ready 5 min after the flash"; exit 1; }
            sleep 10
          done
          kubectl wait --all-namespaces --for=condition=Ready pod \
            --selector pod=cloudflared --timeout=300s

      # A failure before the flash releases the lock. A failed flash keeps it,
      # which pauses kured until someone releases it by hand
      # (deploy/setup/kured/README.md#the-lock): the router needs a human first.
      - name: Release kured's reboot lock
        if: always() && steps.lock.outcome == 'success'
        env:
          FLASHED: ${{ steps.flash.outcome }}
        run: |
          set -euo pipefail
          if [ "$FLASHED" = "failure" ] && grep -qx '== flash' "$RUNNER_TEMP/router-upgrade.log" 2>/dev/null; then
            echo "::error::The flash failed after sysupgrade started. kured's lock stays held until the router is checked; release it by hand."
            exit 1
          fi
          kubectl -n kube-system annotate ds kured weave.works/kured-node-lock-

      - name: Router, reconciled after the flash
        if: steps.flash.outcome == 'success'
        uses: ./.github/actions/ansible-apply
        with:
          playbook: router/router.yml

      # The backup is encrypted to the committed SSH keys (router/upgrade.sh),
      # so it is safe in a public repo's artifacts.
      - name: Keep the firmware manifest and config backup
        if: always() && steps.firmware.outputs.flash == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: router-firmware-${{ github.run_id }}
          path: |
            router/out/firmware.manifest
            ${{ runner.temp }}/router-backup.tar.gz.age
            ${{ runner.temp }}/router-upgrade.log
          retention-days: 90
          if-no-files-found: warn
