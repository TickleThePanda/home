name: Build and deploy librofm-sync

on:
  push:
    branches: main
    paths:
    - apps/sync-runner/**
    - .github/workflows/build--librofm-sync.yml
    - .github/workflows/build-image.yaml
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      image: ticklethepanda/librofm-sync
      context: ./apps/sync-runner/
      dockerfile: apps/sync-runner/Dockerfile.librofm
      restart: audiobookshelf/audiobookshelf
