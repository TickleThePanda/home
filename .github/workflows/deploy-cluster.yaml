name: Deploy - cluster

# Called by deploy.yaml's `cluster` job once infra has landed. Promotes the
# repo as an OCI artifact; Flux applies k8s/ from it.

on:
  workflow_call:
    outputs:
      promoted:
        description: Revision Flux was pointed at; empty if the push never completed.
        value: ${{ jobs.cluster.outputs.promoted }}

# The deploy artifact is signed keyless with Cosign: the certificate names
# this workflow on main, and k8s/cluster/sync/oci-repository.yaml refuses an
# artifact without that signature. The prod environment only deploys main, so
# a branch can't run this job to get a matching certificate.
env:
  ARTIFACT: docker.io/ticklethepanda/home-deploy
  SIGNER: https://github.com/TickleThePanda/home/.github/workflows/deploy-cluster.yaml@refs/heads/main
  SIGNER_ISSUER: https://token.actions.githubusercontent.com

jobs:
  cluster:
    runs-on: ubuntu-26.04
    environment: prod
    permissions:
      contents: read
      # Keyless signing: GitHub's OIDC token gets a short-lived certificate.
      id-token: write
    outputs:
      promoted: ${{ steps.revision.outputs.promoted }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Connect to Cloudflare Warp
        uses: ./.github/actions/cloudflare-warp
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}

      - name: Setup k8s context
        uses: azure/k8s-set-context@v5.0.1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      # Same release as the FluxInstance's distribution.version
      # (scripts/check-versions.sh checks they match).
      - name: Install the flux CLI
        uses: fluxcd/flux2/action@v2.10.0
        with:
          version: 2.10.0

      # Flux manages k8s/cluster/ itself (sync/self.yaml); CI never applies
      # it. CI holds no age key, so it can't bootstrap Flux either -- a human
      # runs k8s/cluster/bootstrap.sh. A FluxInstance that exists but isn't
      # Ready doesn't stop the push: the fix for it may be in this commit, and
      # the running controllers still apply it.
      - name: Check Flux is bootstrapped
        run: |
          if ! kubectl get crd kustomizations.kustomize.toolkit.fluxcd.io >/dev/null 2>&1 \
            || ! kubectl -n flux-system get secret sops-age >/dev/null 2>&1 \
            || ! kubectl -n flux-system get fluxinstance/flux >/dev/null 2>&1; then
            echo "::error title=Flux not bootstrapped::Flux CRDs, the sops-age Secret or the FluxInstance are missing; run k8s/cluster/bootstrap.sh"
            exit 1
          fi
          if ! kubectl -n flux-system wait --for=condition=Ready --timeout=10s fluxinstance/flux >/dev/null 2>&1; then
            echo "::warning title=FluxInstance not Ready::$(kubectl -n flux-system get fluxinstance/flux -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}')"
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Vendors vendor.txt into the tree, so the artifact is self-contained and
      # Flux never fetches from GitHub, then validates everything Flux
      # reconciles, so a broken manifest fails here instead of after promotion.
      # validate.yaml runs the same checks on Renovate branches.
      - name: Vendor and validate
        uses: ./.github/actions/validate-cluster

      # Signatures use Cosign's classic format (a .sig tag beside the digest):
      # the newer bundle format, Cosign 3's default, isn't found again on
      # Docker Hub. The flags for it are deprecated, so a Cosign major that
      # drops them needs another look.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.4

      # Push as one sha-tagged OCI artifact, sign its digest, then move the
      # `deploy` tag to it -- the promotion boundary
      # k8s/cluster/sync/oci-repository.yaml's OCIRepository follows for all of
      # k8s/. Nothing is watched straight off `main`, so Flux only ever
      # reconciles revisions this job has vetted and signed.
      - name: Push the OCI artifact
        id: push
        run: |
          set -euo pipefail
          digest=$(flux push artifact "oci://${ARTIFACT}:sha-${GITHUB_SHA::12}" \
            --path="." \
            --source="$(git config --get remote.origin.url)" \
            --revision="main@sha1:${GITHUB_SHA}" \
            --output json | jq -re .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Signs the digest, not a tag, so moving a tag can't reuse it.
      - name: Sign the artifact
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes --new-bundle-format=false --use-signing-config=false "${ARTIFACT}@${DIGEST}"

      # The same check Flux makes, plus the caller's ref: deploy.yaml on main.
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${ARTIFACT}@${DIGEST}" --new-bundle-format=false \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer "$SIGNER_ISSUER" \
            --certificate-github-workflow-repository TickleThePanda/home \
            --certificate-github-workflow-ref refs/heads/main >/dev/null

      # Re-verifies through the sha tag, so the tag still points at the signed
      # digest when `deploy` moves to it.
      - name: Promote the artifact
        run: |
          set -euo pipefail
          tagged="${ARTIFACT}:sha-${GITHUB_SHA::12}"
          cosign verify "$tagged" --new-bundle-format=false \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer "$SIGNER_ISSUER" >/dev/null
          flux tag artifact "oci://${tagged}" --tag deploy

      # Trigger reconciliation immediately rather than waiting for the
      # OCIRepository's own polling interval. Only the source needs it:
      # k8s/cluster/sync/artifact-generator.yaml regenerates the per-layer
      # artifacts from it, and each Kustomization reconciles only when its
      # own artifact's revision changes.
      - name: Trigger Flux reconciliation
        run: flux reconcile source oci deploy -n flux-system

      # The OCIRepository's own revision (deploy@sha256:<digest>), not the
      # --revision string passed to `flux push artifact`.
      - name: Read the promoted revision
        id: revision
        run: |
          revision=$(kubectl -n flux-system get ocirepository deploy -o jsonpath='{.status.artifact.revision}')
          echo "promoted=${revision}" >> "$GITHUB_OUTPUT"

      # Fails the job when any Kustomization isn't Ready on this commit, with
      # an error annotation per failure and a table in the run summary. It
      # waits rather than forcing reconciles, so unchanged layers stay
      # untouched. This is the last step: the `promoted` output lets
      # deploy.yaml still run terraform, since Flux keeps retrying on its own.
      - name: Confirm the promoted commit reconciles
        timeout-minutes: 12
        run: ./scripts/wait-flux-deploy.sh "${GITHUB_SHA}"

      # Flux's pull secret (k8s/cluster/secrets/dockerhub-deploy-pull.sops.yaml)
      # must hold a read-only token, so a leak from the cluster can't replace
      # the artifact. Docker Hub's token endpoint shows what it may do: pull
      # must be granted, and asking for push or delete must be refused (a
      # read-only token gets a 401) or granted only pull. Runs after
      # reconciling, so it checks the Secret this commit applied.
      - name: Check Flux's registry token is read-only
        run: |
          set -euo pipefail
          auth=$(kubectl -n flux-system get secret dockerhub-deploy-pull -o jsonpath='{.data.\.dockerconfigjson}' \
            | base64 -d | jq -r '.auths[].auth' | head -n1 | base64 -d)
          granted() {
            local body
            body=$(curl -sS -w '\n%{http_code}' -u "$auth" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${ARTIFACT#docker.io/}:$1")
            [[ ${body##*$'\n'} == 200 ]] || { echo "refused"; return; }
            jq -r '.token | split(".")[1] | gsub("-"; "+") | gsub("_"; "/") | @base64d | fromjson
              | [.access[]?.actions[]] | unique | join(",")' <<<"${body%$'\n'*}"
          }
          pull=$(granted pull)
          write=$(granted pull,push,delete)
          if [[ $pull != pull || ( $write != refused && $write != pull ) ]]; then
            echo "::error title=Flux registry token not read-only::dockerhub-deploy-pull: pull gets '${pull}', push/delete gets '${write}'; it must pull and nothing more"
            exit 1
          fi
