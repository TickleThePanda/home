name: Build and deploy libation-sync

on:
  push:
    branches: main
    paths:
    - apps/sync-runner/**
    - .github/workflows/build--libation-sync.yml
    - .github/workflows/build-image.yaml
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      image: ticklethepanda/libation-sync
      context: ./apps/sync-runner/
      dockerfile: apps/sync-runner/Dockerfile.libation
      pull: true
      restart: audiobookshelf/audiobookshelf
