name: Build and deploy bind

on:
  push:
    branches: main
    paths:
    - apps/bind/**
    - .github/workflows/build--bind.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
      - name: Connect to Cloudflare Warp
        uses: ./.github/actions/cloudflare-warp
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver-opts: network=host
      - name: Login to DockerHub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build the image
        run: |
          docker buildx build --push \
          --tag ticklethepanda/bind:latest \
          --platform linux/amd64,linux/arm64 ./apps/bind/
      - name: Verify multi-arch manifest
        run: |
          got=$(docker buildx imagetools inspect --raw ticklethepanda/bind:latest \
            | jq -r '.manifests[].platform | [.os, .architecture, .variant] | map(select(.)) | join("/")')
          echo "$got"
          for want in linux/amd64 linux/arm64; do
            grep -qxF "$want" <<<"$got" || { echo "::error::bind image missing $want"; exit 1; }
          done
      - name: Setup k8s context
        uses: azure/k8s-set-context@v5.0.1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Rollout latest image
        run: kubectl rollout restart deployment/bind --namespace=bind
