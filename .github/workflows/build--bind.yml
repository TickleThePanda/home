name: Build and deploy bind

on:
  push:
    branches: main
    paths:
    - apps/bind/**
    - .github/workflows/build--bind.yml
    - .github/workflows/build-image.yaml
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      image: ticklethepanda/bind
      context: ./apps/bind/
      restart: bind/bind
