name: Deploy - terraform

# Called by deploy.yaml's `terraform` job, applying
# terraform/cloudflare-zero-trust/. Doesn't need WARP -- Cloudflare's and
# GCP's APIs are reached over the public internet, not through the tunnel.

on:
  workflow_call: {}

jobs:
  terraform:
    runs-on: ubuntu-26.04
    environment: prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/cloudflare-zero-trust
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ticklethepanda-web
          workload_identity_provider: projects/388566333789/locations/global/workloadIdentityPools/pool/providers/github
          service_account: tf-home-manager@ticklethepanda-web.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
