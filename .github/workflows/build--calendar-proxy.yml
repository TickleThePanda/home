name: Build and deploy calendar-proxy

on:
  push:
    branches: main
    paths:
    - apps/calendar-proxy/**
    - .github/workflows/build--calendar-proxy.yml
    - .github/workflows/build-image.yaml
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      image: ticklethepanda/calendar-proxy
      context: ./apps/calendar-proxy/
      restart: home/calendar-proxy
