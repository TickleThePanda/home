name: Validate

# Cluster-independent checks on every push to a branch other than main.
# Renovate merges its branches into main only once this passes
# (renovate.json); a failure leaves it as a PR instead. Pushes to main get the manifest checks from
# deploy-cluster.yaml, which runs them before it promotes.
#
# Needs no cluster, WARP or environment secrets, so it also runs while the
# cluster is down.

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Bumped by Renovate (renovate.json). Needs the Node version below.
      RENOVATE_VERSION: 44.181.6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The image check diffs against main.
          fetch-depth: 0

      - name: Vendor and validate
        uses: ./.github/actions/validate-cluster

      # Only the images the branch changed since it forked from main.
      - name: Check changed images are multi-arch
        run: ./scripts/check-image-platforms.sh "$(git merge-base origin/main HEAD)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check Renovate config and coverage
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: ./scripts/check-renovate.sh
