name: Validate

# Cluster-independent checks on every push to a branch other than main,
# whatever it changed. Renovate merges its branches into main only once this
# passes (renovate.json); a failure leaves it as a PR instead. Pushes to main
# get the manifest checks from deploy-cluster.yaml, which runs them before it
# promotes.
#
# Needs no cluster, WARP or environment secrets, so it also runs while the
# cluster is down. The jobs run in parallel.

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-26.04
    env:
      # The CLI's major only: it releases several times a day, and an exact
      # pin moved on every Renovate run instead of merging. The Mend app runs
      # the latest release too. Renovate proposes the next major. Needs the
      # Node version below.
      RENOVATE_VERSION: 44
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # The image check diffs against main.
          fetch-depth: 0

      - name: Vendor and validate
        uses: ./.github/actions/validate-cluster

      # Only changed images: checking every image on every push would hit
      # Docker Hub's pull rate limit.
      - name: Check changed images are multi-arch
        run: ./scripts/check-image-platforms.sh "$(git merge-base origin/main HEAD)"

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Check Renovate config and coverage
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: ./scripts/check-renovate.sh

  # The jobs below cover what Renovate also bumps outside k8s/: a collection,
  # provider, base image or OpenWrt bump that breaks the build.
  ansible:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ansible
        uses: ./.github/actions/ansible-setup
        with:
          working-directory: ansible
          extra-pip: proxmoxer>=2.3.0 requests netaddr

      # Catches a collection or ansible-core bump that drops a module or
      # option the playbooks use.
      - name: Check the Ansible syntax
        working-directory: ansible
        run: ansible-playbook site.yml --syntax-check

  terraform:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      # Catches a provider bump that removes an attribute the config sets.
      - name: Validate the Terraform roots
        run: |
          for root in terraform/cloudflare-zero-trust bootstrap/terraform; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  apps:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Builds without pushing, for both cluster architectures. Catches a base
      # image bump that breaks the build or drops an architecture.
      - name: Build the app images
        run: |
          for dockerfile in $(git ls-files 'apps/*/Dockerfile*'); do
            echo "::group::$dockerfile"
            docker buildx build --platform linux/amd64,linux/arm64 -f "$dockerfile" "$(dirname "$dockerfile")"
            echo "::endgroup::"
          done

  router:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Image Builder resolves router/packages.txt against the release's feeds.
      # build.sh fails on a package that doesn't resolve or an image that isn't
      # for the GL-MT6000, so an OpenWrt bump that drops or renames a package
      # never merges. No secrets: the router keeps its own config.
      - name: Build the router firmware
        env:
          CONTAINER_RUNTIME: docker
        run: ./router/build.sh

      - name: Record the firmware's packages
        run: |
          {
            echo '### Router firmware'
            echo '```'
            cat router/out/firmware.manifest
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The one check the ruleset on main requires: it passes only if every job
  # above passed, so adding a job needs no ruleset change.
  validate:
    needs: [cluster, ansible, terraform, apps, router]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [[ $result == success ]] || exit 1
          done
