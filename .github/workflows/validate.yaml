name: Validate

# Cluster-independent checks on every push to a branch other than main.
# Renovate merges its branches into main only once this passes
# (renovate.json); a failure leaves it as a PR instead. Pushes to main get
# the manifest checks from deploy-cluster.yaml, which runs them before it
# promotes.
#
# Needs no cluster, WARP or environment secrets, so it also runs while the
# cluster is down.

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Bumped by Renovate (renovate.json). Needs the Node version below.
      RENOVATE_VERSION: 44.181.6
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # The image check diffs against main.
          fetch-depth: 0

      - name: Vendor and validate
        uses: ./.github/actions/validate-cluster

      # Only the images the branch changed since it forked from main.
      - name: Check changed images are multi-arch
        run: ./scripts/check-image-platforms.sh "$(git merge-base origin/main HEAD)"

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Check Renovate config and coverage
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: ./scripts/check-renovate.sh

      # The checks below cover what Renovate also bumps outside deploy/. They
      # run only when the branch touches that tree, since the deploy and build
      # workflows otherwise first exercise it after the merge.
      - name: Detect which trees changed
        uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          base: main
          filters: |
            ansible:
              - 'ansible/**'
              - '.github/actions/ansible-setup/**'
              - '.github/workflows/validate.yaml'
            terraform:
              - 'terraform/**'
              - 'bootstrap/terraform/**'
              - '.github/workflows/validate.yaml'
            apps:
              - 'apps/**'
              - '.github/workflows/validate.yaml'

      - name: Set up Ansible
        if: steps.changes.outputs.ansible == 'true'
        uses: ./.github/actions/ansible-setup
        with:
          working-directory: ansible
          extra-pip: proxmoxer>=2.3.0 requests netaddr

      # Catches a collection or ansible-core bump that drops a module or
      # option the playbooks use.
      - name: Check the Ansible syntax
        if: steps.changes.outputs.ansible == 'true'
        working-directory: ansible
        run: ansible-playbook site.yml --syntax-check

      - name: Set up Terraform
        if: steps.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      # Catches a provider bump that removes an attribute the config sets.
      - name: Validate the Terraform roots
        if: steps.changes.outputs.terraform == 'true'
        run: |
          for root in terraform/cloudflare-zero-trust bootstrap/terraform; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

      - name: Set up QEMU
        if: steps.changes.outputs.apps == 'true'
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        if: steps.changes.outputs.apps == 'true'
        uses: docker/setup-buildx-action@v4.4.1

      # Builds without pushing, for both cluster architectures. Catches a base
      # image bump that breaks the build or drops an architecture.
      - name: Build the changed app images
        if: steps.changes.outputs.apps == 'true'
        run: |
          base=$(git merge-base origin/main HEAD)
          for dockerfile in $(git ls-files 'apps/*/Dockerfile*'); do
            dir=$(dirname "$dockerfile")
            git diff --quiet "$base" HEAD -- "$dir" .github/workflows/validate.yaml && continue
            echo "::group::$dockerfile"
            docker buildx build --platform linux/amd64,linux/arm64 -f "$dockerfile" "$dir"
            echo "::endgroup::"
          done
