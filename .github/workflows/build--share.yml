name: Build and deploy share

on:
  push:
    branches: main
    paths:
    - apps/share/**
    - .github/workflows/build--share.yml
    - .github/workflows/build-image.yaml
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      image: ticklethepanda/share
      context: ./apps/share/
      restart: home/share
