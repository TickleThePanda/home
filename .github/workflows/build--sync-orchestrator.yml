name: Build and deploy sync-orchestrator

on:
  push:
    branches: main
    paths:
    - apps/sync-orchestrator/**
    - .github/workflows/build--sync-orchestrator.yml
    - .github/workflows/build-image.yaml
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    secrets: inherit
    with:
      image: ticklethepanda/sync-orchestrator
      context: ./apps/sync-orchestrator/
      restart: audiobookshelf/sync-orchestrator
