name: Build and deploy image

# Called by each build--<app>.yml: builds a multi-arch image, pushes it as
# :latest, then restarts the Deployments that run it so they pull it.
#
# Named build-image, not deploy-*, so deploy.yaml's
# `.github/workflows/deploy*.yaml` path filter doesn't pick it up.
#
# A Deployment that doesn't exist yet is skipped, not a failure: an app's
# first commit lands its image and its k8s/ manifests together, and this runs
# before Flux has applied them. When Flux creates the Deployment it pulls
# :latest anyway.

on:
  workflow_call:
    inputs:
      image:
        description: Image repository, without a tag (e.g. ticklethepanda/share).
        type: string
        required: true
      context:
        description: Build context directory.
        type: string
        required: true
      dockerfile:
        description: Dockerfile path, if not <context>/Dockerfile.
        type: string
        default: ""
      platforms:
        description: Comma-separated platforms to build; each must be in the pushed manifest.
        type: string
        default: linux/amd64,linux/arm64
      pull:
        description: Always pull newer base images.
        type: boolean
        default: false
      restart:
        description: Deployments to restart after the push, one `namespace/name` per line.
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-26.04
    environment: prod
    env:
      TAG: ${{ inputs.image }}:latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Connect to Cloudflare Warp
        if: inputs.restart != ''
        uses: ./.github/actions/cloudflare-warp
        with:
          organization: ticklethepanda
          auth_client_id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          auth_client_secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build the image
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          PLATFORMS: ${{ inputs.platforms }}
          PULL: ${{ inputs.pull }}
        run: |
          args=(--push --tag "$TAG" --platform "$PLATFORMS")
          [[ $PULL == true ]] && args+=(--pull)
          [[ -n $DOCKERFILE ]] && args+=(-f "$DOCKERFILE")
          docker buildx build "${args[@]}" "$CONTEXT"
      - name: Verify multi-arch manifest
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          got=$(docker buildx imagetools inspect --raw "$TAG" \
            | jq -r '.manifests[].platform | [.os, .architecture, .variant] | map(select(.)) | join("/")')
          echo "$got"
          IFS=, read -ra want <<<"$PLATFORMS"
          for p in "${want[@]}"; do
            grep -qxF "$p" <<<"$got" || { echo "::error::$TAG missing $p"; exit 1; }
          done
      - name: Setup k8s context
        if: inputs.restart != ''
        uses: azure/k8s-set-context@5f008dfddbbc9df61ba40a7aaa912c6033ba62fc # v5.0.2
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      # Only NotFound skips a Deployment; any other error (auth, the tunnel
      # being down) still fails the job.
      - name: Rollout latest image
        if: inputs.restart != ''
        env:
          RESTART: ${{ inputs.restart }}
        run: |
          while read -r target; do
            [[ -z $target ]] && continue
            ns=${target%%/*}; name=${target#*/}
            if ! err=$(kubectl -n "$ns" get deployment "$name" -o name 2>&1 >/dev/null); then
              if [[ $err == *NotFound* ]]; then
                echo "::notice title=Rollout skipped::deployment/$name isn't in $ns yet; Flux will create it and pull the new image"
                continue
              fi
              echo "$err" >&2
              exit 1
            fi
            kubectl -n "$ns" rollout restart deployment "$name"
          done <<<"$RESTART"
