name: Cloudflare WARP
description: >-
  Install the headless WARP client (cloudflare-mesh), enroll it with a
  service token and wait until it's connected. The post step deletes the
  registration again, since Cloudflare never expires one.

inputs:
  organization:
    description: Zero Trust team name.
    required: true
  auth_client_id:
    description: Service token client ID.
    required: true
  auth_client_secret:
    description: Service token client secret.
    required: true

# A Node action rather than composite: only Node actions get a post step.
runs:
  using: node24
  main: main.js
  post: post.js
