# Flux managing its own upgrade: bumping the pinned install.yaml URL in
# ../kustomization.yaml is a normal git commit, reconciled from `main` like
# any other change here -- no promotion boundary needed for Flux's own
# components.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux-system
  prune: true
