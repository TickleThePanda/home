apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: setup-config
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: setup # the CRs here need setup's controllers/webhooks already running to pass admission
  sourceRef:
    kind: OCIRepository
    name: deploy
  # Relative to the pushed OCIRepository artifact's own root -- see
  # kustomization-setup.yaml's comment.
  path: ./deploy/setup-config
  prune: true
  wait: true
  timeout: 5m
