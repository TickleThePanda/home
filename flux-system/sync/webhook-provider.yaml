apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: incident-webhook
  namespace: flux-system
spec:
  type: generic
  address: https://webhook.site/9b7f8710-5772-4cda-97ac-1aa68b9bd411
