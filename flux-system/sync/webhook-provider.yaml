# TEMPORARY, for the 2026-08-23 tunnel-down incident: gives visibility into
# Flux's own in-cluster reconciliation without needing WARP/kubectl access
# at all, since notification-controller posts events out over the node's
# normal outbound egress -- completely independent of cloudflared. Remove
# once the incident is resolved and cloudflared is confirmed healthy again.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: incident-webhook
  namespace: flux-system
spec:
  type: generic
  # Repointed from webhook.site, which is unreachable from this cluster
  # (every channel timed out, including a DNS-bypassed --resolve one, so
  # it's blackholed rather than DNS-filtered). This is a cloudflared quick
  # tunnel fronting a listener on the operator's laptop. Ephemeral -- it
  # dies with that laptop-side tunnel and will need updating if restarted.
  address: https://phenomenon-coordinates-remained-retired.trycloudflare.com
