apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: setup
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: deploy
  path: ./deploy/setup
  prune: false # flip to true at Migration Milestone 3, once inventory/health are proven
  wait: true
  timeout: 5m
