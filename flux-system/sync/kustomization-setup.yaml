apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: setup
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: deploy
  # Relative to the pushed OCIRepository artifact's own root, which is the
  # git repo root -- CI's `flux push artifact --path=.` pushes the whole
  # repo as one artifact, shared with flux-system/sync/self.yaml.
  path: ./deploy/setup
  prune: true
  wait: true
  timeout: 5m
