apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: internal
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: setup-config # pihole-lb needs MetalLB's IPAddressPool (from setup-config)
  sourceRef:
    kind: OCIRepository
    name: deploy
  # Relative to the pushed OCIRepository artifact's own root -- see
  # kustomization-setup.yaml's comment.
  path: ./deploy/internal
  prune: true
  wait: true
  timeout: 5m
