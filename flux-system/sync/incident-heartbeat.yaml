# TEMPORARY, see webhook-provider.yaml. Posts unconditionally every 30s,
# independent of Flux's alert-on-state-change semantics (which could stay
# silent even if things are working, if setup is stuck repeating the same
# failure). If this heartbeat never shows up at all, that points to a
# broader node/cluster egress problem, not something specific to
# cloudflared -- since this pod's outbound path has nothing to do with it.
# Minimal footprint deliberately: this incident's working theory involves
# node resource pressure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-heartbeat
  namespace: flux-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-heartbeat
  template:
    metadata:
      labels:
        app: incident-heartbeat
    spec:
      containers:
        - name: heartbeat
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              while true; do
                curl -s -X POST https://webhook.site/9b7f8710-5772-4cda-97ac-1aa68b9bd411 \
                  -H "Content-Type: application/json" \
                  -d "{\"heartbeat\":true,\"node\":\"$(hostname)\",\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
                  || echo "curl failed"
                sleep 30
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 20m
              memory: 32Mi
