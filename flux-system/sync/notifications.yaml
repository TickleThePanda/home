# Flux -> GitHub commit status.
#
# Every Kustomization reconcile posts a pass/fail status against the git
# commit CI promoted, so a revision that reconciles green in the pipeline
# but goes unhealthy minutes later (or on a later 10m interval) still shows
# up -- as a red check on that commit on GitHub -- without the pipeline
# having to block and wait.
#
# The sources are OCI and External artifacts, not a GitRepository, so the
# commit SHA isn't in the reconcile revision. CI sets it with
# `flux push artifact --revision=main@sha1:<sha>`. It travels as the
# `org.opencontainers.image.revision` annotation, which artifact-generator.yaml
# copies onto each ExternalArtifact. kustomize-controller sends it as
# `originRevision` event metadata, which notification-controller posts against.
#
# A Kustomization only reconciles when its own artifact changes, so a commit
# shows statuses for the layers it changed (and flux-system), not all of them.
#
# Needs an out-of-band Secret `github-commit-status` with key `token`: a
# GitHub PAT scoped to commit-status write on this repo (fine-grained:
# "Commit statuses: Read and write"; classic: `repo:status`). See
# ansible/node/RECOVERY.md.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github-commit-status
  namespace: flux-system
spec:
  type: github
  address: https://github.com/ticklethepanda/home
  secretRef:
    name: github-commit-status
  # Status key shown on the commit, one per Kustomization
  # (e.g. `kustomization/internal`). Stable across runs so each new commit
  # updates the same check rather than stacking new ones.
  commitStatusExpr: "(event.involvedObject.kind + '/' + event.involvedObject.name).lowerAscii()"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-commit-status
  namespace: flux-system
spec:
  providerRef:
    name: github-commit-status
  # `info` still forwards errors -- it means "don't drop info-level events",
  # which is what makes the green (success) status post too.
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: "*"
---
# Failures only, to the existing Alertmanager (which emails via smtp-relay).
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: alertmanager
  namespace: flux-system
spec:
  type: alertmanager
  address: http://alertmanager.monitoring.svc:9093/api/v2/alerts
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: alertmanager
  namespace: flux-system
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
    - kind: Kustomization
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: ArtifactGenerator
      name: "*"
    - kind: ExternalArtifact
      name: "*"
    - kind: FluxInstance
      name: "*"
    # Every HelmRelease is in kube-system (deploy/setup/README.md).
    - kind: HelmRelease
      name: "*"
      namespace: kube-system
    - kind: HelmRepository
      name: "*"
      namespace: kube-system
    - kind: HelmChart
      name: "*"
      namespace: kube-system
    - kind: GitRepository
      name: "*"
    - kind: ImageRepository
      name: "*"
    - kind: ImagePolicy
      name: "*"
    - kind: ImageUpdateAutomation
      name: "*"
