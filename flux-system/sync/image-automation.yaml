# Commits tag bumps for the setter markers in deploy/ straight to main. Its
# push triggers deploy.yaml like any other commit to deploy/**, so a bump goes
# through the normal OCI promotion. Nothing reconciles from this GitRepository.
#
# Needs the Secret `flux-git-write` (identity, identity.pub, known_hosts): an
# SSH deploy key with write access. SOPS-encrypted in flux-git-write.sops.yaml;
# rotation is in ansible/node/RECOVERY.md.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: home-write
  namespace: flux-system
spec:
  interval: 10m
  url: ssh://git@github.com/TickleThePanda/home
  ref:
    branch: main
  secretRef:
    name: flux-git-write
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: home
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: home-write
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: flux@ticklethepanda.dev
      messageTemplate: |-
        flux: bump images

        {{ range .Changed.Changes -}}
        - {{ .OldValue }} -> {{ .NewValue }}
        {{ end -}}
    push:
      branch: main
  update:
    path: ./deploy
    strategy: Setters
