# Flux managing its own upgrade: bumping the pinned install.yaml URL in
# ../install/kustomization.yaml is a normal git commit, promoted through
# oci-repository.yaml like the rest of this repo -- not tracked straight
# off `main`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: deploy
  path: ./flux-system
  prune: true
