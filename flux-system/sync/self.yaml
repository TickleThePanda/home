# Flux managing its own upgrade: bumping the pinned install.yaml URL in
# vendor.txt is a normal git commit, promoted through
# oci-repository.yaml like the rest of this repo -- not tracked straight
# off `main`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: deploy
  path: ./flux-system
  prune: true
  timeout: 5m
  retryInterval: 2m
  # The controllers only, not `wait: true`: that would also gate on every
  # ImageRepository/ImagePolicy, so a registry scan failure would fail this.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: source-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: helm-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: notification-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: image-reflector-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: image-automation-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: source-watcher
      namespace: flux-system
  # Decrypts committed *.sops.yaml Secrets; the key is the out-of-band
  # `sops-age` Secret (.claude/rules/secrets.md).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
