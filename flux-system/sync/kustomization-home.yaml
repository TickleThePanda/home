apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: setup-config # home--cert.yaml needs the ClusterIssuer; root/ingress.yaml needs MetalLB's IPAddressPool
  sourceRef:
    kind: OCIRepository
    name: deploy
  # Relative to the pushed OCIRepository artifact's own root -- see
  # kustomization-setup.yaml's comment.
  path: ./deploy/home
  prune: true
  wait: true
  timeout: 5m
