apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: setup # home--cert.yaml needs cert-manager; root/ingress.yaml needs Traefik+MetalLB
  sourceRef:
    kind: OCIRepository
    name: deploy
  path: ./deploy/home
  prune: false # flip to true at Migration Milestone 3, once inventory/health are proven
  wait: true
  timeout: 5m
