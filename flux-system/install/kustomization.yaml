apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/fluxcd/flux2/releases/download/v2.9.4/install.yaml

# Image tag automation is out of scope for this migration (see the
# migration plan), and every extra pod is real load on the cluster's
# single Raspberry Pi node. `flux install --export` with the default
# --components list looked like a cleaner way to drop these, but it
# turned out to silently omit unrelated RBAC/quota objects (flux-edit,
# flux-view, the crd-controller ClusterRole/Binding, the critical-pods
# ResourceQuota) that this exact release's install.yaml does include --
# a mismatch between that generation path and the published asset, not
# something to reproduce here. Deleting just the specific unused
# objects from the full official manifest keeps everything else exactly
# as released.
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: image-reflector-controller
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: image-automation-controller
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: image-reflector-controller
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: image-automation-controller
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: imagepolicies.image.toolkit.fluxcd.io
  - patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: imagerepositories.image.toolkit.fluxcd.io
  - patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: imageupdateautomations.image.toolkit.fluxcd.io

  # TEMPORARY (2026-08-23 incident): make notification-controller resolve
  # via quad9 directly instead of cluster DNS (CoreDNS -> pihole), matching
  # what the heartbeat pod does. This is the pod that actually performs the
  # outbound POST for a Provider/Alert, so if the suspicion about pihole
  # being down is right, its alerts would be failing at DNS resolution.
  #
  # Safe for this controller specifically: it reaches the API server via
  # the KUBERNETES_SERVICE_HOST/PORT env vars (an IP, no DNS needed), so
  # losing cluster DNS doesn't cut it off from Kubernetes. Revert with the
  # rest of the incident tooling.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: notification-controller
        namespace: flux-system
      spec:
        template:
          spec:
            dnsPolicy: "None"
            dnsConfig:
              nameservers:
                - 9.9.9.9

  # source-watcher is an upstream sample/reference component that nothing
  # here uses -- dropping it reclaims 50m CPU / 64Mi of requests and, more
  # importantly, removes another 1Gi memory ceiling from a node where
  # memory pressure is the leading explanation for pods not scheduling.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: source-watcher
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: source-watcher
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: source-watcher
        namespace: flux-system

  # Upstream ships every controller with a 1Gi memory limit -- 5Gi of
  # headroom in total on a Raspberry Pi. Limits aren't reserved, so they
  # don't block scheduling, but they do set how far a controller can
  # balloon before the kernel intervenes. kustomize-controller is the
  # relevant one: it builds and dry-runs the whole deploy/setup tree in
  # memory, including cert-manager's large manifest and CNPG's enormous
  # CRDs (the same ones that overflowed client-side apply's 262144-byte
  # annotation and prompted this migration). A controller free to grow
  # toward 1Gi while doing that is a plausible route into node-wide
  # MemoryPressure, which taints the node NoSchedule and stops new pods
  # starting -- exactly the symptom being chased.
  #
  # Capping at 256Mi bounds that. The tradeoff is that kustomize-controller
  # may OOM-restart on very large builds instead; that fails locally and
  # recovers, rather than taking the whole node's scheduling with it.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kustomize-controller
        namespace: flux-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  limits:
                    memory: 256Mi
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: source-controller
        namespace: flux-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  limits:
                    memory: 256Mi
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: helm-controller
        namespace: flux-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  limits:
                    memory: 256Mi
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: notification-controller
        namespace: flux-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  limits:
                    memory: 256Mi
