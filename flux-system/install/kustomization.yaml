apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/fluxcd/flux2/releases/download/v2.9.4/install.yaml

# Image tag automation is unused here, and every extra pod is real load on
# the cluster's single Raspberry Pi node.
#
# Do not regenerate this via `flux install --export` with a trimmed
# --components list -- it silently omits RBAC/quota objects unrelated to
# image automation (flux-edit, flux-view, the crd-controller
# ClusterRole/Binding, the critical-pods ResourceQuota) that this release's
# install.yaml does include. Delete the specific unused objects from the
# full official manifest instead, so everything else stays exactly as
# released.
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: image-reflector-controller
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: image-automation-controller
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: image-reflector-controller
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: image-automation-controller
        namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: imagepolicies.image.toolkit.fluxcd.io
  - patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: imagerepositories.image.toolkit.fluxcd.io
  - patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: imageupdateautomations.image.toolkit.fluxcd.io
