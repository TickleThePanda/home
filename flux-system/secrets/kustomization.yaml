# SOPS-encrypted Secrets for Flux itself. Only Flux's `flux-system`
# Kustomization (./self.yaml via ../kustomization.yaml) reads this directory,
# because it decrypts them. Don't move these under ./install or ./sync: CI
# applies those with plain `kubectl apply -k`, which can't decrypt and fails
# on the encrypted values.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./github-commit-status.sops.yaml
