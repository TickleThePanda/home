[defaults]
inventory = inventory.yml
nocows = 1
retry_files_enabled = False
host_key_checking = True
interpreter_python = /usr/bin/python3

# Gather once, reuse for the rest of the run (the --check idempotence recheck
# included). `smart` only re-gathers a host with no fresh cache entry.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_fact_cache
fact_caching_timeout = 7200

# CI reaches the host through the in-cluster cloudflared tunnel, so
# trust-on-first-use would mean trusting whatever answers on the far side. The
# key is pinned in-repo.
[inventory]
unparsed_is_failed = True

[ssh_connection]
# Mirrors node/ansible.cfg: the tunnel this connection rides on can blip when
# the node job restarts k3s. Keepalives stop a brief drop from failing an
# otherwise-fine run.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes
pipelining = True
