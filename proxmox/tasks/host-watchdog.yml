---
# PVE runs watchdog-mux on the software watchdog (softdog) by default. softdog
# is a kernel timer -- a hard kernel lockup takes it down too, so it never
# fires. This box has the chipset TCO watchdog (iTCO_wdt, B360 PCH), which
# resets from hardware regardless of kernel state. Switching to it is a cheap
# backstop for the kernel-hang case; it does nothing for the NIC hang (the
# kernel was healthy then -- that is what nic-watchdog is for).
#
# After the first apply, verify from the LAN: `wdctl` Identity must read
# something other than "Software Watchdog". If iTCO_wdt fails to bind, revert
# the WATCHDOG_MODULE line and re-run -- a bad bind risks an unexpected reset.

- name: Select the chipset watchdog for watchdog-mux
  ansible.builtin.lineinfile:
    path: /etc/default/pve-ha-manager
    regexp: '^#?\s*WATCHDOG_MODULE='
    line: WATCHDOG_MODULE=iTCO_wdt
    backup: true
  notify: switch watchdog module

- name: Load iTCO_wdt at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/proxmox-watchdog.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by proxmox/tasks/host-watchdog.yml. Do not edit on the host.
      iTCO_wdt
  notify: switch watchdog module

- name: Keep softdog out of the way
  ansible.builtin.copy:
    dest: /etc/modprobe.d/proxmox-watchdog.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by proxmox/tasks/host-watchdog.yml. Do not edit on the host.
      blacklist softdog
  notify: switch watchdog module
