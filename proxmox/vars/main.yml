---
# Debian suite the Proxmox host tracks. Bump on a major PVE / Debian upgrade
# (PVE 9 = trixie); every apt source in tasks/apt-repos.yml keys off it.
proxmox_apt_suite: trixie

# --- VM template + k3s agent VMs ------------------------------------------

# Storage / bridge names. These are the PVE 9 install defaults -- confirm on
# the host with `pvesm status` and `cat /etc/network/interfaces`. The snippet
# storage must have the "Snippets" content type enabled (Datacenter ->
# Storage) for the cloud-init vendor file.
proxmox_vm_storage: local-lvm
proxmox_snippet_storage: local
# Filesystem path behind proxmox_snippet_storage (local -> /var/lib/vz).
proxmox_snippet_dir: /var/lib/vz/snippets
proxmox_vm_bridge: vmbr0

# The PVE node name (the API `node:` target). Usually the hostname -- confirm
# with `pvesh get /nodes` on the host.
proxmox_node_name: proxmox-01

# API endpoint for community.proxmox. api_user + token come from secrets
# (PROXMOX_API_TOKEN_ID / PROXMOX_API_TOKEN_SECRET); see proxmox/README.md.
proxmox_api_host: 192.168.1.3
proxmox_api_user: root@pam
proxmox_api_token_id: "{{ lookup('ansible.builtin.env', 'PROXMOX_API_TOKEN_ID') }}"
proxmox_api_token_secret: "{{ lookup('ansible.builtin.env', 'PROXMOX_API_TOKEN_SECRET') }}"

# The CI key's public half, used as the k3s VMs' cloud-init `deploy` key.
# From an env var, not -e: `ansible-playbook -e key=value` splits the value on
# whitespace, which mangles an SSH key. CI sets K3S_VM_SSH_PUBKEY; for a
# hand-run, `export K3S_VM_SSH_PUBKEY="$(ssh-keygen -y -f ./deploy_key)"`.
k3s_vm_ssh_pubkey: "{{ lookup('ansible.builtin.env', 'K3S_VM_SSH_PUBKEY') }}"

# Debian 13 "genericcloud" image built into template VMID 9000.
proxmox_template_vmid: 9000
proxmox_template_name: debian-13-cloud
proxmox_template_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
proxmox_template_image_path: /var/lib/vz/template/iso/debian-13-genericcloud-amd64.qcow2

# The k3s agent VMs. Addresses are in the documented .32-.63 Proxmox-guest
# band. All join as agents now; k3s-vm-control-01 is cordoned (by
# k3s-cluster/) and reserved for a future promotion to server.
proxmox_vm_disk_gb: 24
k3s_vms:
  - { name: k3s-vm-control-01, vmid: 132, ip: 192.168.1.32, cores: 2, memory: 3072 }
  - { name: k3s-vm-worker-01,  vmid: 133, ip: 192.168.1.33, cores: 2, memory: 6144 }
  - { name: k3s-vm-worker-02,  vmid: 134, ip: 192.168.1.34, cores: 2, memory: 6144 }
