---
# Collections beyond ansible-core.
#
#   community.proxmox  proxmox_kvm / proxmox_disk -- VM lifecycle via the
#                      Proxmox API. Needs `proxmoxer>=2.3.0` and `requests` on
#                      the control node.
#
# The apt-repos tasks use only ansible.builtin (deb822_repository), so this
# collection is purely for the VM provisioning half.
#
# Install with:  ansible-galaxy collection install -r requirements.yml
#            and: pip install 'proxmoxer>=2.3.0' requests

collections:
  - name: community.proxmox
    version: "2.0.0"
